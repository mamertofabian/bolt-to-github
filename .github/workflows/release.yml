name: Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true

permissions:
  contents: write
  actions: read
  checks: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAID_RUNNER_SPEC: maid-runner[all]@2.27.5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Set version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_VERSION="$INPUT_VERSION"
          else
            RELEASE_VERSION="$GITHUB_REF_NAME"
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must be a stable vX.Y.Z tag" >&2
            exit 1
          fi
          echo "VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"
          if ! test "$VERSION" = "v$PACKAGE_VERSION"; then
            echo "Release tag does not match package.json version" >&2
            exit 1
          fi

          if ! test "$PACKAGE_VERSION" = "$MANIFEST_VERSION"; then
            echo "package.json and manifest.json versions differ" >&2
            exit 1
          fi

      - name: Verify release tag target
        run: bash scripts/verify-release-tag.sh "$VERSION" "$GITHUB_SHA"

      - name: Lint
        run: pnpm lint

      - name: Check types
        run: pnpm check

      - name: Run unit tests
        run: pnpm test:ci

      - name: Validate MAID behavioral contracts
        run: ./scripts/maid validate --manifest-dir manifests --mode behavioral

      - name: Validate MAID implementation contracts
        run: ./scripts/maid validate --manifest-dir manifests --mode implementation

      - name: Build project
        run: pnpm run build

      - name: Install Chromium for browser tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser release tests
        run: >-
          xvfb-run -a pnpm exec playwright test
          e2e/auth.spec.ts e2e/lifecycle.spec.ts
          e2e/error-flow-product.spec.ts e2e/manual-repo.spec.ts
          --reporter=line

      - name: Zip build artifacts
        run: |
          cd dist
          zip -r ../bolt-to-github-${{ env.VERSION }}.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: bolt-to-github-${{ env.VERSION }}.zip
          draft: false
          prerelease: false
          generate_release_notes: true
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
