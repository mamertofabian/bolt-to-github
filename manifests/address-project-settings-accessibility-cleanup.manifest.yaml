outcome:
  status: completed
  completed_at: '2026-07-14T01:18:19Z'
  summary: |
    Project-scoped repository settings are now discoverable without hover and
    operable through native keyboard behavior. Projects and GitHub repository
    cards expose persistently visible action controls inside correctly labeled
    groups, the Home project-details control opens RepoSettings with click,
    Enter, or Space, and browser coverage traverses the Projects route without
    pointer setup. The unreachable global GitHub Settings helper and its
    self-only test were deleted, along with obsolete TabsView event subscriptions.
  rationale: |
    RepoSettings remains the authoritative editor after the global repository
    form was retired, so both retained entry points must work for pointer,
    touch, and keyboard users. Native semantics avoid incomplete manual key
    handling, while deleting test-only business logic prevents the obsolete
    global editor contract from surviving as misleading dead code.
  lessons:
    - lesson_type: accessible-route-discoverability
      summary: |
        An accessible name and focusable descendant do not make a hover-hidden
        action discoverable to touch users; authoritative routes need visible
        controls independent of pointer hover.
      tags: [accessibility, touch, keyboard, repository]
      paths:
        - src/lib/components/ProjectsList.svelte
        - e2e/helpers/popup.ts
    - lesson_type: native-control-semantics
      summary: |
        A native button is safer than a role=button container with a partial
        keydown handler because click, Enter, and Space behavior stay aligned.
      tags: [accessibility, svelte, keyboard]
      paths:
        - src/lib/components/ProjectStatus.svelte
        - src/lib/components/__tests__/ProjectStatus.component.test.ts
    - lesson_type: retired-surface-cleanup
      summary: |
        Pure helpers imported only by their own tests can preserve obsolete
        product concepts after a UI surface is removed; reachability checks
        should pair deletion of the helper, self-only test, and stale allowlist.
      tags: [cleanup, dead-code, settings]
      paths:
        - src/lib/utils/github-settings.ts
        - src/lib/components/__tests__/GitHubSettings.logic.test.ts
  review_notes:
