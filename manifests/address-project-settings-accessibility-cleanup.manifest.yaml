schema: '2'
goal: Make project-scoped repository settings discoverable and keyboard-operable, then retire obsolete global-settings residue
description: |
  Follow up the connection-only GitHub Settings refactor by removing its two
  remaining accessibility barriers. Projects must expose repository actions
  without relying on mouse hover, and the project cards must not claim button
  semantics when only their child controls are actionable. Home project details
  must use native button behavior so click, Enter, and Space all open the same
  authoritative RepoSettings modal.

  The retired global editor also left a pure helper imported only by its own
  logic test. Delete both together, remove that test from the legacy-language
  allowlist, and remove obsolete save, error, and authMethodChange subscriptions
  from the TabsView event-listener smoke test. This manifest supersedes child 07
  and carries forward its remaining GitHub App-only contracts because removing
  an artifact from an approved manifest requires an explicit complete evolution.
temptations:
  - risk: Do not reveal Projects actions only on focus while leaving touch users dependent on an invisible target.
    instead: Keep the real action controls persistently visible for pointer, touch, and keyboard users.
  - risk: Do not add another manual keydown branch to the Home project-details control.
    instead: Use a native type=button element and verify Space through user-visible modal behavior.
  - risk: Do not keep the obsolete GitHub Settings helper merely because its isolated unit tests pass.
    instead: Delete the unreachable module and its self-only tests, then keep project repository behavior covered at RepoSettings and route boundaries.
  - risk: Do not restore removed TabsView events or weaken event-source guards to satisfy stale test subscriptions.
    instead: Remove only the obsolete subscriptions while retaining the active switchTab, file changes, feedback, upgrade, newsletter, and push-reminder listeners.
type: fix
supersedes:
  - 07-remove-legacy-pat-storage-and-types
