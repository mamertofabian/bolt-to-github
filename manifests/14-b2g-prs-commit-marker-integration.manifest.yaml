# draft-kind: child-planning-inventory
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: |
  Optionally append compact PRS metadata to commit bodies and parse prior PRS
  markers from repository history for later baseline analysis.
description: |
  Child draft for the b2g-production-readiness-snapshot parent epic, derived
  from docs/b2g_production_readiness_snapshot_reference.md sections 9, 14.4,
  16, and 19.3 Child 14.

  The existing export flow accepts a commit message but does not yet have a
  completed PRS composition root that can supply a ReadinessSnapshot. This
  slice therefore chooses a smaller pure commit-body adapter with an explicit
  settings input. It leaves BackgroundService, FileService, UI, and persistent
  settings wiring unchanged until the end-to-end integration slice can provide
  the snapshot at the correct boundary.

  Rationale:
  - Commit markers provide a low-cost way to discover prior B2G PRS snapshots
    without requiring an external datastore.
  - Marker inclusion should be opt-in or explicitly settings-controlled, not an
    automatic mutation of every commit body.
  - Marker parsing must be tolerant of missing, malformed, duplicate, or
    manually edited markers and must not treat generic repository commits as
    equally trustworthy history.
type: feature
files:
  create:
    - path: src/lib/prs/commitMarkers.ts
      artifacts:
        - kind: function
          name: generatePrsCommitMarker
          args:
            - name: snapshot
              type: ReadinessSnapshot
            - name: options
              type: PrsCommitMarkerOptions
          returns: string
          description: |
            Generates a bounded versioned [B2G-PRS] commit-body marker
            containing readiness state, safe summary metrics, selected top
            concerns, optional output-presence labels, and no raw
            secret-looking values.
        - kind: function
          name: appendPrsCommitMarker
          args:
            - name: commitBody
              type: string
            - name: marker
              type: string
          returns: string
          description: |
            Appends a PRS marker to a commit body without duplicating an
            existing marker block.
        - kind: function
          name: parsePrsCommitMarkers
          args:
            - name: commits
              type: GitCommitSummary[]
          returns: PrsHistoryMarker[]
          description: |
            Parses prior [B2G-PRS] marker blocks from commit messages into
            bounded provenance records suitable for identifying trusted PRS
            history. Missing, malformed, duplicate, or manually ambiguous
            markers are ignored without failing current exports.
        - kind: function
          name: buildPrsCommitBody
          args:
            - name: commitBody
              type: string
            - name: snapshot
              type: ReadinessSnapshot
            - name: settings
              type: PrsCommitMarkerSettings
            - name: options
              type: PrsCommitMarkerOptions | undefined
          returns: string
          description: |
            Returns the original commit body unchanged unless the explicit
            includeInCommitBody setting is true, then generates and appends one
            bounded marker.
        - kind: type
          name: PrsCommitMarkerOptions
          type: |
            {
              includeTopConcerns?: boolean;
              includeOutputRefs?: boolean;
              maxConcerns?: number;
            }
        - kind: type
          name: PrsHistoryMarker
          type: |
            {
              commitSha: string;
              committedAt?: string;
              state: ReadinessState;
              changedFiles: number;
              sensitiveFilesChanged: number;
              topConcerns: string[];
              source: 'b2g-prs-commit-marker';
            }
        - kind: interface
          name: GitCommitSummary
        - kind: attribute
          of: GitCommitSummary
          name: sha
          type: string
        - kind: attribute
          of: GitCommitSummary
          name: message
          type: string
        - kind: attribute
          of: GitCommitSummary
          name: committedAt
          type: string | undefined
        - kind: interface
          name: PrsCommitMarkerSettings
        - kind: attribute
          of: PrsCommitMarkerSettings
          name: includeInCommitBody
          type: boolean
    - path: src/lib/prs/__tests__/commitMarkers.test.ts
      artifacts:
        - kind: test_function
          name: generatePrsCommitMarker formats the compact marker
          description: |
            Planned behavioral test covering the exact [B2G-PRS] block for a
            Yellow snapshot and limiting top concerns.
        - kind: test_function
          name: generatePrsCommitMarker redacts secret-looking evidence
          description: |
            Planned behavioral test proving marker output never includes raw
            env values or secret fixture strings.
        - kind: test_function
          name: appendPrsCommitMarker does not duplicate an existing marker
          description: |
            Planned behavioral test covering repeated append attempts against a
            custom commit body.
        - kind: test_function
          name: parsePrsCommitMarkers returns history records for valid markers only
          description: |
            Planned behavioral test with valid, absent, malformed, and duplicate
            marker blocks in fixture commit history.
        - kind: test_function
          name: marker inclusion is controlled by explicit user settings
          description: |
            Behavioral test proving disabled settings preserve the exact body
            and enabled settings append one marker without mutating the input.
  read:
    - docs/b2g_production_readiness_snapshot_reference.md
    - manifests/drafts/b2g-production-readiness-snapshot.manifest.yaml
    - manifests/08-b2g-prs-readiness-composer.manifest.yaml
    - manifests/09-b2g-prs-report-generators.manifest.yaml
    - manifests/13-b2g-prs-history-baseline-engine.manifest.yaml
    - src/production-readiness/domain.ts
    - src/production-readiness/redaction.ts
    - src/production-readiness/rules/secret-patterns.ts
    - src/production-readiness/test-fixtures/prsFixtures.ts
validate:
  - pnpm exec vitest run src/lib/prs/__tests__/commitMarkers.test.ts
  - ./scripts/maid validate
    manifests/14-b2g-prs-commit-marker-integration.manifest.yaml --mode behavioral
  - pnpm lint
  - pnpm check
