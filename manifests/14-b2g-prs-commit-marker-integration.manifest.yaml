temptations:
  - risk: Do not silently append PRS metadata to every commit.
    instead: Gate marker insertion behind an explicit user setting or export-flow
      action and test both enabled and disabled paths.
  - risk: Do not include full reports, raw evidence dumps, or secret-looking
      values in commit bodies.
    instead: Generate only compact state and top-concern metadata after the same
      redaction boundary used by reports.
  - risk: Do not treat fallback generic GitHub commits as equivalent to B2G PRS
      markers.
    instead: Parse marker provenance explicitly and let the history engine label
      fallback history with lower confidence.
  - risk: Do not make malformed historical markers fail current exports.
    instead: Ignore malformed marker blocks, record a limitation where useful, and
      keep current commit generation deterministic.
outcome:
  status: completed
  completed_at: '2026-08-01T04:30:40Z'
  summary: |
    PRS now has a pure commit-body adapter that generates compact versioned
    markers, appends at most one marker only when an explicit setting enables
    it, and parses bounded historical markers into provenance records.

    Existing export behavior remains unchanged because runtime UI and storage
    wiring is deferred until a PRS composition root can supply a snapshot. The
    marker contains only readiness state, canonical time, safe metrics,
    redacted concern summaries, and output-presence labels rather than report
    bodies or source evidence.
  rationale: |
    Keeping marker composition pure makes opt-in behavior deterministic and
    testable without coupling the slice to BackgroundService or FileService
    before snapshot orchestration exists. Whole-concern redaction, shared
    secret-pattern rules, strict bounds, canonical timestamps, explicit state
    validation, and ambiguity rejection prevent durable Git history from
    becoming an accidental credential or unbounded-data sink.
  lessons:
    - lesson_type: redact-durable-metadata-conservatively
      summary: |
        Commit history is durable and broadly visible. When arbitrary concern
        text contains provider tokens, auth schemes, credential-bearing
        identifiers, or credential vocabulary, redact the entire concern
        rather than attempting partial value replacement.
      tags: [privacy, git-history, redaction]
      paths:
        - src/lib/prs/commitMarkers.ts
        - src/lib/prs/__tests__/commitMarkers.test.ts
    - lesson_type: reuse-secret-rules-at-output-boundaries
      summary: |
        Marker generation and historical parsing should share the repository's
        established secret-pattern detector, supplemented by a conservative
        prose boundary, so provider formats and manually edited markers receive
        equivalent protection.
      tags: [privacy, secret-detection, consistency]
      paths:
        - src/lib/prs/commitMarkers.ts
        - src/production-readiness/rules/secret-patterns.ts
    - lesson_type: defer-runtime-wiring-until-data-exists
      summary: |
        A commit-message integration should remain a pure explicit adapter when
        the runtime export flow cannot yet supply its required snapshot. This
        preserves current pushes and gives the later composition slice a narrow
        tested boundary to call.
      tags: [architecture, integration, settings]
      paths:
        - src/lib/prs/commitMarkers.ts
  review_notes:
    - source: independent reviewers revisions 1 through 7
      severity: findings-fixed
      summary: |
        Read-only reviews identified generic and quoted credential leakage,
        provider-token and free-form prose bypasses, noncanonical timestamp
        injection, ambiguous concern sections, inherited readiness keys, weak
        revised red evidence, mixed-case credential identifiers, and bare HTTP
        authorization schemes. Each valid finding received assertion-level
        regression coverage and a locked plan revision before implementation.
    - source: independent reviewer /root/slice14_revision8_reviewer
      severity: ready
      summary: |
        The final review found no P0, P1, or P2 issues and confirmed privacy
        handling, settings gating, idempotency, parser ambiguity rejection,
        bounds, deferred integration, declared scope, and revision-8 plan-lock
        integrity.
