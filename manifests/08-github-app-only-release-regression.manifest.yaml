schema: '2'
goal: |
  Convert end-to-end fixtures, release notes, and repository documentation to
  the final GitHub App-only authentication and migration contract.
description: |
  Eighth and final child of github-app-only-authentication.

  Browser fixtures must stop seeding PAT as a shortcut to protected surfaces.
  Product E2E state instead includes a Bolt2GitHub session, GitHub App
  installation metadata, and mocked live connection behavior. A dedicated
  migration fixture starts with a legacy PAT and verifies the visible upgrade
  message, absence of automatic tab navigation, preserved project settings,
  and blocked GitHub actions until live GitHub App connection succeeds.

  README setup, security, troubleshooting, and newcomer guidance must state
  that a Bolt2GitHub account and GitHub App are required. The release note must
  explain the intentional removal, migration steps, and preserved repository
  mappings without claiming telemetry proved zero PAT users. Chrome Web Store
  listing edits are an external release task and cannot be claimed as a repo
  artifact.

  The accessible What's New history must not continue advertising “Dual auth -
  PAT or GitHub App” after the current product removes that choice. Preserve the
  historical fact that GitHub App support arrived in v1.3.2, but reword the
  entry so it cannot be read as current PAT setup guidance.

  The final source guard must use a precise allowlist. It bans PAT strategies,
  token constructors, auth selectors, token-creation constants, and actionable
  PAT UI copy. It allows the legacy identifiers required by
  githubAuthMigration.ts and its explicit migration fixtures, and it must not
  reject accurate internal references to short-lived GitHub App installation
  tokens, Supabase session tokens, or privacy promises about credential
  collection.

  Per the repository's learned fast-gate constraint, Playwright commands remain
  release evidence rather than active manifest validate commands. Fast helper
  tests, Vitest, lint, check, and build remain in validate.
temptations:
  - risk: Do not keep PAT-seeded E2E fixtures just because they are faster to arrange.
    instead: Build a reusable GitHub App connected fixture that satisfies the same live connection contract as production.
  - risk: Do not delete migration coverage after converting happy-path tests.
    instead: Keep one explicit legacy PAT browser scenario that verifies guidance, preserved settings, no auto-navigation, and blocked actions.
  - risk: Do not state that no users used PAT or that the database count measured standalone users.
    instead: Describe PAT usage as unknown and the removal as an intentional product simplification after a long recommendation period.
  - risk: Do not put Playwright commands in the promoted manifest validate list.
    instead: Run browser suites as release validation and cite their results in Outcome after implementation review.
  - risk: Do not implement the final guard as a blanket ban on the word token.
    instead: Ban exact PAT execution identifiers and setup phrases, allow only migration-specific PAT paths, and retain technically accurate GitHub App/Supabase token language.
type: refactor
