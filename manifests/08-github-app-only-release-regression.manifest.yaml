outcome:
  status: completed
  summary: |
    Release-facing browser fixtures, onboarding copy, current documentation,
    release history, and analytics now describe and exercise a Bolt2GitHub
    account plus GitHub App as the only supported GitHub connection. One
    explicit legacy-credential browser scenario proves visible migration,
    credential cleanup, preserved project mappings, and recovery after a live
    GitHub App connection; all other browser and unit fixtures avoid PAT-shaped
    connected state.
  rationale: |
    The final release contract removes the remaining dual-auth ambiguity while
    retaining a safe migration boundary for users whose standalone PAT usage
    could not be measured. A precise source guard prevents actionable PAT
    setup, selectors, strategies, and steady credential fixtures from
    returning, without banning accurate short-lived GitHub App or Supabase
    token language.
  lessons:
    - lesson_type: release-regression-boundary
      summary: |
        Authentication retirement needs a repository-wide guard that separates
        steady product and test setup from narrowly named migration and
        compatibility fixtures; a broad vocabulary allowlist alone can hide
        retired credentials in ordinary tests.
      tags:
        - auth
        - migration
        - testing
      paths:
        - src/test/auth/githubAppOnlySourceGuard.test.ts
        - src/test/e2e-helpers/popup-helpers.test.ts
    - lesson_type: browser-auth-fixtures
      summary: |
        Connected MV3 browser scenarios must seed the same session,
        installation, and live-verification authority as production. Only the
        explicit upgrade scenario should originate from a retired credential;
        other migration screens can start from the durable marker.
      tags:
        - e2e
        - mv3
        - github-app
      paths:
        - e2e/helpers/storage.ts
        - e2e/auth.spec.ts
        - e2e/lifecycle.spec.ts
        - e2e/manual-repo.spec.ts
    - lesson_type: deterministic-active-tab
      summary: |
        Browser tests that depend on the active Bolt tab should activate the
        exact tab through chrome.tabs and verify its URL before reloading the
        extension page; window focus alone is timing-dependent.
      tags:
        - e2e
        - chrome-extension
        - reliability
      paths:
        - e2e/error-flow-product.spec.ts
  review_notes:
    - source: independent reviewer subagent child08_release_regression_review
      severity: changes-requested
      summary: |
        Found that the initial compatibility allowlist let steady PAT fixtures
        pass and that three browser scenarios originated from the legacy
        credential helper. Both findings were accepted: steady fixtures were
        cleaned, the guard gained a narrow fixture allowlist, and only the auth
        migration scenario now seeds a retired credential.
    - source: independent reviewer subagent child08_final_review
      severity: ready
      summary: |
        Final read-only review found no blocking or should-fix findings and
        confirmed the precise fixture guard, single credential-origin browser
        scenario, cleaned cited fixtures, deterministic Bolt-tab activation,
        current plan lock, and successful focused and browser validation.
