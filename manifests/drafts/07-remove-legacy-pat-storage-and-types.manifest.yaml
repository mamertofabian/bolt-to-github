# draft-kind: child-planning-inventory
schema: '2'
goal: |
  Remove PAT credentials and authentication-choice state from shared storage,
  settings, types, helpers, and usage contracts after runtime PAT code is gone.
description: |
  Seventh child of github-app-only-authentication. Planning inventory only.

  This cleanup makes the final static model match the product model. Shared
  settings no longer expose githubToken or a pat/github_app choice. GitHub App
  installation metadata and the temporary migration-required marker remain in
  local storage; repoOwner and projectSettings remain in sync storage. Legacy
  keys are read only inside the idempotent migration module until the marker is
  retired in a future release.

  Existing usage data may contain historical authMethod='pat'. Runtime parsing
  must tolerate that old stored value while new events emit only github-app or
  none; do not reinterpret historical PAT records as current GitHub App usage.

  githubAppSync.ts must also lose its method-switching vocabulary. It currently
  reads authenticationMethod, exposes authMethod='pat' in getGitHubAppInfo(),
  returns PAT on error, and exports switchToGitHubApp() even though no production
  caller uses that function. GitHub App status must derive from installation
  metadata and live sync results without a legacy method selector.
temptations:
  - risk: 'Do not remove the migration module legacy-key reads together with normal settings fields.'
    instead: 'Keep legacy reads isolated in githubAuthMigration.ts while deleting them from all steady-state storage and settings APIs.'
  - risk: 'Do not clear repoOwner or projectSettings because they shared an object with githubToken.'
    instead: 'Write and test field-level storage cleanup that preserves every non-secret repository mapping.'
  - risk: 'Do not coerce historical PAT analytics records to github-app.'
    instead: 'Accept legacy persisted values on read if necessary, but emit only the new current-state vocabulary.'
  - risk: 'Do not leave switchToGitHubApp or authMethod=pat fallbacks in a utility named for GitHub App sync.'
    instead: 'Remove the unused switch function and make status/info results GitHub App-specific with visible error states.'
type: refactor
files:
  edit:
