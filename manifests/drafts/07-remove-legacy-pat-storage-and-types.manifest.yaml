    - path: src/lib/utils/__tests__/githubAppSync.test.ts
      artifacts:
        - kind: test_function
          name: GitHub App status derives from installation metadata without reading authenticationMethod
        - kind: test_function
          name: GitHub App info never returns PAT on success or failure
        - kind: test_function
