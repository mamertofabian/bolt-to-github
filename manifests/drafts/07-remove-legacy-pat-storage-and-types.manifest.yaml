          args: []
          returns: "Promise<{ isConfigured: boolean; username?: string; avatarUrl?: string; installationId?: number }>"
          description: Determines configuration from GitHub App installation metadata without a legacy auth-method selector.
        - kind: function
          name: getGitHubAppInfo
          args: []
          returns: "Promise<{ isConfigured: boolean; username?: string; avatarUrl?: string; expiresAt?: string; scopes?: string[]; needsRefresh?: boolean }>"
          description: Returns GitHub App-specific information and never emits PAT as a fallback state.
    - path: src/lib/stores/__tests__/githubSettings.test.ts
      artifacts:
