          of: GitHubSettingsInterface
          type: string
        - kind: attribute
          name: projectSettings
          of: GitHubSettingsInterface
          type: ProjectSettings | undefined
        - kind: attribute
          name: githubAppInstallationId
          of: GitHubSettingsInterface
          type: number | undefined
        - kind: attribute
          name: githubAppUsername
          of: GitHubSettingsInterface
          type: string | undefined
        - kind: attribute
          name: githubAppAvatarUrl
          of: GitHubSettingsInterface
          type: string | undefined
        - kind: attribute
