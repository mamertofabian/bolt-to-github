    - path: src/lib/services/__tests__/chromeStorage.RaceConditions.test.ts
      artifacts:
        - kind: test_function
          name: concurrent GitHub App settings writes never restore PAT method or credential fields
    - path: src/lib/components/__tests__/RepoSettings.logic.test.ts
      artifacts:
        - kind: test_function
          name: repository settings helpers expose no PAT method or token service configuration
  scope:
    - path: src/lib/services/chromeStorage.ts
      reason: Remove GITHUB_TOKEN, AUTHENTICATION_METHOD, preference, and old migration-prompt APIs from steady-state storage.
    - path: src/lib/stores/githubSettings.ts
      reason: Remove token state, PAT validation, method switching, and dual-auth validity branches.
    - path: src/services/settings.ts
      reason: Make settings validity depend on GitHub App connection and repository data only.
    - path: src/lib/utils/github-settings.ts
      reason: Remove PAT input and permission-check helpers from shared settings logic.
    - path: src/lib/utils/repo-settings.ts
      reason: Remove dual-auth GitHub service config construction.
    - path: src/background/UsageTracker.ts
      reason: Emit only github-app or none for current auth-method usage.
    - path: src/content/services/SupabaseAuthService.ts
      reason: Stop writing or checking authenticationMethod while preserving installation sync and session cleanup boundaries.
