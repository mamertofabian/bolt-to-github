    - manifests/drafts/04-github-app-only-repository-surfaces.manifest.yaml
    - manifests/drafts/05-github-app-only-issue-feedback-surfaces.manifest.yaml
    - manifests/prevent-github-token-request-stampede.manifest.yaml
    - src/services/GitHubAppAuthenticationStrategy.ts
