# draft-kind: child-planning-inventory
schema: '2'
goal: |
  Delete the PAT authentication strategy and collapse UnifiedGitHubService to
  the GitHub App authentication contract after all runtime callers are migrated.
description: |
  Sixth child of github-app-only-authentication. Planning inventory only.

  Once background, content, repository, issue, and feedback callers use the
  GitHub App configuration, the legacy strategy is removed rather than left as
  unreachable fallback code. AuthenticationStrategyFactory is also removed:
  with one supported strategy, a dual-strategy selector adds no value and can
  reintroduce fallback behavior. UnifiedGitHubService directly owns the GitHub
  App strategy lifecycle and no longer accepts a token string or PAT config.

  GitHub App request coalescing, identity isolation, token renewal, and visible
  errors remain unchanged. This child must evolve the existing request-stampede
  contract instead of silently invalidating it.

  TokenService and ITokenService are also deleted in this slice. Repository
  inspection shows they are PAT-format and PAT-permission validation code used
  only by their own unit test, with no production importer. Keeping them would
  preserve an orphaned PAT implementation after the advertised retirement.

  UnifiedGitHubService also loses its unused backward-compatibility methods for
  simple token validation, classic/fine-grained PAT detection, and destructive
  PAT permission probing. Their only production callers live in the PAT
  settings flow removed by earlier children; retaining them would leave a
  callable PAT-era surface despite deleting the strategy.
temptations:
  - risk: 'Do not leave PATAuthenticationStrategy or createPATStrategy as dead compatibility code.'
    instead: 'Delete the files/symbols and use removed_artifacts plus TypeScript checks to prove no production reference remains.'
  - risk: 'Do not replace PAT fallback with a hidden unauthenticated placeholder strategy.'
    instead: 'Fail visibly when GitHub App auth is unavailable and keep the live connection gate responsible for user guidance.'
  - risk: 'Do not weaken GitHub App single-flight or account-isolation behavior while simplifying construction.'
    instead: 'Retain the request-policy tests and add GitHub App-only constructor/authentication assertions before removal.'
  - risk: 'Do not keep the unused classic/fine-grained TokenService as a supposedly generic helper.'
    instead: 'Delete TokenService, ITokenService, and their isolated unit test after confirming no production import remains.'
type: refactor
files:
  edit:
    - path: src/services/UnifiedGitHubService.ts
      artifacts:
        - kind: class
          name: UnifiedGitHubService
          description: GitHub API facade backed exclusively by GitHubAppAuthenticationStrategy.
        - kind: method
          name: constructor
          of: UnifiedGitHubService
          args:
            - name: authConfig
              type: AuthenticationConfig | undefined
          returns: UnifiedGitHubService
        - kind: method
          name: getAuthenticationType
          of: UnifiedGitHubService
          args: []
          returns: Promise<'github_app'>
    - path: src/services/types/authentication.ts
      artifacts:
        - kind: type
          name: AuthenticationType
          type: "'github_app'"
        - kind: interface
          name: AuthenticationConfig
          description: GitHub App-only construction input with no PAT token field.
        - kind: attribute
          name: type
          of: AuthenticationConfig
          type: "'github_app'"
        - kind: attribute
          name: githubAppConfig
          of: AuthenticationConfig
          type: GitHubAppConfig | undefined
    - path: src/services/__tests__/UnifiedGitHubService.auth-selection.test.ts
      artifacts:
        - kind: test_function
          name: UnifiedGitHubService always selects GitHub App authentication
        - kind: test_function
          name: missing live GitHub App credentials fail visibly without PAT fallback
        - kind: test_function
          name: account changes retain identity-isolated GitHub App token acquisition
  delete:
    - path: src/services/PATAuthenticationStrategy.ts
      reason: PAT authentication is no longer supported.
    - path: src/services/__tests__/PATAuthenticationStrategy.test.ts
      reason: PAT-only behavioral coverage is obsolete after strategy removal.
    - path: src/services/AuthenticationStrategyFactory.ts
      reason: A multi-strategy factory is unnecessary when GitHub App is the sole strategy.
    - path: src/services/__tests__/AuthenticationStrategyFactory.test.ts
      reason: Dual-strategy factory behavior is intentionally removed.
    - path: src/services/TokenService.ts
      reason: Unused classic/fine-grained PAT validation and destructive permission probing are obsolete.
    - path: src/services/interfaces/ITokenService.ts
      reason: The interface exists only for the removed PAT validation service.
    - path: src/services/__tests__/TokenService.test.ts
      reason: The test covers only the orphaned PAT validation service being deleted.
  scope:
    - path: src/services/interfaces/IAuthenticationStrategy.ts
      reason: Remove IAuthenticationStrategyFactory while preserving the GitHub App strategy interface.
    - path: src/services/githubAppRequestPolicy.ts
      reason: Remove stored-method PAT resolution while preserving request coalescing and identity policy.
    - path: src/services/__tests__/UnifiedGitHubService.comprehensive.test.ts
      reason: Replace PAT/string-constructor scenarios with GitHub App-only facade behavior.
    - path: src/services/__tests__/UnifiedGitHubService.working.test.ts
      reason: Remove PAT fixtures and retain representative GitHub App operations.
    - path: src/services/__tests__/githubAppRequestPolicy.test.ts
      reason: Remove stored PAT resolution assertions while retaining request-policy coverage.
    - path: src/services/__tests__/UnifiedGitHubService.focused.test.ts
      reason: Remove direct PAT constructor, format-detection, and PAT-operation scenarios while retaining focused GitHub App behavior.
    - path: src/services/__tests__/test-fixtures/README.md
      reason: Remove PAT strategy, token fixture, and dual-auth factory documentation.
    - path: src/services/__tests__/test-fixtures/unified/helpers/TestHelpers.ts
      reason: Remove PAT auth-config and token-generation helpers.
    - path: src/services/__tests__/test-fixtures/unified/index.ts
      reason: Remove PAT examples and exports from the unified fixture entry point.
    - path: src/services/__tests__/test-fixtures/unified/mocks/MockAuthStrategies.ts
      reason: Delete MockPATAuthenticationStrategy and the obsolete dual-strategy mock factory while retaining the GitHub App strategy fake.
    - path: src/services/__tests__/test-fixtures/unified/mocks/MockChromeStorage.ts
      reason: Remove authenticationMethod PAT defaults and loaders from storage fixtures.
    - path: src/services/__tests__/test-fixtures/unified/scenarios/TestScenarios.ts
      reason: Replace PAT success and failure scenarios with GitHub App-only scenarios.
    - path: src/services/__tests__/test-fixtures/unified/storage/StorageFixtures.ts
      reason: Remove PAT token and authenticationMethod fixtures while preserving GitHub App storage fixtures.
    - path: src/services/__tests__/test-fixtures/unified/tokens/TestTokens.ts
      reason: Remove classic/fine-grained PAT fixture families and keep only fake values required for GitHub App and invalid-token safety tests.
  read:
