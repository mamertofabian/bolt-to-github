# draft-kind: child-planning-inventory
schema: '2'
goal: |
  Define an idempotent policy that detects legacy PAT state, records a durable
  GitHub App migration requirement, removes the stored PAT, and preserves all
  repository and project configuration.
description: |
  First child of github-app-only-authentication. This is planning inventory and
  is not promotion-ready until the planned behavioral tests exist, the red
  phase is confirmed, and behavioral validation passes.

  The policy separates pure classification from Chrome storage effects. A PAT
  selected or stored without a live GitHub App connection becomes
  migration_required. A stale PAT beside an already connected GitHub App is
  removed without disrupting that connection. Fresh unconfigured users remain
  unconfigured rather than being mislabeled as migrations.

  The storage operation is one-way, ordered, and idempotent: it records the
  local migration marker before removing githubToken from sync storage and
  legacy method-choice keys from local storage, and never changes repoOwner,
  projectSettings, repository names, or branches. Completion clears the marker
  only after the caller has confirmed a live account session and installation.
temptations:
  - risk: 'Do not combine PAT detection with network verification or tab navigation.'
    instead: 'Keep classification pure, make storage mutation explicit, and let existing live-connection authorities verify the completed GitHub App state.'
  - risk: 'Do not make repeated extension startup erase or rewrite unrelated storage.'
    instead: 'Make migration idempotent and assert the second run produces no additional destructive writes.'
  - risk: 'Do not pretend local and sync Chrome storage mutations are atomic across namespaces.'
    instead: 'Write the explanatory local marker first, remove the sync PAT second, and verify retries repair either partially completed state.'
  - risk: 'Do not clear the migration marker from cached installation metadata alone.'
    instead: 'Require the integration caller to supply confirmed live session plus installation readiness before completion.'
type: refactor
files:
  create:
    - path: src/lib/services/githubAuthMigration.ts
      artifacts:
        - kind: type
          name: GitHubAppMigrationStatus
          type: "'not_required' | 'migration_required' | 'completed'"
        - kind: interface
          name: LegacyGitHubAuthSnapshot
          description: Legacy auth and connection fields needed for a pure migration decision.
        - kind: attribute
          name: authenticationMethod
          of: LegacyGitHubAuthSnapshot
          type: "'pat' | 'github_app' | undefined"
        - kind: attribute
          name: githubToken
          of: LegacyGitHubAuthSnapshot
          type: string | undefined
        - kind: attribute
          name: githubAppInstallationId
          of: LegacyGitHubAuthSnapshot
          type: number | undefined
        - kind: attribute
          name: migrationRequired
          of: LegacyGitHubAuthSnapshot
          type: boolean | undefined
        - kind: interface
          name: GitHubAuthMigrationDecision
          description: Exact one-way cleanup and user-state decision produced from legacy storage.
        - kind: attribute
          name: status
          of: GitHubAuthMigrationDecision
          type: GitHubAppMigrationStatus
        - kind: attribute
          name: removeStoredPat
          of: GitHubAuthMigrationDecision
          type: boolean
        - kind: attribute
          name: removeLegacyMethodKeys
          of: GitHubAuthMigrationDecision
          type: boolean
        - kind: attribute
          name: persistMigrationRequired
          of: GitHubAuthMigrationDecision
          type: boolean
        - kind: function
          name: resolveGitHubAuthMigration
          args:
            - name: snapshot
              type: LegacyGitHubAuthSnapshot
          returns: GitHubAuthMigrationDecision
          description: Pure classification for legacy PAT, mixed, connected-app, and fresh-install states.
        - kind: function
          name: migrateLegacyGitHubAuthentication
          args: []
          returns: Promise<GitHubAuthMigrationDecision>
          description: Applies the decision to Chrome storage without changing repository or project configuration.
        - kind: function
          name: completeGitHubAppMigration
          args:
            - name: liveSessionConnected
              type: boolean
            - name: installationConnected
              type: boolean
          returns: Promise<boolean>
          description: Clears the migration marker only when both live prerequisites are confirmed.
    - path: src/lib/services/__tests__/githubAuthMigration.test.ts
      artifacts:
        - kind: test_function
          name: legacy PAT becomes migration required and the token is removed
        - kind: test_function
          name: stale PAT beside a connected GitHub App is removed without migration blocking
        - kind: test_function
          name: fresh unconfigured storage is not mislabeled as a PAT migration
        - kind: test_function
          name: migration preserves repository owner and every project mapping
        - kind: test_function
          name: repeated migration is idempotent
        - kind: test_function
          name: retry repairs a marker-written token-not-yet-removed partial migration
        - kind: test_function
          name: completion requires both a live session and installation
  read:
    - manifests/drafts/github-app-only-authentication.manifest.yaml
    - src/lib/services/chromeStorage.ts
    - src/lib/types.ts
    - src/lib/utils/githubConnection.ts
    - src/content/services/SupabaseAuthService.ts
validate:
  - pnpm exec vitest run src/lib/services/__tests__/githubAuthMigration.test.ts
  - ./scripts/maid validate manifests/01-github-app-only-migration-policy.manifest.yaml --mode behavioral
  - pnpm lint
  - pnpm check
