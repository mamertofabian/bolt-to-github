# draft-kind: child-planning-inventory
schema: '2'
goal: |
  Remove PAT token parameters from GitHub issue management and feedback
  workflows while preserving visible connection failures.
description: |
  Fifth child of github-app-only-authentication. Planning inventory only.

  Issue and feedback flows currently accept githubToken props/parameters and
  choose an auth strategy internally. They must instead create the GitHub App
  service after the common live gate succeeds. The issue store public methods
  should accept repository identity and issue data only; auth remains an
  infrastructure concern rather than a UI parameter.
temptations:
  - risk: 'Do not keep unused githubToken parameters for compatibility.'
    instead: 'Change the public store/component contracts, update all callers, and let TypeScript expose missed token plumbing.'
  - risk: 'Do not make issue or feedback failures disappear when the account is disconnected.'
    instead: 'Surface the shared migration/auth connection message before attempting GitHub API calls.'
  - risk: 'Do not bypass the live gate because the issue modal was opened from an already-rendered popup.'
    instead: 'Verify readiness at the public issue/feedback action boundary immediately before work.'
type: refactor
files:
  edit:
    - path: src/lib/stores/issuesStore.ts
      artifacts:
        - kind: function
          name: loadIssues
          args:
            - name: owner
              type: string
            - name: repo
              type: string
            - name: state
              type: "'open' | 'closed' | 'all'"
            - name: forceRefresh
              type: boolean | undefined
          returns: Promise<Issue[]>
        - kind: function
          name: createIssue
          args:
            - name: owner
              type: string
            - name: repo
              type: string
            - name: issue
              type: "{ title: string; body?: string }"
          returns: Promise<Issue>
        - kind: function
          name: updateIssue
          args:
            - name: owner
              type: string
            - name: repo
              type: string
            - name: issueNumber
              type: number
            - name: update
              type: "{ state?: 'open' | 'closed'; title?: string; body?: string }"
          returns: Promise<Issue>
    - path: src/lib/stores/__tests__/issuesStore.test.ts
      artifacts:
        - kind: test_function
          name: issue store uses GitHub App authentication without token arguments
        - kind: test_function
          name: issue operations fail visibly when live connection is unavailable
    - path: src/popup/components/__tests__/FeedbackModal.component.test.ts
      artifacts:
        - kind: test_function
          name: feedback submission uses GitHub App authentication without a PAT prop
    - path: src/lib/components/__tests__/IssueManager.component.test.ts
      artifacts:
        - kind: test_function
          name: issue manager loads creates and updates issues without a PAT prop
    - path: src/lib/components/__tests__/QuickIssueForm.component.test.ts
      artifacts:
        - kind: test_function
          name: quick issue form submits without a PAT prop
  scope:
    - path: src/lib/components/IssueManager.svelte
      reason: Remove githubToken prop/readiness conditions and use token-free issue store methods.
    - path: src/lib/components/QuickIssueForm.svelte
      reason: Remove githubToken prop from quick issue submission.
    - path: src/popup/components/FeedbackModal.svelte
      reason: Remove PAT construction and token prop from feedback submission.
    - path: src/popup/App.svelte
      reason: Stop passing a PAT to FeedbackModal and issue surfaces.
    - path: src/lib/components/ProjectStatus.svelte
      reason: Stop passing token placeholders into issue components.
  read:
    - manifests/drafts/03-github-app-only-runtime-enforcement.manifest.yaml
    - src/lib/utils/githubConnection.ts
    - src/services/UnifiedGitHubService.ts
validate:
  - pnpm exec vitest run src/lib/stores/__tests__/issuesStore.test.ts src/lib/components/__tests__/IssueManager.component.test.ts src/lib/components/__tests__/QuickIssueForm.component.test.ts src/popup/components/__tests__/FeedbackModal.component.test.ts
  - ./scripts/maid validate manifests/05-github-app-only-issue-feedback-surfaces.manifest.yaml --mode behavioral
  - pnpm lint
  - pnpm check
  - pnpm build
created: '2026-07-13T11:57:50+08:00'
metadata:
