# draft-kind: parent-epic
schema: '2'
goal: |
  Safely migrate an existing Bolt project from its established Bolt to GitHub
  repository to the duplicate repository created by bolt.new native GitHub
  setup without losing repository content, hiding divergence, or deleting the
  original repository.
description: |
  Sibling planning epic for the existing-project case identified after the
  new-project native sync handoff was drafted. The starting state is materially
  different:
  - a Bolt project already exists;
  - Bolt to GitHub already maps that project to repository A; and
  - enabling bolt.new native GitHub integration creates repository B instead of
    attaching repository A.

  Repository B is therefore a duplicate with an unrelated Git history, not a
  proven continuation of repository A. Changing the extension mapping from A
  to B without comparison could strand Cursor commits, overwrite Bolt changes,
  or make users believe history was migrated when it was not.

  The safe workflow is a canonical-repository migration:
  1. Preflight the current Bolt project export against repository A. If the
     contents differ, stop and route instead of dead-ending. The common
     motivating case is repository A carrying newer external commits (for
     example from Cursor) that Bolt never received; for that case the supported
     reconciliation route is re-importing A into a new Bolt project through the
     sibling private-import handoff lane when A is private. A normal Bolt to
     GitHub push is offered only with an explicit warning that it would
     overwrite newer repository content with Bolt's older workspace. The
     migration must not choose a winner silently.
     The preflight uses a dedicated raw-ZIP inventory that includes empty and
     binary files and never suppresses tracked paths through .gitignore. If the
     Bolt export cannot represent a tracked mode or entry type, the result is
     indeterminate and migration remains blocked. Because repository A was
     written by the extension's own push path — which filters through
     .gitignore, skips whitespace-only files, and reports "up to date" through
     normalized comparison — byte-level export-versus-A differences can exist
     on healthy projects. Differences attributable to that documented
     export-writer policy are classified and explicitly acknowledgeable rather
     than silently equated or treated as unexplained drift.
  2. Persist the project ID, authenticated personal owner, repository A, branch,
     verified A HEAD, and preflight result before the user enables native GitHub
     in Bolt.
  3. The user enables bolt.new native GitHub setup, attests that Bolt created
     repository B, and explicitly selects B under the already configured owner.
  4. Compare the complete tracked Git trees of A and B at captured branch HEADs.
     Matching entry paths, modes, types, and object IDs establish tracked-content
     equivalence even though commit histories differ. A and B are written by two
     different writers — the extension's gitignore-filtered push path wrote A,
     while Bolt's native integration writes B — so systematic writer differences
     are expected, not exceptional. Differences matching a versioned,
     evidence-derived classification of benign Bolt-writer differences
     (established by the mandatory A-versus-B writer research gate) are listed
     entry-by-entry and may be explicitly acknowledged by the user; every
     unclassified added, removed, or changed entry blocks automatic adoption and
     produces a visible reconciliation report.
     Git LFS repositories are unsupported in the MVP: detected LFS attributes,
     pointer blobs, missing payload evidence, or uncertain LFS classification
     return an indeterminate blocked result rather than equivalence.
  5. Immediately before switching the mapping, re-read both branch HEADs. If
     either changed, invalidate the comparison and require a fresh one.
  6. When content is equivalent, persist an explicit switch intent, revalidate
     both HEADs, map only the current Bolt project to B, record A as the preserved
     legacy repository, and complete the migration through deterministic phases.

  This lane serves projects whose Bolt workspace and repository A already
  agree, modulo classified writer differences. Projects that drifted because
  external commits landed in A are expected to exit through the re-import route
  above; that exit is a supported preflight outcome, not a failure.

  This workflow manages duplication; it does not pretend duplication did not
  occur. Repository A retains its original Git history and remains untouched
  during migration. Repository B becomes the user-confirmed canonical
  repository for future Bolt native sync and Bolt to GitHub operations.
  Extension-performed history transplantation, extension force pushes,
  automatic repository deletion, and automatic conflict resolution remain
  outside the MVP. If the history-transplant research gate proves bolt.new
  native sync survives replacing B's fresh history with A's history, the
  completion UI may present a documented, user-executed local Git recipe for
  preserving A's history in B; the extension itself still never force-pushes.
  The recipe must first verify that B's current HEAD still equals the compared
  pinned HEAD and must abort when Bolt has created newer commits, so the
  rewrite can never destroy Bolt-created history.
  After completion, the user may retire repository A only through the shared
  explicit duplicate-cleanup step defined by the sibling epic's child
  05-native-sync-duplicate-cleanup.

  The existing RepoCloneService is not a migration engine for this workflow. It
  copies files with separate per-file commits, does not preserve source history,
  and is not an atomic two-repository reconciliation mechanism. Implementation
  must use it neither to hide divergence nor to make B appear equivalent to A.

  This draft is non-promotable parent planning inventory. Each child below must
  become an implementation-sized manifest with exact public artifacts,
  behavioral tests, confirmed red phase, behavioral MAID validation, and user
  approval before promotion.

  Product and safety boundaries:
  - Repository A remains the active mapping until every required preflight,
    attestation, repository comparison, and HEAD recheck passes.
  - Repository A is never made public, renamed, archived, or deleted
    automatically. After migration completes, the user may archive or delete A
    only through the shared explicit duplicate-cleanup step (typed
    repository-name confirmation; archive recommended; delete requires
    history-loss acknowledgment).
  - Repository B is never assumed to be Bolt-linked merely because it is recent
    or accessible. Native setup is explicitly user-attested.
  - Repository ownership is limited to the authenticated personal username
    currently stored as global repoOwner. Organization and cross-owner migration
    require a separate owner-architecture feature.
  - Content equivalence does not mean history equivalence. The UI must preserve
    a link to A and state that its history was not copied to B.
  - Any uncertainty, inaccessible branch, truncated Git tree, concurrent HEAD
    change, or content mismatch blocks automatic canonical switching.
  - Before the mapping commit point, abandoning or failing migration leaves
    repository A mapped and usable. After B is already mapped, cancellation is
    unavailable and recovery completes forward to B without deleting A.
  - A shared journey-routing record permits only one native-sync journey per
    project. This lane requires explicit repository-settings initiation and no
    private-import provenance, independent of any auto-created default mapping.
  - The re-import route assumes repository A is private. A public repository A
    re-imports through the direct bolt.new URL without temporary-import
    metadata, exits both native-sync lanes without a journey or
    superseded-repository record, and its duplicate cleanup stays manual until
    a public-import handoff exists as follow-up work.
type: feature
files:
  create:
    - path: manifests/drafts/existing-bolt-project-native-repository-migration.manifest.yaml
      artifacts:
        - kind: type
          name: ExistingBoltProjectNativeRepositoryMigrationParentEpic
          type: MAID parent epic planning inventory
          description: |
            Non-promotable parent draft defining the existing-project
            repository-duplication workflow, equivalence gate, canonical
            mapping transition, recovery contract, and child manifest split.
  read:
    - docs/draft-manifest-workflow.md
    - manifests/README.md
    - manifests/drafts/README.md
    - manifests/drafts/native-github-sync-handoff.manifest.yaml
    - src/lib/components/RepoSettings.svelte
    - src/lib/fileUtils.ts
    - src/lib/types.ts
    - src/lib/stores/githubSettings.ts
    - src/services/GitHubComparisonService.ts
    - src/services/RepoCloneService.ts
    - src/services/RepositoryService.ts
    - src/services/zipHandler.ts
validate:
  - ./scripts/maid validate manifests/drafts/existing-bolt-project-native-repository-migration.manifest.yaml --mode schema
created: '2026-07-15T15:12:13+08:00'
metadata:
  tags:
    - native-github-sync
    - existing-bolt-project
    - repository-migration
    - duplicate-repository
    - content-equivalence
    - parent-epic
  priority: high
  status: planning
  promotable: false
  related_epics:
    - manifests/drafts/native-github-sync-handoff.manifest.yaml
  evidence:
    maintainer_observation:
      - As observed on 2026-07-15, enabling bolt.new native GitHub integration
        for an existing unconnected project creates a new GitHub repository
        rather than attaching its established Bolt to GitHub repository.
    repository_findings:
      - ProjectSetting stores repository name and branch per project while
        repoOwner remains global, so the MVP cannot safely change owner for only
        one project.
      - GitHubComparisonService compares a Bolt export with one GitHub branch,
        which can support the repository-A preflight but does not compare two
        GitHub repositories directly.
      - Git tree entry paths, modes, types, and object IDs can establish exact
        tracked-content equality across repositories without requiring shared
        commit ancestry.
      - zipHandler bases a commit on fresh remote HEAD and updates refs with
        force disabled, which must remain true after canonical switching.
      - RepoCloneService copies files through per-file commits and neither
        preserves history nor provides atomic repository reconciliation.
    outcome_lessons:
      - Keep project-scoped mappings authoritative and preserve unrelated
        mappings during staged storage changes.
      - Reuse the live GitHub App connection gate before repository reads or
        writes, and keep auth failure states actionable.
      - Model MV3 restarts and partial storage writes as normal recovery cases,
        not impossible edge conditions.
  epic:
    acceptance_criteria:
      - Shared journey routing rejects projects with private-import provenance or
        another active native-sync journey; mapping presence alone never selects
        this lane.
      - The workflow can start only for a known Bolt project with a complete,
        accessible repository-A mapping under the authenticated personal owner.
      - A fresh Bolt export is compared with repository A before native setup;
        any unclassified content difference blocks migration and leaves A
        active, and differences attributable to the versioned export-writer
        classification are listed entry-by-entry for explicit acknowledgment.
      - Preflight divergence explains both reconciliation routes and recommends
        re-import through the sibling private-import handoff lane when private
        repository A may hold newer external commits; a Bolt to GitHub push is
        offered only with an explicit overwrite warning, and a public
        repository A receives direct bolt.new URL re-import guidance that
        creates no handoff journey or cleanup eligibility.
      - Preflight inventory includes empty and binary files without .gitignore
        suppression; unsupported modes or entry types return indeterminate.
      - The preflight record pins repository A branch HEAD and survives popup
        closure and service-worker restart.
      - The user explicitly attests that Bolt native setup created repository B
        and confirms B plus its target branch under the configured repoOwner.
      - Repository A and B are compared by complete, non-truncated Git trees,
        including every tracked entry path, mode, type, and object ID so
        executable files, symlinks, and gitlinks cannot be silently ignored.
      - Detected or potentially unresolved Git LFS usage blocks the MVP unless
        payload availability in both repositories can be proven explicitly.
      - Identical content with unrelated commit histories is reported as
        content-equivalent, not history-migrated.
      - Unclassified added, removed, or changed tracked entries produce a
        reconciliation report and block automatic mapping changes.
      - Differences matching the versioned benign Bolt-writer classification
        are listed entry-by-entry and require explicit user acknowledgment
        before adoption may proceed; classification never hides an entry or
        silently treats it as equivalent.
      - If either pinned branch HEAD changes before adoption, comparison expires
        and must be repeated.
      - Successful adoption changes only the current project's repository and
        branch, preserves A as legacy provenance, and leaves unrelated project
        mappings unchanged.
      - Persisted phases are preflight_verified, candidate_selected,
        equivalence_verified, switch_intent, mapping_switched, and completed.
      - equivalence_verified is reachable only through exact equivalence or a
        persisted acknowledgment record naming the classified entries, the
        classification version, and both pinned HEADs; the acknowledgment
        survives popup closure and MV3 restart and expires whenever the
        comparison expires.
      - Before switch_intent, cancel or recovery keeps A active. At switch_intent
        with A still mapped, recovery revalidates both HEADs before switching.
        Once B is mapped, recovery completes forward and never silently rolls
        back to A. Any third mapping produces a visible conflict state.
      - Before B is mapped, cancel, failure, ambiguity, and abandonment keep A
        active and never mutate either repository. After B is mapped, cancellation
        is unavailable; deterministic recovery completes B forward without GitHub
        mutation and never silently restores A.
      - The completed UI links both repositories and states that A retains the
        old history while B is the new user-confirmed canonical repository.
      - Completion warns that Cursor clones of A do not automatically become B;
        users must preserve unpushed work and re-clone B or deliberately migrate
        their Git remote/worktree before continuing external development.
      - When the history-transplant research gate is proven safe, completion
        offers documented user-executed local Git steps to preserve A's history
        in B; the extension never performs the force push itself, and the
        documented steps require verifying B's HEAD still matches the compared
        pinned HEAD and abort when newer Bolt commits exist.
      - After completion, repository A is eligible for the shared explicit
        duplicate-cleanup step; cleanup is never automatic, requires typed
        repository-name confirmation, and refuses repositories still mapped to
        any project.
      - Future Bolt to GitHub pushes to B still use fresh remote state and
        non-force branch updates.
    child_manifests:
      - slug: 01-existing-native-migration-state
        goal: |
          Define versioned existing-project migration records, eligibility, and
          recovery before repository comparison or UI work begins.
        likely_scope:
          - a new migration domain and persistence service with focused tests
          - src/lib/services/chromeStorage.ts or a dedicated versioned local store
          - repository-settings initiation and shared journey-routing seams
          - MV3 lifecycle tests for resume, cancel, conflicts, and phase recovery
        behavioral_focus:
          - Depends on 00-native-sync-journey-routing from the sibling epic.
          - Private-import provenance and another active journey block initiation.
          - Missing project, mapping, owner, branch, or GitHub access blocks start.
          - Repeating start is idempotent; switching projects cannot reuse state.
          - Persisted phases and mapping observations select one deterministic
            recovery action; recovery never arbitrarily chooses A or B.
      - slug: 02-existing-native-bolt-export-preflight
        goal: |
          Build an exact raw-ZIP inventory and compare the current Bolt export
          with repository A without inheriting preview-oriented omissions from
          GitHubComparisonService.
        likely_scope:
          - a new raw Bolt ZIP inventory and preflight service with unit tests
          - exact Git blob hashing for regular empty, text, and binary files
          - deterministic fixtures for modes, symlinks, gitlinks, ignored paths,
            binary files, empty files, unsupported entries, and stale A HEAD
        behavioral_focus:
          - Empty, text, and binary ZIP entries participate in comparison.
          - The established export exclusion policy may filter export-only paths,
            but every path already tracked in A is compared even when current
            .gitignore rules match it; absence from the export is classified
            export-writer divergence at most, never silent equivalence.
          - The documented export-writer policy explicitly includes the
            gitignore filtering and whitespace-only-file skip in
            processFilesWithGitignore, so a tracked .gitkeep or whitespace-only
            file in A is classified rather than unexplained divergence.
          - Normalization never silently converts byte differences into
            equivalence; differences attributable to the documented
            export-writer policy (line-ending and trailing-whitespace
            normalization, whitespace-only-file skip) form a distinct
            classified category requiring explicit acknowledgment.
          - An unrepresentable A mode/type or incomplete export returns indeterminate.
          - An exact or explicitly acknowledged classified match pins A HEAD and
            advances to preflight_verified; any unclassified mismatch reports
            paths and leaves A mapped.
          - A preflight acknowledgment is persisted in the versioned migration
            state with the classification version and pinned A HEAD, survives
            popup closure and MV3 restart, and expires whenever the pinned A
            HEAD changes.
      - slug: 03-existing-native-repository-equivalence
        goal: |
          Compare repository A and user-selected repository B by complete Git
          tree inventories and return exact equivalence or blocking divergence.
        likely_scope:
          - a new repository-to-repository comparison service and unit tests
          - existing authenticated GitHub request adapters
          - deterministic tree fixtures for text, binary, deletion, truncation,
            renamed paths, missing branches, and concurrent HEAD changes
        behavioral_focus:
          - Same paths, modes, types, and object IDs at pinned heads return
            tracked-content-equivalent.
          - Different histories with identical trees remain content-equivalent.
          - Added, removed, renamed, mode-changed, type-changed, or content-changed
            entries return explicit divergence; entries matching the versioned
            benign-writer classification are returned as a distinct
            acknowledgeable category, never silently treated as equivalent.
          - The benign-difference classification is versioned, derived only
            from the recorded A-versus-B writer research evidence, and every
            classified entry remains visible in the report.
          - Truncated trees, inaccessible refs, rate limits, and unknown data
            return blocked/indeterminate rather than equivalent.
          - LFS attributes, pointer blobs, missing payload proof, or uncertain LFS
            classification return unsupported/indeterminate for the MVP.
          - Original and candidate repository identities cannot be the same.
      - slug: 04-existing-native-canonical-switch
        goal: |
          Implement the deterministic persisted phase machine and one-way
          canonical mapping commit point independently of popup rendering.
        likely_scope:
          - a new canonical-switch application service and focused recovery tests
          - src/lib/stores/githubSettings.ts current-project mapping seam
          - versioned migration persistence and fresh GitHub HEAD reads
        behavioral_focus:
          - Only equivalence_verified may advance to switch_intent.
          - equivalence_verified is reachable only through exact equivalence or
            a persisted classified-difference acknowledgment record bound to
            the classification version and both pinned HEADs; the UI captures
            acknowledgment, but this child owns, persists, and revalidates the
            transition, and expires the acknowledgment with the comparison.
          - switch_intent with A mapped revalidates both HEADs before changing mapping.
          - switch_intent with B already mapped completes forward idempotently.
          - A third or missing mapping blocks as conflict and is never overwritten.
          - mapping_switched records A provenance and advances only forward to completed.
          - Unrelated project mappings remain byte-for-byte unchanged.
      - slug: 05-existing-native-canonical-switch-ui
        goal: |
          Guide native setup, display the A-versus-B reconciliation result, and
          invoke the canonical-switch service after equivalence.
        likely_scope:
          - a focused migration wizard component and component tests
          - the narrowest popup/RepoSettings composition entry points
          - provenance display and UI resume/conflict tests
        behavioral_focus:
          - The wizard names A as current and B as candidate until completion.
          - Native linkage is user-attested, never inferred from repository age.
          - Preflight divergence recommends the re-import route through the
            sibling handoff lane and warns before any Bolt to GitHub push that
            would overwrite newer repository content; for a public repository A
            it renders the direct bolt.new URL guidance and explains that no
            handoff journey or cleanup eligibility is created.
          - Unclassified divergence blocks adoption and offers refresh, Cursor
            reconciliation, abandon, and new-project-import guidance without
            mutating repositories.
          - Classified benign writer differences are listed entry-by-entry and
            require explicit acknowledgment before the wizard continues.
          - The UI delegates all persisted transition decisions to child 04.
          - Resume renders the phase-machine result without guessing A or B.
          - Completion explains the duplicate repositories and separate histories.
          - Completion tells Cursor users to preserve unpushed A work and re-clone
            B or deliberately migrate their remote/worktree.
          - Completion offers the documented history-preservation recipe when
            the research gate proved it safe, and a migration-side entry point
            for repository A that composes the sibling epic's shared cleanup
            service and typed-confirmation component.
      - slug: 06-existing-native-migration-regression
        goal: |
          Prove migration isolation, non-mutation guarantees, concurrency safety,
          and post-adoption non-force push behavior across the full journey.
        likely_scope:
          - cross-module integration fixtures and tests
          - existing-project popup and multi-tab e2e journeys
          - GitHub tree/ref race fixtures
          - zipHandler regression coverage where needed
        behavioral_focus:
          - Two project tabs cannot exchange migration candidates or mappings.
          - A or B changing during comparison invalidates adoption.
          - Failed and abandoned migrations perform no GitHub writes or deletions.
          - A remains preserved and linked after successful adoption; cleanup of
            A is reachable only through the shared explicit cleanup step and
            never before the completed phase.
          - A remote B commit before an extension push is preserved or causes a
            visible non-fast-forward failure, never a force push.
          - New-project handoff and normal B2G-only projects remain unchanged.
    mvp_definition:
      included:
        - Shared provenance-based journey eligibility and mutual exclusion.
        - Existing-project migration initiation from repository settings.
        - Exact raw-ZIP Bolt-export-versus-A preflight.
        - Preflight routing guidance to the re-import lane for drifted projects,
          with an explicit overwrite warning on the push alternative.
        - Versioned resumable migration state.
        - Explicit user attestation and B selection under current repoOwner.
        - Exact Git-tree tracked-content-equivalence comparison between A and B.
        - A versioned benign Bolt-writer difference classification backed by
          recorded research evidence, with explicit user acknowledgment.
        - A versioned preflight export-writer classification derived from the
          export-versus-A research evidence, under the same visibility and
          acknowledgment guardrails.
        - Git LFS detection with unsupported/indeterminate blocking behavior.
        - Visible divergence report and manual-reconciliation guidance.
        - HEAD revalidation and deterministic phased current-project mapping switch.
        - Preserved link and provenance for repository A.
        - A completion entry point to the shared post-completion duplicate
          cleanup step for repository A.
        - Documented user-executed history-preservation guidance, shipped only
          if the history-transplant research gate proves it safe.
      excluded:
        - Automatically copying A into B or B into A.
        - Extension-automated transplanting of A's commit history into B.
        - Merging unrelated Git histories.
        - Extension-performed force pushes, and any deleting, renaming,
          transferring, or visibility change outside the shared explicit
          typed-confirmation cleanup step.
        - Automatically choosing which divergent repository is authoritative.
        - Cross-owner migration or project-scoped owner storage.
        - Git LFS repository migration without verified payload availability.
        - Claiming native Bolt linkage is technically verified.
    implementation_research_gates:
      - Before promoting any child, enable bolt.new native GitHub setup on a
        real existing project and record a complete tree diff between the
        extension-written repository A and the Bolt-written repository B
        (entry paths, modes, types, object IDs). The two writers apply
        different filtering and normalization, so systematic differences are
        expected; if any exist, child 03's benign-difference classification
        must be derived from this recorded evidence before the equivalence
        gate can be considered viable. If the diff cannot be made clean or
        classifiable, this lane's design must be revisited before
        implementation.
      - Empirically raw-diff a representative Bolt export against its
        extension-written repository A. The push path filters through
        .gitignore, skips whitespace-only files, and reports up-to-date through
        normalized comparison, so byte-level export-versus-A differences can
        exist on healthy projects; derive the preflight export-writer
        classification from this recorded evidence. The evidence must also
        record the direction-ambiguous case where a whitespace-only or empty
        file tracked in A by an external commit is absent from the export, so
        external drift is not misclassified as writer policy.
      - Test whether force-pushing repository A's history into a freshly
        created repository B, before Bolt diverges it, preserves bolt.new
        native sync; record the evidence. The documented history-preservation
        recipe ships only if this proves safe.
      - Re-test Bolt's current repository-creation behavior for an existing
        project immediately before promoting the first child.
      - Confirm the Bolt export can be obtained without initiating a GitHub push
        and raw ZIP bytes remain available for exact empty/text/binary hashing.
      - Define which Git tree modes and types the Bolt export can represent;
        unsupported or ambiguous entries must remain indeterminate.
      - Confirm GitHub recursive tree truncation behavior and define a complete
        fallback traversal before equivalence can return true.
      - Define bounded LFS detection and payload-proof behavior; the current MVP
        recommendation is to block any detected or uncertain LFS repository.
      - Resolve the versioned storage namespace in child 01 before UI or adoption.
      - Verify candidate discovery under the authenticated personal username;
        organization and cross-owner support remain excluded.
    open_decisions:
      - Whether the divergence report should be copyable Markdown, JSON, or only
        an in-extension file list for the MVP.
      - Whether a user may explicitly waive content equivalence beyond the
        evidence-backed benign classification; current recommendation is no
        because that would make data-loss prevention hollow.
      - Whether a later owner-architecture feature should support organization
        repositories without overwriting unrelated project ownership.
temptations:
  - risk: Do not switch the project mapping merely because repository B is recent, accessible, or user-selected.
    instead: Require the Bolt-versus-A preflight, explicit native-setup attestation, complete A-versus-B tree equivalence, and unchanged pinned HEADs before staged adoption.
  - risk: Do not conceal A-versus-B divergence through RepoCloneService, claimed history migration, or a benign-difference classification that grows into a silent allowlist.
    instead: Keep comparison read-only, block every unclassified tracked-content difference, derive classified writer differences only from recorded research evidence with every entry visible and explicitly acknowledged, and direct divergent users to Cursor reconciliation or the new-project import lane.
  - risk: Do not delete, archive, rename, publish, or force-push repository A automatically or as a side effect of completing migration.
    instead: Preserve A and its history as recorded legacy provenance; retirement happens only through the shared explicit cleanup step with typed confirmation, and the extension never force-pushes.
  - risk: Do not treat matching tree entries as matching history, technically verified Bolt linkage, or proof of Git LFS payload availability.
    instead: Label the result content-equivalent and user-confirmed, retain links to both histories, and block detected or uncertain LFS repositories unless payloads are proven.
  - risk: Do not reuse a stale comparison after either repository branch advances.
    instead: Pin both HEAD SHAs, re-read them immediately before mapping changes, and invalidate the migration whenever either value differs.
