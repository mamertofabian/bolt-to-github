# draft-kind: child-planning-inventory
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: |
  Detect test and CI readiness, deleted tests, large file thresholds, file
  growth, backup/temp/copy files, and maintainability signals for the
  Production Readiness Snapshot module.
description: |
  Child draft for the b2g-production-readiness-snapshot parent epic, derived
  from docs/b2g_production_readiness_snapshot_reference.md sections 8.7, 8.8,
  8.9, 11, 12, 13, 18, and 19.3 Child 9.

  The upstream PRS domain, inventory, diff, and path-classification contracts
  now exist. This slice consumes explicit package metadata, text/line-count
  fixtures, and file diffs. Historical churn remains owned by the dedicated
  history-baseline slice and is not invented here.

  Rationale:
  - Test/CI and maintainability signals share the same file-growth, deletion,
    script, and path evidence, so this MVP child keeps them together as the
    parent epic requested.
  - The detector should report readiness evidence, not run project tests or
    builds inside the extension.
  - Thresholds must stay explicit and fixture-backed so line-count warnings do
    not drift into arbitrary style opinions.
type: feature
files:
  create:
  - path: src/production-readiness/detectors/testCiMaintainabilityDetector.ts
    artifacts:
    - kind: function
      name: detectTestCiMaintainabilitySignals
      args:
      - name: input
        type: TestCiMaintainabilityDetectorInput
      returns: ReadinessSignal[]
      description: |
        Detects test scripts, test files added/deleted, CI workflow
        changes, lint/typecheck scripts, ts-ignore/any growth, file length
        thresholds, large file growth, backup/temp/copy filenames, and
        generated-looking source additions.
    - kind: interface
      name: TestCiMaintainabilityDetectorInput
      description: Package metadata, candidate/base inventories, diff metrics,
        text excerpts, and optional history context needed for test/CI and
        maintainability analysis.
    - kind: attribute
      of: TestCiMaintainabilityDetectorInput
      name: candidatePackageJson
      type: TestCiPackageMetadata | null
    - kind: attribute
      of: TestCiMaintainabilityDetectorInput
      name: basePackageJson
      type: TestCiPackageMetadata | null
    - kind: attribute
      of: TestCiMaintainabilityDetectorInput
      name: changedFiles
      type: FileDiffEntry[]
    - kind: attribute
      of: TestCiMaintainabilityDetectorInput
      name: candidateFiles
      type: MaintainabilityFile[]
    - kind: attribute
      of: TestCiMaintainabilityDetectorInput
      name: baseFiles
      type: MaintainabilityFile[]
    - kind: interface
      name: TestCiPackageMetadata
      description: Package scripts and dependency sections used for static test,
        lint, typecheck, and test-framework readiness evidence.
    - kind: attribute
      of: TestCiPackageMetadata
      name: scripts
      type: Readonly<Record<string, string>> | undefined
    - kind: attribute
      of: TestCiPackageMetadata
      name: dependencies
      type: Readonly<Record<string, string>> | undefined
    - kind: attribute
      of: TestCiPackageMetadata
      name: devDependencies
      type: Readonly<Record<string, string>> | undefined
    - kind: interface
      name: MaintainabilityFile
      description: Normalized source path with optional decoded content and
        deterministic line count supplied to this detector.
    - kind: attribute
      of: MaintainabilityFile
      name: path
      type: string
    - kind: attribute
      of: MaintainabilityFile
      name: lineCount
      type: number | undefined
    - kind: attribute
      of: MaintainabilityFile
      name: content
      type: string | undefined
  - path: src/production-readiness/rules/maintainability-rules.ts
    artifacts:
    - kind: type
      name: MaintainabilityThresholds
      type: '{ componentInfoLines: number; componentYellowLines: number; heavyGrowthLines:
        number; redLinesWhenHeavilyChanged: number; broadSourceChangeFiles: number
        }'
      description: Explicit file-size and growth thresholds from the PRS
        reference document.
    - kind: function
      name: getMaintainabilityThresholds
      args: []
      returns: MaintainabilityThresholds
      description: Returns a fresh copy of the documented deterministic
        maintainability and broad-change thresholds.
    - kind: function
      name: classifyMaintainabilityPath
      args:
      - name: filePath
        type: string
      returns: MaintainabilityPathKind
      description: Classifies test, CI, source, backup/temp/copy, and
        generated-looking file paths for maintainability signals.
    - kind: type
      name: MaintainabilityPathKind
      type: "'test' | 'ci' | 'source' | 'backup_temp_copy' | 'generated_like' | 'other'"
  - path:
      src/production-readiness/detectors/__tests__/testCiMaintainabilityDetector.test.ts
    artifacts:
    - kind: test_function
      name: detects test scripts test files and ci workflow changes
      description: Planned fixture test for package scripts, test files,
        framework dependencies, and .github/workflows changes.
    - kind: test_function
      name: reports deleted tests and missing nearby tests for broad source
        changes
      description: Planned fixture test for deleted tests and large source
        changes with no test file additions.
    - kind: test_function
      name: reports files crossing maintainability thresholds
      description: Planned fixture test for 300, 500, 1000 line thresholds and
        300+ line growth.
    - kind: test_function
      name: detects backup temp copy and generated looking source files
      description: Planned fixture test for maintainability filename and
        generated-code signals.
    - kind: test_function
      name: reports growth in TypeScript suppression and any markers
      description: Planned fixture test comparing candidate/base text and
        reporting only increased eslint-disable, ts-ignore, or explicit any
        markers without returning source snippets.
  read:
  - manifests/drafts/b2g-production-readiness-snapshot.manifest.yaml
  - manifests/01-b2g-prs-domain-models-fixtures.manifest.yaml
  - manifests/02-b2g-prs-zip-inventory-normalization.manifest.yaml
  - manifests/04-b2g-prs-diff-engine.manifest.yaml
  - manifests/05-b2g-prs-sensitive-path-classifier.manifest.yaml
  - manifests/06-b2g-prs-dependency-detector.manifest.yaml
  - docs/b2g_production_readiness_snapshot_reference.md
  - src/production-readiness/domain.ts
  - src/production-readiness/diff/diffEngine.ts
  - src/production-readiness/detectors/sensitivePathClassifier.ts
  - src/production-readiness/inventory/zipInventory.ts
  - src/production-readiness/test-fixtures/prsFixtures.ts
validate:
- pnpm exec vitest run
  src/production-readiness/detectors/__tests__/testCiMaintainabilityDetector.test.ts
- ./scripts/maid validate
  manifests/12-b2g-prs-test-ci-maintainability-detector.manifest.yaml --mode
  behavioral
- pnpm lint
- pnpm check
