temptations:
- risk: Do not run user tests, builds, or linters from inside the browser
    extension.
  instead: Detect readiness signals from package scripts, files, paths, diffs,
    and history metadata only.
- risk: Do not warn on large files without deterministic thresholds.
  instead: Use the documented PRS thresholds and fixture cases for component
    size, 500+ line yellow, 1000+ line red-when-heavy, and 300+ line growth.
- risk: Do not treat missing tests as proof that code is broken.
  instead: Emit review-worthy testing_recovery evidence tied to broad source
    changes, deleted tests, or missing scripts.
- risk: Do not fold deleted tests into generic file deletion counts only.
  instead: Preserve deleted test evidence so the composer can elevate testing
    and recovery concerns.
- risk: Do not infer historical churn or unusual-export baselines without a real
    history contract.
  instead: Leave repeated-churn and historical-baseline analysis to the
    dedicated history slice.
outcome:
  status: completed
  summary: |
    The PRS pipeline now has a deterministic test, CI, and maintainability
    detector. It reports package test and quality readiness, changed or deleted
    tests, CI workflow changes, broad source changes without updated tests,
    backup/generated-looking paths, documented file-size and growth thresholds,
    and increased TypeScript suppression markers.

    Evidence is limited to paths, labels, booleans, and numeric counts. The
    detector never runs project commands and does not return source snippets.
    History and churn baselines remain intentionally deferred to slice 13.
  rationale: |
    Static package metadata, normalized diff entries, and caller-provided file
    metadata provide useful review signals without executing untrusted exports.
    Explicit thresholds and deterministic path/marker rules keep findings
    reproducible, while unavailable baselines remain unknown rather than being
    represented as confirmed absence or artificial growth.
  lessons:
    - lesson_type: rename-aware-diff-evidence
      summary: |
        Rename entries must inspect both current and previous paths. Otherwise a
        workflow moved out of its runtime directory disappears from CI evidence,
        and an unchanged renamed file can look like new suppression growth.
      tags: [diff, ci, determinism]
      paths:
        - src/production-readiness/detectors/testCiMaintainabilityDetector.ts
    - lesson_type: ambiguous-script-capability
      summary: |
        Generic package-script names such as check need command-level capability
        evidence; explicit aliases can remain name-based. This avoids presenting
        formatting-only commands as typechecking readiness.
      tags: [testing, package-scripts, precision]
      paths:
        - src/production-readiness/detectors/testCiMaintainabilityDetector.ts
    - lesson_type: unknown-baseline-is-not-zero
      summary: |
        Missing base metadata must suppress comparative claims or omit the base
        value. Defaulting unavailable content or metadata to empty/false creates
        misleading growth and removal evidence.
      tags: [evidence, baselines, privacy]
      paths:
        - src/production-readiness/detectors/testCiMaintainabilityDetector.ts
  review_notes:
    - source: independent reviewers revisions 2 through 6
      severity: findings-fixed
      summary: |
        Read-only reviews identified rename-away CI gaps, false suppression
        growth without a usable base, backup/test path precedence, pure test
        rename semantics, script-alias precision, contradictory evidence text,
        and incomplete explicit-any forms. Each valid finding received focused
        behavioral coverage and a locked plan revision before implementation.
    - source: independent reviewer /root/slice12_revision7_reviewer
      severity: ready
      summary: |
        Final review found no P0, P1, or P2 issues and confirmed deterministic
        ordering, source-content privacy, declared scope, plan-lock integrity,
        command capability checks, baseline semantics, marker coverage, and all
        prior rename/path regressions.
  validation:
    - command:
        - pnpm
        - exec
        - vitest
        - run
        - src/production-readiness/detectors/__tests__/testCiMaintainabilityDetector.test.ts
      status: passed
      summary: Five scenario tests passed, including all review-driven edge cases.
    - command:
        - ./scripts/maid
        - test
        - --manifest
        - manifests/12-b2g-prs-test-ci-maintainability-detector.manifest.yaml
      status: passed
      summary: All four declared commands passed, including focused tests, behavioral validation, lint, and type checking.
    - command:
        - pnpm
        - test:ci
      status: passed
      summary: The complete repository suite passed with 209 files and 4,050 tests.
    - command:
        - pnpm
        - build
      status: passed
      summary: The production extension build passed; only two pre-existing Vite chunking warnings were reported.
    - command:
        - ./scripts/maid
        - validate
        - manifests/12-b2g-prs-test-ci-maintainability-detector.manifest.yaml
        - --mode
        - implementation
      status: passed
      summary: Declared implementation artifacts passed validation; three unrelated pre-existing E110 warnings remained.
