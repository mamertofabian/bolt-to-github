schema: '2'
goal: |
  Fetch and normalize GitHub repository base tree and file metadata for PRS
  comparison against the candidate Bolt zip inventory.
description: |
  Third implementation child for the b2g-production-readiness-snapshot parent
  epic. Mocked request fixtures define the read-only GitHub contract without
  network access or extension globals.

  This slice owns read-only base inventory collection from GitHub. It should
  preserve repository and base-ref metadata, normalize tree entries into the PRS
  inventory shape where practical, and return visible limitations for missing,
  forbidden, rate-limited, or partial GitHub data. It must not push commits,
  create branches, mutate repository state, or hide comparison failures behind
  fake base data.

  This child also performs a backward-compatible chain evolution of the zip
  inventory contract by adding a Git-compatible blob SHA to candidate entries.
  That shared hash lets the downstream pure diff engine identify unchanged
  files without fetching repository contents. A separate abort-aware reader is
  available for selectively loading changed base text when line or dependency
  analysis needs it; base inventory collection itself remains metadata-only.
temptations:
  - risk: Do not silently treat failed GitHub reads as an empty base repository.
    instead: Return partial inventory limitations that downstream snapshot composition can display.
  - risk: Do not fetch full blob contents for every repository file by default.
    instead: Use tree metadata first and request file content only when planned downstream behavior requires it.
  - risk: Do not broaden GitHub token permissions for PRS base reads.
    instead: Reuse the existing GitHub service boundaries and keep this adapter read-only.
type: feature
