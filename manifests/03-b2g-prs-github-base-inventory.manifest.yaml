outcome:
  status: completed
  summary: |
    PRS can now resolve a GitHub base ref and recursive tree through injected,
    GET-only requests, normalize deterministic blob metadata, and preserve
    repository/base identity with visible limitations for missing, forbidden,
    rate-limited, truncated, malformed, duplicate, unsafe, or cancelled data.
    Candidate zip entries also carry exact-byte Git blob SHAs for metadata-only
    equality checks, while changed base text is available through a separate,
    explicit, abort-aware, byte-bounded blob reader.
  rationale: |
    A shared Git blob hash lets the downstream pure diff engine identify
    unchanged files without downloading every repository blob or comparing
    incompatible hash algorithms. Selective content reads are limited to files
    that downstream line or dependency analysis actually needs, preserve typed
    GitHub errors, and classify binary, oversized, unavailable, and rate-limited
    content honestly without mutating repository state.
  lessons:
    - lesson_type: inventory-hash-compatibility
      summary: |
        GitHub tree SHA-1 values cannot be compared with raw candidate SHA-256
        values. Compute the Git framed blob SHA from exact candidate bytes so
        unchanged files stay metadata-only and selective content reads remain
        reserved for confirmed changes.
      tags:
        - github
        - diff
        - hashing
      paths:
        - src/production-readiness/inventory/zipInventory.ts
        - src/production-readiness/inventory/githubBaseInventory.ts
    - lesson_type: typed-read-boundary
      summary: |
        A production GitHub read adapter must preserve HTTP status and forward
        AbortSignal. Checks only between awaited requests cannot cancel a
        stalled client, so the caller-facing boundary also needs an abort race
        while the underlying client receives the same signal.
      tags:
        - github
        - cancellation
        - rate-limit
      paths:
        - src/production-readiness/inventory/githubBaseInventory.ts
        - src/production-readiness/__tests__/github-base-inventory.test.ts
    - lesson_type: bounded-selective-content
      summary: |
        Base64 content must be bounded by raw, encoded, and decoded size before
        normalization or atob allocation. Binary heuristics must match the
        candidate inventory so NUL, control-byte, and invalid UTF-8 blobs are
        never treated as line-diffable text.
      tags:
        - memory
        - encoding
        - mv3
      paths:
        - src/production-readiness/inventory/githubBaseInventory.ts
        - src/production-readiness/__tests__/github-base-inventory.test.ts
    - lesson_type: partial-data-integrity
      summary: |
        Malformed primitives, unknown entry types, invalid paths, duplicates,
        and truncation should be isolated into deterministic limitations while
        retaining valid entries and resolved base metadata. A fake empty base
        would make every candidate file look added and undermine readiness
        confidence.
      tags:
        - degraded-state
        - data-integrity
        - deterministic
      paths:
        - src/production-readiness/inventory/githubBaseInventory.ts
        - src/production-readiness/test-fixtures/prs/github-base.ts
