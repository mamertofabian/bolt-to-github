# manifest-kind: active-contract
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: |
  Fetch and normalize GitHub repository base tree and file metadata for PRS
  comparison against the candidate Bolt zip inventory.
description: |
  Promoted child contract for the b2g-production-readiness-snapshot parent
  epic. Mocked GitHub fixtures and behavioral tests define a read-only base
  inventory boundary for the downstream diff engine.

  This slice owns read-only base inventory collection from GitHub. It should
  preserve repository and base-ref metadata, normalize tree entries into the PRS
  inventory shape where practical, and return visible limitations for missing,
  forbidden, rate-limited, or partial GitHub data. It must not push commits,
  create branches, mutate repository state, or hide comparison failures behind
  fake base data.
temptations:
  - risk: 'Do not silently treat failed GitHub reads as an empty base repository.'
    instead: 'Return partial inventory limitations that downstream snapshot composition
      can display.'
  - risk: 'Do not fetch full blob contents for every repository file by default.'
    instead: 'Use tree metadata first and request file content only when planned downstream
      behavior requires it.'
  - risk: 'Do not broaden GitHub token permissions for PRS base reads.'
    instead: 'Reuse the existing GitHub service boundaries and keep this adapter read-only.'
type: feature
files:
  create:
    - path: src/production-readiness/inventory/githubBaseInventory.ts
      artifacts:
        - kind: type
          name: GitHubMetadataReader
          type: '<T>(endpoint: string, signal?: AbortSignal) => Promise<T>'
          description: Read-only GitHub metadata boundary supplied by the
            existing authenticated GitHub service.
        - kind: interface
          name: GitHubBaseInventoryRequest
          description: Planned owner, repo, base ref, and cancellation/options
            request for collecting base inventory.
        - kind: attribute
          name: owner
          of: GitHubBaseInventoryRequest
          type: string
        - kind: attribute
          name: repository
          of: GitHubBaseInventoryRequest
          type: string
        - kind: attribute
          name: baseRef
          of: GitHubBaseInventoryRequest
          type: string
        - kind: attribute
          name: readGitHub
          of: GitHubBaseInventoryRequest
          type: GitHubMetadataReader
        - kind: attribute
          name: signal
          of: GitHubBaseInventoryRequest
          type: AbortSignal | undefined
        - kind: interface
          name: GitHubBaseInventoryEntry
          description: GitHub tree metadata retained without fetching blob
            contents.
        - kind: attribute
          name: path
          of: GitHubBaseInventoryEntry
          type: string
        - kind: attribute
          name: sizeBytes
          of: GitHubBaseInventoryEntry
          type: number | undefined
        - kind: attribute
          name: blobSha
          of: GitHubBaseInventoryEntry
          type: string
        - kind: attribute
          name: mode
          of: GitHubBaseInventoryEntry
          type: string
        - kind: interface
          name: GitHubBaseInventoryResult
          description: Planned normalized base inventory with base ref summary,
            repository ref, and limitations.
        - kind: attribute
          name: repository
          of: GitHubBaseInventoryResult
          type: RepositoryRef
        - kind: attribute
          name: base
          of: GitHubBaseInventoryResult
          type: GitRefSummary | undefined
        - kind: attribute
          name: treeSha
          of: GitHubBaseInventoryResult
          type: string | undefined
        - kind: attribute
          name: entries
          of: GitHubBaseInventoryResult
          type: GitHubBaseInventoryEntry[]
        - kind: attribute
          name: partial
          of: GitHubBaseInventoryResult
          type: boolean
        - kind: attribute
          name: limitations
          of: GitHubBaseInventoryResult
          type: PartialDataNotice[]
        - kind: function
          name: buildGitHubBaseInventory
          args:
            - name: request
              type: GitHubBaseInventoryRequest
          returns: Promise<GitHubBaseInventoryResult>
          description: Planned read-only adapter that converts GitHub tree data
            into PRS base inventory metadata.
    - path: src/production-readiness/__tests__/github-base-inventory.test.ts
      artifacts:
        - kind: test_function
          name: mock GitHub tree data normalizes into base inventory
          description: Required planned behavioral test before promotion.
        - kind: test_function
          name: missing GitHub data produces a partial snapshot limitation
          description: Required planned behavioral test before promotion.
        - kind: test_function
          name: rate limited GitHub data produces a partial snapshot limitation
          description: Required planned behavioral test before promotion.
        - kind: test_function
          name: base ref metadata is preserved
          description: Required planned behavioral test before promotion.
    - path: src/production-readiness/test-fixtures/prs/github-base.ts
      artifacts:
        - kind: type
          name: GitHubTreeFixtureName
          type: "'complete' | 'missing' | 'rate-limited' | 'truncated'"
        - kind: interface
          name: GitHubTreeFixture
          description: Deterministic mocked GitHub metadata responses or error
            for base inventory behavior.
        - kind: attribute
          name: name
          of: GitHubTreeFixture
          type: GitHubTreeFixtureName
        - kind: attribute
          name: owner
          of: GitHubTreeFixture
          type: string
        - kind: attribute
          name: repository
          of: GitHubTreeFixture
          type: string
        - kind: attribute
          name: baseRef
          of: GitHubTreeFixture
          type: string
        - kind: attribute
          name: responses
          of: GitHubTreeFixture
          type: Readonly<Record<string, unknown>>
        - kind: attribute
          name: error
          of: GitHubTreeFixture
          type: '{ status: number; message: string } | undefined'
        - kind: function
          name: createGitHubTreeFixture
          args:
            - name: name
              type: string
          returns: GitHubTreeFixture
          description: Planned deterministic factory for mocked GitHub tree and
            error fixtures.
  read:
    - docs/b2g_production_readiness_snapshot_reference.md
    - manifests/drafts/b2g-production-readiness-snapshot.manifest.yaml
    - manifests/01-b2g-prs-domain-models-fixtures.manifest.yaml
    - manifests/02-b2g-prs-zip-inventory-normalization.manifest.yaml
    - src/production-readiness/inventory/zipInventory.ts
    - src/services/GitHubApiClient.ts
    - src/services/GitHubComparisonService.ts
    - src/services/UnifiedGitHubService.ts
    - src/services/interfaces/IGitHubApiClient.ts
validate:
  - pnpm exec vitest run
    src/production-readiness/__tests__/github-base-inventory.test.ts
  - ./scripts/maid validate
    manifests/03-b2g-prs-github-base-inventory.manifest.yaml --mode behavioral
  - pnpm lint
  - pnpm check
