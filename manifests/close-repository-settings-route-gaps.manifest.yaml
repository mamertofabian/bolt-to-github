        - src/lib/components/__tests__/ProjectsList.component.test.ts
        - src/test/e2e-helpers/popup-helpers.test.ts
      status: failed-red-phase
      summary: One normal-state guidance assertion and two project-route helper/spec assertions failed before implementation; the existing Projects modal characterization passed.
    - command:
