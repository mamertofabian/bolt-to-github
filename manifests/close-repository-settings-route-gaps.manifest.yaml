        - --reporter=line
        - e2e/manual-repo.spec.ts
        - e2e/error-flow-product.spec.ts
        - -g
        - connected users can open repository settings|should show error for invalid repository name
      status: failed-red-phase
      summary: Both stale scenarios reproduced against the removed global Settings form before their route updates.
