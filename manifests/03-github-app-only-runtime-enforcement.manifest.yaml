    - path: src/background/BackgroundService.ts
      artifacts:
        - kind: class
          name: BackgroundService
          description: Background startup and every GitHub-backed message boundary require live GitHub App authority and never construct a PAT service.
    - path: src/background/TempRepoManager.ts
      artifacts:
