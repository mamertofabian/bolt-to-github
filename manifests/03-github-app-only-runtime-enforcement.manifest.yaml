    - path: src/background/__tests__/BackgroundService.critical-scenarios.test.ts
      artifacts:
        - kind: test_function
          name: background never initializes a GitHub service from a stored PAT
        - kind: test_function
          name: background initializes GitHub App service for connected configuration
        - kind: test_function
          name: PAT migration blocks private repository import before GitHub work
        - kind: test_function
