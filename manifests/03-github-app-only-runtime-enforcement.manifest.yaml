          description: Stops autonomous cleanup so a disconnected account cannot retain a stale GitHub service.
    - path: src/services/UnifiedGitHubService.ts
      artifacts:
        - kind: class
          name: UnifiedGitHubService
          description: Explicit GitHub App configuration is authoritative and can never fall back to a PAT strategy, including initialization retries.
    - path: src/popup/App.svelte
      artifacts:
        - kind: function
          name: reconcilePopupGitHubConnection
          args:
            - name: checkConnection
              type: '() => Promise<GitHubConnectionResult>'
            - name: refreshSettings
              type: '() => Promise<void>'
            - name: showStatus
              type: '(message: string, duration: number) => void'
          returns: Promise<GitHubConnectionResult>
          description: Reconciles popup readiness and surfaces every blocked or unavailable result.
        - kind: function
          name: runPopupGitHubAction
          args:
            - name: checkConnection
              type: '() => Promise<GitHubConnectionResult>'
            - name: refreshSettings
              type: '() => Promise<void>'
            - name: showStatus
              type: '(message: string, duration: number) => void'
            - name: action
              type: '() => Promise<void>'
          returns: Promise<boolean>
          description: Runs a popup GitHub action only after live reconciliation succeeds.
        - kind: function
          name: canOpenPopupGitHubSurface
          args:
            - name: connectionReady
              type: boolean
            - name: requirementsMet
              type: boolean
          returns: boolean
          description: Keeps GitHub-backed popup surfaces unmounted until live verification succeeds.
    - path: src/lib/utils/__tests__/githubConnection.test.ts
      artifacts:
        - kind: test_function
          name: legacy PAT state returns migration required and never connected
        - kind: test_function
          name: valid PAT cannot bypass the live GitHub App authority
        - kind: test_function
          name: connected GitHub App remains connected after PAT retirement
        - kind: test_function
