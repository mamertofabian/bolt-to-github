          name: GitHubConnectionFailureReason
          type: "'migration_required' | 'not_authenticated' | 'not_connected' | 'unavailable'"
        - kind: interface
          name: GitHubConnectionResult
        - kind: attribute
          name: connected
          of: GitHubConnectionResult
          type: boolean
        - kind: attribute
          name: reason
          of: GitHubConnectionResult
          type: GitHubConnectionFailureReason | undefined
        - kind: attribute
          name: message
          of: GitHubConnectionResult
          type: string
        - kind: interface
          name: GitHubConnectionAuthClient
        - kind: attribute
          name: getAuthState
          of: GitHubConnectionAuthClient
          type: () => Promise<AuthState>
        - kind: attribute
          name: syncGitHubApp
          of: GitHubConnectionAuthClient
          type: () => Promise<boolean>
        - kind: function
          name: checkGitHubConnection
          args:
            - name: authClient
              type: GitHubConnectionAuthClient
          returns: Promise<GitHubConnectionResult>
          description: Never treats PAT state as connected and reports migration_required when the durable marker is set.
        - kind: function
          name: checkPopupGitHubConnection
          args:
            - name: authClient
              type: GitHubConnectionAuthClient
          returns: Promise<GitHubConnectionResult>
          description: Keeps popup caching advisory while preserving migration and live-account semantics.
    - path: src/content/services/githubAppIdentity.ts
      artifacts:
        - kind: function
          name: stableGitHubAppInstallationId
          args:
            - name: installationId
              type: 'number | null | undefined'
          returns: 'number | undefined'
          description: Returns only a server-provided finite positive installation ID; never manufactures one.
    - path: src/content/services/SupabaseAuthService.ts
      artifacts:
        - kind: method
          name: clearExpiredSession
          of: SupabaseAuthService
          args: []
          returns: Promise<void>
          description: Clears only Supabase session storage keys while preserving server-confirmed GitHub App linkage.
        - kind: method
          name: syncGitHubApp
          of: SupabaseAuthService
          args: []
          returns: Promise<boolean>
          description: Reconciles the current authenticated user with a stable live GitHub App installation.
    - path: src/content/handlers/GitHubUploadHandler.ts
      artifacts:
        - kind: class
          name: GitHubUploadHandler
          description: All public push entry points gate live GitHub connection before settings, confirmation, ZIP export, or dispatch.
        - kind: method
          name: validateSettings
          of: GitHubUploadHandler
          args: []
          returns: Promise<boolean>
        - kind: method
          name: handleGitHubPushWithFreshComparison
