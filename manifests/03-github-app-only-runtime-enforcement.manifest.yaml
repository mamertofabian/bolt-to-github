created: '2026-07-13T03:57:50Z'
metadata:
  tags: [auth, github-app, pat-retirement, background, content-script]
  priority: high
  status: completed
  promotion_ready: true
  parent_epic: github-app-only-authentication
  depends_on: [01-github-app-only-migration-policy, 02-github-app-only-primary-setup]
  evolves_active_contracts:
    - gate-github-actions-on-live-connection
    - background-auth-storage-recovery
    - prevent-github-token-request-stampede
  notes: |
    Behavioral tests were added first and the focused red run failed only at
    the intended PAT bypass, PAT-backed background construction, and token-era
    ZIP guidance boundaries before implementation began.
outcome:
  status: completed
  summary: |
    Every GitHub-backed runtime boundary in the background and content flows
    now requires a live Bolt2GitHub session and GitHub App connection. Legacy
    PAT migration state remains actionable until live App verification succeeds,
    then clears through the production connection check. Explicit GitHub App
    service construction cannot fall back to PAT, and ZIP failures direct users
    to sign in or connect the App instead of configuring a token.

    Background GitHub dependencies are replaced with a generation guard so an
    older connection check cannot restore stale services after a newer logout or
    disconnected recovery. Temporary-repository managers are destroyed during
    replacement and cannot resurrect deferred cleanup intervals.
  rationale: |
    Removing visible PAT setup is insufficient if cached popup verification,
    asynchronous background recovery, or compatibility constructors can still
    authorize legacy behavior. One shared live-connection gate and explicit
    lifecycle invalidation make GitHub App authority observable at every action
    boundary while preserving an actionable migration path for legacy users.
  lessons:
    - lesson_type: live-authority-over-cached-state
      summary: |
        A retirement marker must bypass positive caches and clear only after the
        live account and GitHub App installation are both verified.
      tags: [auth, migration, cache-invalidation]
      paths:
        - src/lib/utils/githubConnection.ts
        - src/lib/utils/__tests__/githubConnection.test.ts
    - lesson_type: generation-guarded-auth-dependencies
      summary: |
        Concurrent authentication recovery must publish services only when its
        generation is still current; otherwise an older successful check can
        undo a newer disconnected state.
      tags: [auth, concurrency, mv3, reliability]
      paths:
        - src/background/BackgroundService.ts
        - src/background/__tests__/BackgroundService.storage-recovery.test.ts
    - lesson_type: asynchronous-lifecycle-shutdown
      summary: |
        Destroying an interval owner must also prevent unfinished asynchronous
        initialization from starting the interval after destruction.
      tags: [lifecycle, cleanup, concurrency]
      paths:
        - src/background/TempRepoManager.ts
        - src/background/__tests__/TempRepoManager.test.ts
  review_notes:
    - source: independent reviewer /root/child03_runtime_review
      severity: findings-fixed
      summary: |
        Initial review found an unreachable migration-completion path, ungated
        temporary-repository cleanup with a retained service, and an internal
        PAT fallback for explicit GitHub App construction. Follow-up review
        found deferred cleanup initialization and overlapping background
        recovery races plus weak recovery assertions. All findings were fixed
        with focused red-first regressions.
    - source: independent reviewer /root/child03_runtime_review final
      severity: ready
      summary: |
        Final read-only review found no remaining P0, P1, or P2 findings and
        confirmed migration cache bypass, live recovery, generation-guarded
        dependency replacement, deterministic temporary-repository shutdown,
        authoritative GitHub App construction, and complete MAID scope.
  validation:
    - command:
        - pnpm
        - exec
        - vitest
        - run
        - src/background/__tests__/TempRepoManager.test.ts
        - src/background/__tests__/BackgroundService.storage-recovery.test.ts
      status: failed-red-phase
      summary: Both lifecycle tests failed before implementation because deferred cleanup restarted after destroy and an older connected recovery restored stale dependencies.
    - command:
        - ./scripts/maid
        - test
        - --manifest
        - manifests/03-github-app-only-runtime-enforcement.manifest.yaml
      status: passed
      summary: All five declared commands passed, including 17 focused files with 279 tests, behavioral validation, lint, type checking, and production build.
    - command:
        - ./scripts/maid
        - validate
        - manifests/03-github-app-only-runtime-enforcement.manifest.yaml
        - --mode
        - implementation
        - --strict
      status: passed
      summary: Every declared production and behavioral artifact passed strict implementation validation.
    - command:
        - pnpm
        - test:ci
      status: passed
      summary: Full Vitest CI passed 196 files and 4,264 tests.
    - command:
        - ./scripts/maid
        - verify
        - --manifest-dir
        - manifests
        - --strict
        - --file-tracking-scope
        - task
        - --plan-lock-scope
        - task
        - --since
