schema: '2'
goal: |
  Enforce live Bolt2GitHub session and GitHub App readiness at every background
  and content-script boundary that can start GitHub-backed work.
description: |
  Third child of github-app-only-authentication and the promoted runtime
  enforcement contract.

  The live connection result gains a migration_required reason. Stored PAT
  state must never produce connected=true. Background initialization always
  builds the GitHub App service and leaves it unavailable when the live account
  or installation contract is not satisfied. Push, ZIP upload, file comparison,
  cached file-change startup, imports, and programmatic entry points must stop
  before loading data or consuming premium usage when migration or connection
  is incomplete.

  This child preserves the existing single background-auth authority and its
  force-fresh checks. It changes authorization policy, not session ownership.
  User-visible background/ZIP errors must use the same account/GitHub App
  recovery vocabulary and must never tell users to set or inspect a GitHub
  token.
temptations:
  - risk: 'Do not enforce GitHub App-only behavior only in the popup.'
    instead: 'Gate background, content, cached startup, and programmatic entry points before GitHub work begins.'
  - risk: 'Do not collapse migration_required into unavailable or silently return false.'
    instead: 'Return a stable reason and actionable message so every surface can explain the required migration.'
  - risk: 'Do not weaken live verification by trusting installation metadata alone.'
    instead: 'Continue reconciling the account session and installation through BackgroundAuthClient before authorizing work.'
  - risk: 'Do not leave token-setup errors in lower-level ZIP or message paths after the top-level gate changes.'
    instead: 'Route missing-service failures to explicit Bolt2GitHub sign-in or GitHub App connection guidance and test the observable status text.'
type: refactor
supersedes:
  - gate-github-actions-on-live-connection
files:
  edit:
    - path: src/lib/utils/githubConnection.ts
      artifacts:
