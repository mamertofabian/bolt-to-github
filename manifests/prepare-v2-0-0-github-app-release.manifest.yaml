outcome:
  status: completed
  completed_at: '2026-07-13T22:52:09Z'
  summary: |
    Prepared the current development branch as the upcoming v2.0.0 release.
    Package metadata, Chrome manifest metadata, development guidance, README,
    changelog, and in-app release content now consistently identify the major
    GitHub App-only authentication release. The unreleased v1.3.22 entry was
    replaced rather than retained as false release history, while v1.3.21
    remains accessible as the previous release. Production-readiness checks
    remain excluded for their separate feature branch.
  rationale: |
    Retiring the original personal access token integration changes a core
    product compatibility boundary, so a major version communicates the scope
    more accurately than v1.3.22. Repository copy remains explicitly upcoming
    or unreleased because manual upgrade testing, focused Playwright release
    checks, tagging, and Chrome Web Store submission are intentionally deferred.
  lessons:
  - lesson_type: release-contract-evolution
    summary: |
      When an unreleased version is renumbered, replace its current-version test
      artifacts through a superseding manifest while retaining historical
      changelog and README namespace artifacts that still exist.
    tags: [release, supersession, versioning]
    paths:
    - manifests/prepare-v2-0-0-github-app-release.manifest.yaml
    - src/lib/constants/__tests__/whatsNewContent.test.ts
  - lesson_type: release-copy-boundary
    summary: |
      Assert authentication migration claims independently on in-app, changelog,
      and README surfaces so one complete surface cannot hide omissions in
      another, and explicitly reject separately branched feature terminology.
    tags: [release-notes, testing, scope]
    paths:
    - CHANGELOG.md
    - README.md
    - src/lib/constants/whatsNewContent.ts
    - src/lib/constants/__tests__/whatsNewContent.test.ts
  - lesson_type: non-code-validation
    summary: |
      MAID cannot structurally verify removed namespace markers in JSON or
      Markdown. Preserve historical document namespaces that still exist, keep
      replacement warnings for live version markers visible, and do not add
      unverifiable removed_artifacts merely to silence E110.
    tags: [maid, validation, non-code]
    paths:
