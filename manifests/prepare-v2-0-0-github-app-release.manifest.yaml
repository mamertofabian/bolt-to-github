schema: '2'
goal: Prepare the GitHub App-only authentication release as the upcoming v2.0.0 major version
description: |
  Replace the unreleased v1.3.22 release identity with v2.0.0 because retiring
  personal access token authentication changes the product's original GitHub
  integration contract. Keep the release focused on the Bolt2GitHub account
  and GitHub App migration, including the earlier session-aware onboarding fix,
  while leaving room for later small release updates discovered during manual
  testing and review.

  This contract supersedes the overlapping v1.3.21 release-version contract
  and the v1.3.22 GitHub App release-regression contract. It retains the latter's
  browser-fixture, source-guard, migration-copy, and setup-test artifacts while
  replacing only the unreleased version identity and release-facing copy.
  The changelog and README describe v2.0.0 as upcoming; they must not claim that
  manual release testing, review, tagging, or Chrome Web Store submission is
  complete.
temptations:
- risk: Do not leave 1.3.22 as an accessible release entry after renumbering the same unreleased work to 2.0.0.
  instead: Replace the current 1.3.22 entry across package, Chrome manifest, changelog, README, development guide, in-app content, and release tests.
- risk: Do not present the preliminary metadata update as a completed or published release.
  instead: Label repository release copy as upcoming or unreleased while keeping the user-facing migration explanation release-ready.
- risk: Do not broaden the v2.0.0 headline to the separately branched production-readiness system.
  instead: Limit v2.0.0 copy to GitHub App-only authentication, PAT retirement, preserved mappings, migration guidance, and session-aware onboarding.
- risk: Do not discard the source guard or GitHub App browser-fixture contracts when superseding the v1.3.22 release manifest.
  instead: Redeclare their complete retained public artifacts and run the original focused regression gate.
type: fix
supersedes:
- 08-github-app-only-release-regression
- release-v1-3-21
