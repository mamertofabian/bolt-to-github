# manifest-kind: active-contract
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: |
  Compare candidate zip inventory against GitHub base inventory and produce
  deterministic PRS file diff metrics for added, changed, deleted, renamed,
  line-change, and binary-change cases.
description: |
  Promoted child contract for the b2g-production-readiness-snapshot parent
  epic. Fixture-backed tests define a pure, deterministic comparison boundary
  for normalized inventories.

  This slice owns inventory-to-inventory comparison. It should consume normalized
  candidate and base inventories, compute deterministic comparison summaries,
  and report limitations for large or binary files that cannot be line-diffed.
  It must not classify paths into readiness categories, compose state, render
  UI, or call GitHub directly.
temptations:
  - risk: 'Do not use raw zip entry names or GitHub tree paths without shared path
      normalization.'
    instead: 'Compare only normalized inventory entries produced by the inventory
      slices.'
  - risk: 'Do not count skipped large files as unchanged.'
    instead: 'Represent large-file skips as limitations while still counting file-level
      changes.'
  - risk: 'Do not infer production sensitivity in the diff engine.'
    instead: 'Emit neutral file and line metrics and let detector slices classify
      readiness meaning.'
type: feature
files:
  create:
    - path: src/production-readiness/diff/diffEngine.ts
      artifacts:
        - kind: interface
          name: DiffEngineOptions
          description: Planned thresholds for line diffing, rename detection,
            and large-file limitations.
        - kind: attribute
          name: detectRenames
          of: DiffEngineOptions
          type: boolean | undefined
        - kind: attribute
          name: maxLineDiffFileBytes
          of: DiffEngineOptions
          type: number | undefined
        - kind: attribute
          name: lineDeltasByPath
          of: DiffEngineOptions
          type: Readonly<Record<string, LineDelta>> | undefined
        - kind: attribute
          name: candidateBlobShasByPath
          of: DiffEngineOptions
          type: Readonly<Record<string, string>> | undefined
        - kind: attribute
          name: baseBinaryPaths
          of: DiffEngineOptions
          type: ReadonlySet<string> | undefined
          description: Exhaustive base paths known to be binary. Omitting the
            set preserves unknown classification for base-only files.
        - kind: interface
          name: LineDelta
          description: Exact content-aware line additions and deletions supplied
            when upstream content is available.
        - kind: attribute
          name: addedLines
          of: LineDelta
          type: number
        - kind: attribute
          name: deletedLines
          of: LineDelta
          type: number
        - kind: interface
          name: FileDiffEntry
          description: Planned per-file added, changed, deleted, renamed,
            binary, and skipped-line-diff metadata.
        - kind: attribute
          name: path
          of: FileDiffEntry
          type: string
        - kind: attribute
          name: previousPath
          of: FileDiffEntry
          type: string | undefined
        - kind: attribute
          name: status
          of: FileDiffEntry
          type: "'added' | 'changed' | 'deleted' | 'renamed' | 'indeterminate'"
        - kind: attribute
          name: binary
          of: FileDiffEntry
          type: boolean | undefined
        - kind: attribute
          name: lineDiffEligible
          of: FileDiffEntry
          type: boolean
        - kind: attribute
          name: addedLines
          of: FileDiffEntry
          type: number | undefined
        - kind: attribute
          name: deletedLines
          of: FileDiffEntry
          type: number | undefined
        - kind: interface
          name: InventoryComparisonSummary
          description: Neutral file and line metrics before readiness
            classification.
        - kind: attribute
          name: changedFiles
          of: InventoryComparisonSummary
          type: number
        - kind: attribute
          name: addedFiles
          of: InventoryComparisonSummary
          type: number
        - kind: attribute
          name: deletedFiles
          of: InventoryComparisonSummary
          type: number
        - kind: attribute
          name: renamedFiles
          of: InventoryComparisonSummary
          type: number
        - kind: attribute
          name: indeterminateFiles
          of: InventoryComparisonSummary
          type: number
        - kind: attribute
          name: addedLines
          of: InventoryComparisonSummary
          type: number
        - kind: attribute
          name: deletedLines
          of: InventoryComparisonSummary
          type: number
        - kind: attribute
          name: binaryFilesChanged
          of: InventoryComparisonSummary
          type: number
        - kind: interface
          name: InventoryDiffResult
          description: Planned file diff collection, comparison summary, and
            limitations for downstream detectors.
        - kind: attribute
          name: entries
          of: InventoryDiffResult
          type: FileDiffEntry[]
        - kind: attribute
          name: summary
          of: InventoryDiffResult
          type: InventoryComparisonSummary
        - kind: attribute
          name: limitations
          of: InventoryDiffResult
          type: string[]
        - kind: function
          name: compareInventories
          args:
            - name: candidate
              type: FileInventory
            - name: base
              type: GitHubBaseInventoryResult
            - name: options
              type: DiffEngineOptions | undefined
          returns: InventoryDiffResult
          description: Planned pure comparison function for normalized candidate
            and base inventories.
    - path: src/production-readiness/__tests__/diff-engine.test.ts
      artifacts:
        - kind: test_function
          name: changed added and deleted counts match fixtures
          description: Required planned behavioral test before promotion.
        - kind: test_function
          name: text line deltas are correct
          description: Required planned behavioral test before promotion.
        - kind: test_function
          name: large files can be skipped with limitations
          description: Required planned behavioral test before promotion.
        - kind: test_function
          name: binary file changes are counted separately
          description: Required planned behavioral test before promotion.
    - path: src/production-readiness/test-fixtures/prs/diff-cases.ts
      artifacts:
        - kind: type
          name: InventoryDiffFixtureName
          type: "'core' | 'line-deltas' | 'large-files' | 'binary-files'"
        - kind: interface
          name: InventoryDiffFixture
          description: Deterministic candidate/base inventories and options for
            one diff behavior.
        - kind: attribute
          name: name
          of: InventoryDiffFixture
          type: InventoryDiffFixtureName
        - kind: attribute
          name: candidate
          of: InventoryDiffFixture
          type: FileInventory
        - kind: attribute
          name: base
          of: InventoryDiffFixture
          type: GitHubBaseInventoryResult
        - kind: attribute
          name: options
          of: InventoryDiffFixture
          type: DiffEngineOptions
        - kind: function
          name: createInventoryDiffFixture
          args:
            - name: name
              type: string
          returns: InventoryDiffFixture
          description: Planned deterministic candidate/base inventory fixture
            factory for diff tests.
