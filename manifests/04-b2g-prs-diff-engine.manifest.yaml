outcome:
  status: completed
  summary: |
    PRS can now compare candidate and GitHub base inventories without I/O,
    produce deterministic added, changed, deleted, unique exact-rename,
    binary-change, and newline-sensitive line metrics, and retain typed
    limitations when exact line totals are unavailable. Exact Git blob hashes
    avoid unnecessary content reads, while an explicit base completeness bit
    suppresses unsafe addition and rename inference for partial trees.
  rationale: |
    The diff layer stays a neutral, pure boundary between inventory collection
    and later readiness classification. Bounded byte and LCS-cell budgets keep
    line analysis safe for an MV3 extension, selective base text avoids bulk
    GitHub content reads, and visible deterministic limitations prevent partial,
    binary, large, metadata-only, or unhydrated data from looking complete.
  lessons:
    - lesson_type: completeness-before-absence
      summary: |
        A missing path proves an addition only when the entire base tree is
        trustworthy. Partial GitHub trees may still support known shared and
        deleted comparisons, but addition and rename inference must be
        suppressed and explained with a typed limitation.
      tags:
        - partial-data
        - github
        - correctness
      paths:
        - src/production-readiness/inventory/githubBaseInventory.ts
        - src/production-readiness/diff/diffEngine.ts
    - lesson_type: exact-rename-evidence
      summary: |
        Exact-content renames are safe only when one candidate-only path and
        one base-only path share a unique Git blob SHA. Duplicate hashes remain
        separate added and deleted entries rather than becoming arbitrary
        rename pairs.
      tags:
        - rename
        - hashing
        - deterministic
      paths:
        - src/production-readiness/diff/diffEngine.ts
        - src/production-readiness/__tests__/diff-engine.test.ts
    - lesson_type: newline-sensitive-bounded-diff
      summary: |
        Preserving line terminators lets CRLF/LF and final-newline-only changes
        remain observable. Line metrics must still yield to explicit byte and
        quadratic cell budgets, leaving file-level changes and limitations
        visible when work is skipped.
      tags:
        - line-diff
        - memory
        - mv3
      paths:
        - src/production-readiness/diff/diffEngine.ts
        - src/production-readiness/test-fixtures/prs/diff-cases.ts
    - lesson_type: deterministic-degraded-output
      summary: |
        Limitation order needs a total comparator across message, source, and
        confidence even on early returns. Stable degraded output cannot depend
        on caller insertion order or which comparison path produced it.
      tags:
        - deterministic
        - degraded-state
        - limitations
      paths:
        - src/production-readiness/diff/diffEngine.ts
        - src/production-readiness/__tests__/diff-engine.test.ts
  review_notes:
    - source: independent reviewer subagent prs_child04_review
      severity: changes-requested
      summary: |
        First review found that informational binary and large-file inventory
        notices incorrectly made otherwise trustworthy comparisons partial,
        line terminators were not reflected in line metrics, content and rename
        option cases lacked coverage, and limitation tie ordering was
        incomplete. Each finding received a focused regression and fix.
    - source: independent reviewer subagent prs_child04_review
      severity: changes-requested
      summary: |
        Second review found one remaining early-return path that sorted equal
        limitation messages by message alone. A deliberately reversed fixture
        now proves shared message, source, and confidence ordering.
    - source: independent reviewer subagent prs_child04_review
      severity: ready
      summary: |
        Final read-only review found no blocking issues and confirmed the shared
        comparator, completeness safeguards, bounded newline-sensitive line
        work, typed limitations, exact unique renames, test coverage, plan-lock
        alignment, security/privacy boundaries, and manifest scope.
