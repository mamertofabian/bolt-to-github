outcome:
  status: completed
  completed_at: '2026-07-31T04:44:56Z'
  summary: |
    PRS can now compare a normalized candidate ZIP inventory directly with a
    GitHub base inventory and produce deterministic added, changed, deleted,
    renamed, indeterminate, line-change, and binary-change metrics.

    The engine uses explicit candidate Git blob SHAs instead of comparing
    incompatible ZIP SHA-256 values with Git blob identifiers. Partial GitHub
    inventories, missing comparable hashes, ambiguous rename groups, unknown
    binary classification, large files, and unavailable exact line deltas are
    preserved as visible limitations rather than invented certainty.
  rationale: |
    Keeping the comparison boundary pure and accepting normalized upstream
    results makes the diff deterministic and independently testable. Binary
    evidence is resolved per candidate and base side, while caller-provided
    line deltas are constrained by file status so invalid metrics cannot
    silently corrupt aggregate counts.
  lessons:
    - lesson_type: compare-compatible-identifiers
      summary: |
        A ZIP content SHA-256 and a Git blob SHA describe content with different
        algorithms. Rename and equality decisions require an explicitly
        supplied candidate Git blob SHA rather than comparing those fields.
      tags: [diff, git, hashing, correctness]
      paths:
        - src/production-readiness/diff/diffEngine.ts
    - lesson_type: model-unknown-evidence
      summary: |
        Candidate and base binary evidence must be resolved independently.
        Missing classification is an explicit unknown state that disables line
        metrics and emits a visible limitation.
      tags: [binary, partial-data, confidence]
      paths:
        - src/production-readiness/diff/diffEngine.ts
        - src/production-readiness/__tests__/diff-engine.test.ts
    - lesson_type: reject-ambiguous-renames
      summary: |
        Duplicate blob identities cannot support a deterministic one-to-one
        rename claim. Ambiguous groups remain additions and deletions with an
        explicit limitation.
      tags: [renames, deterministic-analysis]
      paths:
        - src/production-readiness/diff/diffEngine.ts
  review_notes:
    - source: independent reviewer /root/slice04_implementation_reviewer
      severity: needs-changes
      summary: |
        Initial reviews found incompatible upstream types, false changes from
        content-kind differences, ambiguous rename claims, unknown binary
        evidence presented as text, and status-inconsistent line deltas.
    - source: independent reviewer /root/slice04_implementation_reviewer
      severity: ready
      summary: |
        Revision 6 resolved binary evidence per side and retained all earlier
        fixes. The final review found no blocking or should-fix findings and
        confirmed MAID scope and contract fidelity.
