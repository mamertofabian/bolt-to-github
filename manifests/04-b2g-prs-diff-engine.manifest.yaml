    - manifests/03-b2g-prs-github-base-inventory.manifest.yaml
    - src/production-readiness/domain.ts
    - src/production-readiness/inventory/zipInventory.ts
    - src/production-readiness/inventory/githubBaseInventory.ts
validate:
  - pnpm exec vitest run src/production-readiness/__tests__/diff-engine.test.ts src/production-readiness/__tests__/github-base-inventory.test.ts
  - ./scripts/maid validate manifests/04-b2g-prs-diff-engine.manifest.yaml --mode behavioral
