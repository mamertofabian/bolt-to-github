    - chrome-web-store
    - auth
    - github-app
    - pat-retirement
    - major-version
  priority: high
  promotable: true
  release_version: 2.0.0
  release_status: ready-for-publication
  release_scope:
    - GitHub App-only authentication and PAT retirement
    - Preserved project-scoped repository mappings
    - September 2026 direct Bolt Download compatibility
    - Paused client-side GA4 and reduced host permissions
    - Fail-closed local and automated release packaging
  excluded_scope:
    - Production readiness checks
  release_validation:
    - pnpm test:ci
    - pnpm exec playwright test e2e/auth.spec.ts e2e/lifecycle.spec.ts e2e/error-flow-product.spec.ts e2e/manual-repo.spec.ts --reporter=line
  external_release_tasks:
    - Publish the GitHub release only after the final commit is reviewed and merged to main.
    - Submit the validated package to the Chrome Web Store and update the listing for GitHub App-only setup.
    - Update support macros and linked tutorial media that still demonstrate PAT setup.
  notes: Automated browser checks are part of the publication workflow; Chrome Web Store submission and final installed-extension QA remain external release evidence.
removed_artifacts:
  - kind: function
    name: setupPATAuth
    file: e2e/helpers/storage.ts
    reason: Connected browser fixtures must satisfy the GitHub App-only authority instead of bypassing it with PAT storage.
  - kind: function
    name: setupGitHubAppAuth
    file: e2e/helpers/storage.ts
    reason: The replacement fixture also seeds the required Bolt2GitHub session and verified live-connection cache.
  - kind: function
    name: fillOnboardingPAT
    file: e2e/helpers/popup.ts
    reason: The popup no longer exposes a PAT selector or credential input.
  - kind: attribute
    name: PAT_AUTH_ADOPTED
    of: ANALYTICS_EVENTS
    file: src/lib/utils/analytics.ts
    reason: PAT adoption remains unsupported after GitHub App-only enforcement.
