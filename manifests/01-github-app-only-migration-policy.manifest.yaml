outcome:
  status: completed
  summary: |
    Added a pure legacy-auth classifier and an ordered, idempotent Chrome
    storage migration. Legacy PAT users receive a durable migration-required
    marker before their PAT and legacy auth-choice state are removed, while
    repository owners and project mappings remain untouched. Mixed users with
    an existing GitHub App installation are migration-complete locally, and the
    marker clears only after callers confirm both a live account session and a
    live installation connection.
  rationale: |
    Chrome sync and local storage cannot be updated atomically, so the policy
    records the explanatory marker first and makes every later cleanup step
    retryable. Explicitly reading all legacy local auth keys repairs crashes on
    either side of PAT deletion without turning cached installation metadata
    into proof of live runtime readiness.
  lessons:
    - lesson_type: crash-safe-cross-namespace-migration
      summary: |
        Cross-namespace credential retirement must model every intermediate
        state, including marker-written/token-present and
        token-removed/local-choice-present, so retries finish cleanup safely.
      tags: [auth, chrome-storage, migration, reliability]
      paths:
        - src/lib/services/githubAuthMigration.ts
        - src/lib/services/__tests__/githubAuthMigration.test.ts
    - lesson_type: auth-migration-state-classification
      summary: |
        Local migration classification and live connection verification are
        separate authorities; stored installation metadata can prevent an
        unnecessary migration prompt but cannot clear a durable marker.
      tags: [auth, github-app, state-machine]
      paths:
        - src/lib/services/githubAuthMigration.ts
        - src/lib/utils/githubConnection.ts
