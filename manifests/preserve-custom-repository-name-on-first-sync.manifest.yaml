  summary: |
    Newly created Bolt projects now retain a custom repository mapping during
    their first outward synchronization. Repairing a missing project_name no
    longer exits the format bridge before the current projectSettings values
    are applied, so the backend request carries the saved repository name,
    owner, branch, project title, and privacy value instead of project-ID
    defaults.
  rationale: |
    The incomplete-record repair remains in place, but now returns its repaired
    records to the existing authoritative projectSettings conversion pipeline.
    This preserves the established outward-sync and conflict policies without
    adding repository-specific UI exceptions or accepting server data as the
    local source of truth.
