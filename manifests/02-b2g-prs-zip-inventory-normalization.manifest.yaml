        - build
      status: passed
      summary: The v1.3.22 production extension build completed successfully after the final decoder fix.
    - command:
        - ./scripts/maid
        - validate
        - manifests/02-b2g-prs-zip-inventory-normalization.manifest.yaml
        - --mode
        - behavioral
      status: passed
      summary: Child 02 behavioral validation passed with every declared artifact exercised.
    - command:
