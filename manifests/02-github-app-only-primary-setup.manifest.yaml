schema: '2'
goal: |
  Replace dual-auth onboarding and settings with a GitHub App-only setup flow
  that gives legacy PAT users explicit migration guidance.
description: |
  Second child of github-app-only-authentication and the promoted primary
  setup implementation contract.

  The popup must no longer offer an authentication choice or PAT input. Fresh
  and disconnected users see the normal GitHub App setup. A stored migration
  marker changes the explanation to a required upgrade message while using the
  same explicit sign-in/connect action. The CTA behavior depends on live state:
  sign in when the session is missing, connect/install when the installation is
  missing, and finish only when both are confirmed. No mount, startup, timer, or
  storage event may automatically open an external tab.

  Existing repoOwner and project mappings remain available after connection so
  users do not need to reconstruct repository setup.

  The Help tab is part of this primary setup contract because it currently
  contains complete classic and fine-grained PAT instructions, token creation
  links, token-security guidance, and token-type language for private imports.
  It must instead explain Bolt2GitHub sign-in, GitHub App installation and
  repository access, migration recovery, and GitHub App security boundaries.

  The current TUTORIAL_LINK is not verified as GitHub App-only. Remove its CTA
  and the PAT token-creation constants in this child. A verified replacement
  tutorial may be introduced later, but the extension must not link users to
  potentially obsolete PAT instructions during this migration.
temptations:
- risk: Do not merely hide the PAT radio while retaining PAT completion or save branches.
  instead: Remove PAT as a valid UI state and assert setup completion requires live session plus GitHub App installation.
- risk: Do not render a generic Sign in message for known legacy PAT users.
  instead: Use the migration marker to explain that GitHub authentication changed and that the GitHub App is now required.
- risk: Do not open auth pages from onMount or reactive statements.
  instead: Keep window.open calls exclusively behind labeled user-click handlers and test that rendering causes no navigation.
- risk: Do not retain the current setup tutorial or token-link constants without checking their post-PAT content.
  instead: Remove the unverified tutorial CTA and PAT creation URLs now; restore a tutorial only when a GitHub App-specific destination is available and tested.
type: refactor
supersedes:
- align-onboarding-with-bolt2github-session
