outcome:
  status: completed
  summary: |
    Replaced the popup's dual GitHub authentication setup with an explicit
    GitHub App-only flow across onboarding, settings, and Help. Legacy PAT
    state now leads to durable migration guidance, never qualifies as a live
    connection, and is normalized in memory only after settings initialize.
    Existing repository owner, repository, branch, project mappings, GitHub
    App repository discovery, and the Help tab's What's New action remain
    available without restoring PAT storage or automatic auth navigation.
  rationale: |
    A single supported authentication path removes conflicting setup choices
    while preserving the repository workflows users rely on. Startup orders
    migration, live connection reconciliation, settings initialization, and
    GitHub App normalization so removed legacy selector keys cannot make a
    connected App user appear to be a PAT user. Migration guidance clears only
    when both a live Bolt2GitHub session and App installation are confirmed.
  lessons:
  - lesson_type: preserve-adjacent-ui-behavior-during-auth-simplification
    summary: |
      Replacing authentication UI can silently remove adjacent repository
      discovery and Help actions. Behavioral coverage must protect those
      workflows separately from assertions that PAT controls disappeared.
    tags: [auth, ui, regression, github-app]
    paths:
    - src/lib/components/GitHubSettings.svelte
    - src/lib/components/Help.svelte
  - lesson_type: initialize-before-auth-state-normalization
    summary: |
      When a storage migration removes a legacy selector, initialize the store
      before applying in-memory GitHub App normalization and before exposing
      readiness. Otherwise store defaults can temporarily select the retired
      path and break setup or saving for already-connected users.
    tags: [auth, migration, startup, svelte]
    paths:
    - src/popup/App.svelte
    - src/popup/__tests__/App.component.test.ts
  review_notes:
  - source: independent reviewer /root/review_child02_fast
    severity: findings-fixed
    summary: |
      Found that removed selector storage could leave the initialized popup in
      PAT mode and that the settings rewrite removed GitHub App repository
      discovery. Startup normalization, discovery, degraded-state UI, and
      regression tests now cover both findings.
  - source: independent reviewer /root/review_child02_round2
    severity: finding-fixed
    summary: |
      Found that the Help rewrite changed What's New into an unhandled event.
      The original active-tab message and popup-close behavior were restored
      with focused interaction coverage.
  - source: independent reviewer /root/review_child02_round2 final
    severity: ready
    summary: |
      Final read-only review found no remaining scope, behavioral, or contract
      issues and returned Ready.
