schema: '2'
goal: |
  Detect dependency additions, removals, version changes, package manager
  conflicts, manifest/lockfile mismatches, and production-sensitive dependency
  category introductions for the Production Readiness Snapshot module.
description: |
  Sixth implementation child for the b2g-production-readiness-snapshot parent
  epic. Fixture-backed behavioral tests define a pure detector over parsed
  candidate/base package manifests, normalized lockfile paths, and the existing
  file diff contract.

  Package manifest availability is explicit: present and known-absent states
  may be compared, while unavailable content becomes a typed detector
  limitation and never a false all-added or all-removed result. Manifest and
  lockfile mismatch signals use actual diff entries because identical path
  lists cannot prove whether a file changed.

  Dependency family rules are centralized data and may map one package to more
  than one production-sensitive category, such as Supabase affecting both auth
  and platform/storage concerns. Signals are deterministic, evidence-backed,
  and phrased as review prompts rather than vulnerability or broken-install
  claims. Credential-bearing Git, HTTP, file, alias, or otherwise unsafe
  dependency specifiers are redacted before entering structured evidence.
type: feature
files:
  create:
    - path: src/production-readiness/rules/dependency-categories.ts
      artifacts:
        - kind: type
          name: DependencyCategory
          type: "'auth' | 'database' | 'payments' | 'email_sms' | 'ai_api' | 'validation' | 'monitoring' | 'platform_storage'"
          description: Production-sensitive dependency families from the PRS reference document.
        - kind: interface
          name: DependencyCategoryRule
          description: Data-driven dependency category and exact or scoped-wildcard package patterns.
        - kind: attribute
          name: category
          of: DependencyCategoryRule
          type: DependencyCategory
        - kind: attribute
          name: packages
          of: DependencyCategoryRule
          type: readonly string[]
        - kind: function
          name: getDependencyCategoryRules
          args: []
          returns: DependencyCategoryRule[]
          description: Returns a fresh ordered copy of the dependency category rule catalog.
        - kind: function
          name: categorizeDependency
          args:
            - name: packageName
              type: string
          returns: DependencyCategory[]
          description: Maps one exact or scoped package name to every matching category in deterministic order.
    - path: src/production-readiness/detectors/dependencyDetector.ts
      artifacts:
        - kind: type
          name: PackageDependencySection
          type: "'dependencies' | 'devDependencies' | 'peerDependencies' | 'optionalDependencies'"
        - kind: interface
          name: PackageManifest
          description: Parsed package dependency sections used by the detector; unrelated package.json fields stay outside this slice.
        - kind: attribute
          name: dependencies
          of: PackageManifest
          type: Readonly<Record<string, string>> | undefined
        - kind: attribute
          name: devDependencies
          of: PackageManifest
          type: Readonly<Record<string, string>> | undefined
        - kind: attribute
          name: peerDependencies
          of: PackageManifest
          type: Readonly<Record<string, string>> | undefined
        - kind: attribute
          name: optionalDependencies
          of: PackageManifest
          type: Readonly<Record<string, string>> | undefined
        - kind: type
          name: PackageManifestSnapshot
          type: "{ status: 'present'; path: string; manifest: PackageManifest } | { status: 'absent'; path: string } | { status: 'unavailable'; path: string; limitation: PartialDataNotice }"
          description: Explicit present, known-absent, or unavailable package manifest state.
        - kind: interface
          name: DependencyDetectorInput
          description: Candidate/base manifests, normalized lockfile paths, and file diff required for dependency analysis.
        - kind: attribute
          name: candidatePackageJson
          of: DependencyDetectorInput
          type: PackageManifestSnapshot
        - kind: attribute
          name: basePackageJson
          of: DependencyDetectorInput
          type: PackageManifestSnapshot
        - kind: attribute
          name: candidateLockfiles
          of: DependencyDetectorInput
          type: readonly string[]
        - kind: attribute
          name: baseLockfiles
          of: DependencyDetectorInput
          type: readonly string[]
        - kind: attribute
          name: diff
          of: DependencyDetectorInput
          type: InventoryDiffResult
        - kind: interface
          name: DependencyDetectionResult
          description: Deterministically ordered dependency signals and honest typed limitations.
        - kind: attribute
          name: signals
          of: DependencyDetectionResult
          type: ReadinessSignal[]
        - kind: attribute
          name: limitations
          of: DependencyDetectionResult
          type: PartialDataNotice[]
        - kind: function
          name: detectDependencySignals
          args:
            - name: input
              type: DependencyDetectorInput
          returns: DependencyDetectionResult
          description: Compares all dependency sections, detects categorized introductions and lockfile consistency signals, and suppresses unsafe inference from unavailable manifests.
    - path: src/production-readiness/test-fixtures/prs/dependencies.ts
      artifacts:
        - kind: interface
          name: DependencyDetectorFixture
          description: Fresh deterministic dependency detector input for a named comparison scenario.
        - kind: attribute
          name: input
          of: DependencyDetectorFixture
          type: DependencyDetectorInput
        - kind: function
          name: createDependencyDetectorFixture
          args:
            - name: name
              type: string
          returns: DependencyDetectorFixture
          description: Returns fresh dependency-change, unsafe-specifier, categorized-introduction, manifest-only, lockfile-only, conflict, removal, or unavailable-base fixtures and rejects unknown names.
    - path: src/production-readiness/detectors/__tests__/dependencyDetector.test.ts
      artifacts:
        - kind: test_function
          name: detects dependency additions removals and version changes from package json diffs
          description: All four package dependency sections produce deterministic added, removed, exact version-change, compound major-looking, and credential-redacted evidence without input mutation.
        - kind: test_function
          name: categorizes production sensitive dependency introductions
          description: Exact and scoped package families, including overlapping Supabase roles, produce neutral category review signals rather than vulnerability claims.
        - kind: test_function
          name: reports manifest and lockfile mismatch signals
          description: Actual diff entries drive manifest-only and lockfile-only mismatches, multiple lockfile families are visible, removed manifests are explicit, and unavailable base data yields limitations without false additions.
  read:
    - docs/b2g_production_readiness_snapshot_reference.md
    - docs/unit-testing-rules.md
    - manifests/drafts/b2g-production-readiness-snapshot.manifest.yaml
    - manifests/01-b2g-prs-domain-models-fixtures.manifest.yaml
    - manifests/02-b2g-prs-zip-inventory-normalization.manifest.yaml
    - manifests/03-b2g-prs-github-base-inventory.manifest.yaml
    - manifests/04-b2g-prs-diff-engine.manifest.yaml
    - manifests/05-b2g-prs-sensitive-path-classifier.manifest.yaml
    - src/production-readiness/domain.ts
    - src/production-readiness/diff/diffEngine.ts
    - src/production-readiness/inventory/zipInventory.ts
validate:
  - pnpm exec vitest run src/production-readiness/detectors/__tests__/dependencyDetector.test.ts
  - ./scripts/maid validate manifests/06-b2g-prs-dependency-detector.manifest.yaml --mode behavioral
  - pnpm lint
  - pnpm check
