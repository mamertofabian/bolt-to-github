temptations:
  - risk: Do not hardcode package family names inside detector control flow.
    instead: Keep exact and scoped-wildcard package matching in dependency-categories rules and test it through public category and detector behavior.
  - risk: Do not treat a new dependency as a vulnerability, prove an installation is broken, or copy unsafe raw specifiers into evidence.
    instead: Emit neutral review signals and redact credential-bearing Git, HTTP, file, alias, or otherwise unsafe dependency specifiers before structured output.
  - risk: Do not infer all additions or removals when either package manifest is unavailable.
    instead: Preserve the typed source limitation and suppress manifest comparison while retaining independent lockfile checks.
  - risk: Do not infer manifest or lockfile changes from path-list differences alone.
    instead: Use normalized file diff entries for actual change detection and use candidate lockfiles only for current package-manager conflict state.
  - risk: Do not let dependency section, object key, rule, or lockfile input order alter output.
    instead: Apply total ordering to packages, categories, signals, evidence, and limitations without mutating inputs.
outcome:
  status: completed
  summary: |
    PRS can now compare all four package.json dependency sections and emit
    deterministic signals for additions, removals, version changes, package
    manager conflicts, and diff-proven manifest/lockfile mismatches. New
    production-sensitive packages are categorized through centralized rules,
    including packages such as Supabase that legitimately map to more than one
    review category.

    Present, known-absent, and unavailable package manifests remain distinct,
    so partial base data produces typed limitations instead of false bulk
    changes. Structured evidence admits only normalized safe semver ranges and
    known distribution tags; URLs, aliases, file paths, credential-like text,
    control characters, and other unsafe specifiers are redacted. Major-looking
    range comparisons use conservative admitted-major intervals and decline to
    classify unknown or overflowed ranges.
  rationale: |
    Keeping dependency families as ordered data separates policy from detector
    mechanics and makes overlapping category membership explicit. Comparing
    actual diff entries prevents unchanged path inventories from masquerading
    as package-manifest or lockfile changes. Strict evidence sanitization and
    conservative range analysis preserve useful review prompts without leaking
    credentials or overstating compatibility risk.
  lessons:
    - lesson_type: dependency-evidence-allowlist
      summary: |
        Dependency specifiers are attacker-controlled evidence. Redacting only
        URL-shaped values is insufficient because bare credentials, JWTs,
        aliases, local paths, and control characters can also leak through
        structured output. A narrow allowlist of semver syntax and known
        distribution tags is safer than an expanding denylist.
      tags:
        - privacy
        - evidence
        - dependencies
      paths:
        - src/production-readiness/detectors/dependencyDetector.ts
        - src/production-readiness/detectors/__tests__/dependencyDetector.test.ts
    - lesson_type: conservative-semver-intervals
      summary: |
        First-number comparison is not enough for compound or partial semver
        ranges. Strict and inclusive comparator boundaries change admitted
        major sets differently, while unsafe integers and unknown union branches
        must invalidate the whole signature to avoid false major-change claims.
      tags:
        - semver
        - correctness
        - deterministic-analysis
      paths:
        - src/production-readiness/detectors/dependencyDetector.ts
        - src/production-readiness/detectors/__tests__/dependencyDetector.test.ts
    - lesson_type: diff-proves-change
      summary: |
        Candidate and base path lists describe current inventories but cannot
        prove that a shared package manifest or lockfile changed. Consistency
        signals must use normalized diff entries, while current lockfile paths
        remain appropriate for detecting simultaneous package-manager families.
      tags:
        - diff
        - lockfiles
        - evidence
      paths:
        - src/production-readiness/detectors/dependencyDetector.ts
        - src/production-readiness/diff/diffEngine.ts
    - lesson_type: unavailable-is-not-absent
      summary: |
        A package manifest that could not be read cannot safely participate in
        additions or removals. Explicit snapshot states keep unavailable source
        data visible as a typed limitation while preserving independent
        lockfile checks.
      tags:
        - partial-data
        - limitations
        - correctness
      paths:
        - src/production-readiness/detectors/dependencyDetector.ts
        - src/production-readiness/test-fixtures/prs/dependencies.ts
  review_notes:
    - source: independent reviewer subagent prs_child04_review
      severity: changes-requested
      summary: |
        Initial review found plan-lock drift, raw credential-bearing dependency
        URLs in evidence, and insufficient first-number range comparison. Plan
        revisions and focused regressions established strict redaction and
        compound admitted-major behavior.
    - source: independent reviewer subagent prs_child04_review
      severity: changes-requested
      summary: |
        Follow-up review found that bare credentials, JWT-like values, control
        characters, and partial comparator boundaries remained unsafe or
        ambiguous. A strict display-safe allowlist and interval-based boundary
        regressions resolved those gaps.
    - source: independent reviewer subagent prs_child04_review
      severity: changes-requested
      summary: |
        Lower-bound review identified the semantic difference between >2 and
        >=2 and equivalence between >2 and >=3 at the admitted-major level.
        Isolated red-to-green regressions now lock both cases.
    - source: independent reviewer subagent prs_child04_review
      severity: changes-requested
      summary: |
        Overflow review found that unsafe numeric majors and strict-greater
        increments could become false intervals or disappear from unions.
        Unknown and overflowed branches now invalidate the complete signature.
    - source: independent reviewer subagent prs_child04_review
      severity: ready
      summary: |
        Final read-only review found no remaining issues and confirmed privacy,
        normalization, conservative semver behavior, deterministic ordering,
        diff-driven mismatches, typed limitations, artifact scope, revision-6
        plan alignment, and preserved red evidence.
