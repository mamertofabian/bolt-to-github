# manifest-kind: active-contract
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: |
  Detect dependency additions, removals, version changes, package manager
  conflicts, and production-sensitive dependency category introductions for the
  Production Readiness Snapshot module.
description: |
  Child draft for the b2g-production-readiness-snapshot parent epic, derived
  from docs/b2g_production_readiness_snapshot_reference.md sections 8.3, 12,
  13, and 19.3 Child 6.

  Promoted child contract with fixture-backed behavioral coverage for package
  section diffs, production-sensitive categories, and manifest/lockfile
  consistency signals.

  Rationale:
  - Keep dependency category rules data-driven so Stripe, Resend, Supabase,
    auth, database, AI, monitoring, validation, and related package families
    can be extended without scattering detector logic.
  - Compare candidate and base package manifests rather than inferring changes
    from lockfiles alone.
  - Treat manifest/lockfile mismatches and multiple lockfiles as readiness
    signals, not proof of a broken install.
type: feature
files:
  create:
    - path: src/production-readiness/detectors/dependencyDetector.ts
      artifacts:
        - kind: interface
          name: PackageManifest
          description: Dependency sections parsed from one package.json file.
        - kind: attribute
          of: PackageManifest
          name: dependencies
          type: Readonly<Record<string, string>> | undefined
        - kind: attribute
          of: PackageManifest
          name: devDependencies
          type: Readonly<Record<string, string>> | undefined
        - kind: attribute
          of: PackageManifest
          name: peerDependencies
          type: Readonly<Record<string, string>> | undefined
        - kind: attribute
          of: PackageManifest
          name: optionalDependencies
          type: Readonly<Record<string, string>> | undefined
        - kind: function
          name: detectDependencySignals
          args:
            - name: input
              type: DependencyDetectorInput
          returns: ReadinessSignal[]
          description: |
            Compares candidate and base package metadata, reports added,
            removed, version-changed, categorized, package-manager-conflict,
            and manifest/lockfile mismatch signals with deterministic evidence.
        - kind: interface
          name: DependencyDetectorInput
          description: Candidate/base package manifests, inventory metadata, and PRS
            comparison summary required by the dependency detector.
        - kind: attribute
          of: DependencyDetectorInput
          name: candidatePackageJson
          type: PackageManifest | null
        - kind: attribute
          of: DependencyDetectorInput
          name: basePackageJson
          type: PackageManifest | null
        - kind: attribute
          of: DependencyDetectorInput
          name: candidatePackageJsonAvailable
          type: boolean
        - kind: attribute
          of: DependencyDetectorInput
          name: basePackageJsonAvailable
          type: boolean
        - kind: attribute
          of: DependencyDetectorInput
          name: candidateLockfiles
          type: string[]
        - kind: attribute
          of: DependencyDetectorInput
          name: baseLockfiles
          type: string[]
        - kind: attribute
          of: DependencyDetectorInput
          name: packageManifestChanged
          type: boolean
        - kind: attribute
          of: DependencyDetectorInput
          name: lockfileChanged
          type: boolean
    - path: src/production-readiness/rules/dependency-categories.ts
      artifacts:
        - kind: type
          name: DependencyCategory
          type: "'auth' | 'database' | 'payments' | 'email_sms' | 'ai_api' | 'validation'
            | 'monitoring' | 'platform_storage'"
          description: Production-sensitive dependency categories called out by the
            PRS reference document.
        - kind: function
          name: categorizeDependency
          args:
            - name: packageName
              type: string
          returns: DependencyCategory | null
          description: Maps exact package names and scoped package patterns to
            production-sensitive dependency categories.
    - path: src/production-readiness/detectors/__tests__/dependencyDetector.test.ts
      artifacts:
        - kind: test_function
          name: detects dependency additions removals and version changes from
            package json diffs
          description: Planned fixture test for dependencies, devDependencies,
            peerDependencies, and optionalDependencies.
        - kind: test_function
          name: categorizes production sensitive dependency introductions
          description: Planned fixture test for Stripe, Resend, Supabase, auth,
            database, AI, monitoring, and validation package signals.
        - kind: test_function
          name: reports manifest and lockfile mismatch signals
          description: Planned fixture test for package.json changes without
            lockfile changes, lockfile changes without manifest changes, and
            multiple package-manager lockfiles.
  read:
    - manifests/drafts/b2g-production-readiness-snapshot.manifest.yaml
    - manifests/01-b2g-prs-domain-models-fixtures.manifest.yaml
    - manifests/02-b2g-prs-zip-inventory-normalization.manifest.yaml
    - manifests/04-b2g-prs-diff-engine.manifest.yaml
    - docs/b2g_production_readiness_snapshot_reference.md
    - src/production-readiness/domain.ts
    - src/production-readiness/diff/diffEngine.ts
    - src/production-readiness/inventory/zipInventory.ts
    - src/production-readiness/test-fixtures/prsFixtures.ts
validate:
  - pnpm exec vitest run
    src/production-readiness/detectors/__tests__/dependencyDetector.test.ts
  - ./scripts/maid validate manifests/06-b2g-prs-dependency-detector.manifest.yaml
    --mode behavioral
  - pnpm lint
  - pnpm check
