temptations:
  - risk: Do not hardcode every dependency name inside detector control flow.
    instead: Keep package family matching in dependency-categories rules and test
      category mapping independently from signal composition.
  - risk: Do not treat a new dependency as a vulnerability finding.
    instead: Emit an evidence-backed readiness signal that asks the user to review
      the introduced production-sensitive category.
  - risk: Do not infer dependency drift from lockfiles when package manifests are
      unavailable.
    instead: Report the missing or mismatched data as a limitation or
      manifest/lockfile consistency signal.
  - risk: Do not ignore lockfiles through broad source-ignore rules.
    instead: Preserve lockfile metadata for dependency analysis even when the
      files are skipped for expensive source scanning.
outcome:
  status: completed
  completed_at: '2026-07-31T05:39:02Z'
  summary: |
    PRS now compares all four package.json dependency sections and emits
    deterministic readiness signals for additions, removals, version changes,
    section moves, production-sensitive introductions, and sensitive
    development-to-runtime promotions.

    The detector also reports package-manifest and lockfile inconsistencies,
    multiple package-manager lockfiles, and unavailable comparison data without
    inventing dependency drift. Every emitted signal carries concrete package,
    section, version, lockfile, or availability evidence.
  rationale: |
    Dependency changes can alter authentication, persistence, payments,
    communications, AI, validation, monitoring, and platform behavior even
    when the application diff looks small. A pure detector with a separate
    data-driven category policy keeps those decisions deterministic,
    auditable, and independently testable while avoiding unsupported
    vulnerability claims.
  lessons:
    - lesson_type: distinguish-absence-from-unavailability
      summary: |
        A confirmed missing package manifest and an unavailable manifest are
        different states. Explicit availability flags prevent one-sided input
        failures from being misreported as wholesale dependency additions or
        removals.
      tags: [dependencies, incomplete-data, evidence]
      paths:
        - src/production-readiness/detectors/dependencyDetector.ts
        - src/production-readiness/detectors/__tests__/dependencyDetector.test.ts
    - lesson_type: model-section-moves-explicitly
      summary: |
        Moving a package between dependency sections is a first-class change,
        not an unrelated removal and addition. If its version also changes,
        both the move and version change remain observable, and sensitive
        development-to-runtime promotions receive their own review signal.
      tags: [dependencies, section-moves, runtime-risk]
      paths:
        - src/production-readiness/detectors/dependencyDetector.ts
        - src/production-readiness/detectors/__tests__/dependencyDetector.test.ts
    - lesson_type: require-consistency-evidence
      summary: |
        Manifest and lockfile consistency signals still need concrete evidence
        when no lockfile path is available. Boolean change metrics make the
        reported mismatch auditable instead of producing an empty claim.
      tags: [lockfiles, consistency, evidence]
      paths:
        - src/production-readiness/detectors/dependencyDetector.ts
  review_notes:
    - source: independent reviewer /root/slice06_implementation_reviewer
      severity: needs-changes
      summary: |
        The first review found one-sided unavailable manifests could invent
        dependency drift, pathless lockfile changes lacked evidence, and
        section moves were double-counted while hiding sensitive runtime
        promotions.
    - source: independent reviewer /root/slice06_implementation_reviewer
      severity: needs-changes
      summary: |
        The second review found that a dependency changing both section and
        version emitted the move but suppressed the required version-change
        signal.
    - source: independent reviewer /root/slice06_implementation_reviewer
      severity: ready
      summary: |
        Revision 3 resolved every finding. The final review reported no
        findings, coherent locked tests, clean scope, and a ready verdict.
