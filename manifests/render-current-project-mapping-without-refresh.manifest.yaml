schema: '2'
goal: Render saved project repository settings on Home immediately without requiring a popup refresh
description: |
  HomeTabContent currently passes the legacy top-level repoName and branch fields
  to ProjectStatus. RepoSettings saves the authoritative project-scoped mapping
  through githubSettingsActions.setProjectSettings, which immediately updates
  projectSettings[projectId] but intentionally does not rewrite those top-level
  compatibility fields. The Home card therefore continues showing the Bolt
  project ID until a popup refresh calls loadProjectSettings.

  Derive the active Home project values from projectSettings[projectId], with
  the existing top-level values only as a compatibility fallback when no scoped
  mapping is available. Forward the scoped project title as well so all values
  saved by the authoritative modal update together. This adds behavior to the
  existing HomeTabContent contract without changing its public props or events.
temptations:
- risk: Do not force a popup reload or reread Chrome storage after every save.
  instead: Render from the already-reactive projectSettings mapping updated by the save action.
- risk: Do not make RepoSettings maintain two competing copies of the current project mapping.
  instead: Keep setProjectSettings authoritative and derive the Home card from that project-scoped state.
- risk: Do not remove top-level repoName and branch compatibility fallbacks in this narrow fix.
  instead: Prefer the scoped mapping when present and preserve current fallback behavior for unmigrated state.
type: fix
files:
  scope:
  - path: src/popup/components/HomeTabContent.svelte
    reason: Derive ProjectStatus inputs from the active project-scoped mapping without changing HomeTabContent's public API.
  edit:
  - path: src/popup/components/__tests__/HomeTabContent.component.test.ts
    artifacts:
    - kind: test_function
      name: renders the current project mapping immediately when top-level repository fields are stale
      description: The Home card displays the active project's saved repository name, branch, and title from projectSettings without a popup refresh.
  read:
  - src/lib/components/ProjectStatus.svelte
  - src/lib/components/RepoSettings.svelte
  - src/lib/stores/githubSettings.ts
  - src/popup/App.svelte
  - src/popup/components/TabsView.svelte
  - manifests/05-github-app-only-issue-feedback-surfaces.manifest.yaml
  - manifests/make-github-settings-connection-only.manifest.yaml
validate:
- pnpm exec vitest run src/popup/components/__tests__/HomeTabContent.component.test.ts src/lib/components/__tests__/ProjectStatus.component.test.ts
- ./scripts/maid validate manifests/render-current-project-mapping-without-refresh.manifest.yaml --mode behavioral
- pnpm lint
- pnpm check
- pnpm build
