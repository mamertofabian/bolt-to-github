  summary: |
    The Home dashboard now updates its repository name, branch, and project
    title immediately after RepoSettings saves the current project mapping.
    ProjectStatus receives values from projectSettings[projectId] instead of
    waiting for a popup refresh to copy them into legacy top-level fields.
  rationale: |
    The project-scoped mapping is already the authoritative reactive state and
    is updated synchronously by setProjectSettings. Reading it directly removes
    the stale display without adding storage reads, reloads, or duplicate save
    state, while retaining compatibility fallbacks for unmigrated settings.
  lessons:
    - lesson_type: render-from-project-scoped-authority
      summary: |
        When a store contains both compatibility fields and scoped records,
        mounted UI for a known entity should derive from the scoped record.
        Refresh-only correctness signals that rendering is reading the wrong
        level of otherwise-correct state.
