        - src/popup/components/OnboardingView.svelte
        - src/popup/App.svelte
    - lesson_type: actionable-auth-cta-precedes-transient-status
      summary: |
        When a transient status message describes the same missing-auth action
        as a persistent CTA, the CTA must remain labeled and enabled instead of
        inheriting generic save-button loading behavior.
