outcome:
  status: completed
  summary: |
    GitHub App onboarding now combines cached installation metadata with the
    current Bolt2GitHub session before presenting a connected or complete
    state. When an installation survives sign-out, the popup keeps a persistent
    sign-in explanation and immediately actionable Sign in to Bolt2GitHub CTA,
    including while the existing transient sign-in status is active. The CTA
    opens the login page and returns without dispatching save. Signed-in GitHub
    App and PAT setup behavior remain unchanged.
  rationale: |
    The installation ID is durable recovery configuration, not proof that the
    current user has an authenticated Bolt2GitHub session. Passing the popup's
    existing isUserAuthenticated state through OnboardingView keeps that
    prerequisite explicit without clearing useful installation metadata,
    creating another auth authority, or weakening the existing live GitHub
    action gate.
  lessons:
