schema: '2'
goal: Keep GitHub App onboarding aligned with the current Bolt2GitHub session when cached installation metadata survives sign-out.
description: |
  The popup's live connection gate correctly detects that a user is signed out of
  Bolt2GitHub, but OnboardingSetup independently treats a cached
  githubAppInstallationId as a complete GitHub App setup. The resulting screen
  briefly shows the live "sign in" status, then reverts to a stale connected
  card and an enabled Complete Setup button whose save action cannot restore the
  missing session.

  Add an explicit, backward-compatible isUserAuthenticated component prop and
  pass the popup's existing authenticated state through OnboardingView. In
  GitHub App mode, an installation is ready only when that session is present.
  When an installation remains cached while signed out, keep a persistent
  sign-in-required explanation, replace the bottom Complete Setup action with
  "Sign in to Bolt2GitHub", and open the existing login URL without dispatching
  save. Signed-in GitHub App behavior and PAT onboarding remain unchanged.

  Rationale: the live session is the missing prerequisite, while the installation
  ID is still useful reconnect metadata and should not be destructively cleared.
  Passing the already-derived popup state keeps the dependency explicit and
  avoids another background auth request or a second auth authority in a child
  component.
temptations:
  - risk: Do not clear the cached GitHub App installation merely because the Bolt2GitHub session is absent.
    instead: Treat installation and session as separate prerequisites and preserve the installation for recovery after sign-in.
  - risk: Do not route the signed-out CTA through saveSettings or switch the user to PAT mode.
    instead: Open https://bolt2github.com/login directly and leave the selected GitHub App method intact.
  - risk: Do not require a Bolt2GitHub session for deliberately configured legacy PAT users.
    instead: Apply the new session prerequisite only to GitHub App setup and retain the existing PAT token-plus-owner gate.
  - risk: Do not add another auth service instance or background request inside onboarding components.
    instead: Pass the popup's existing isUserAuthenticated state through OnboardingView as an explicit prop.
files:
  edit:
    - path: src/lib/components/OnboardingSetup.svelte
      artifacts:
        - kind: function
          name: OnboardingSetup
          args:
            - name: props
              type: OnboardingSetup component props
          returns: Svelte component instance
          description: |
            Renders GitHub App setup as connected only when both a cached
            installation and the current Bolt2GitHub session are present. A
            signed-out stale-installation state remains visibly actionable and
            opens the login page instead of dispatching save. PAT behavior is
            unchanged.
    - path: src/popup/components/OnboardingView.svelte
      artifacts:
        - kind: function
          name: OnboardingView
          args:
            - name: props
              type: OnboardingView component props
          returns: Svelte component instance
          description: Forwards the popup's explicit authenticated state into OnboardingSetup without creating another auth dependency.
    - path: src/lib/components/__tests__/OnboardingSetup.component.test.ts
      artifacts:
        - kind: test_function
          name: should keep a stale GitHub App installation visibly blocked while signed out
        - kind: test_function
          name: should open Bolt2GitHub login without saving when the signed-out setup CTA is clicked
    - path: src/popup/components/__tests__/OnboardingView.component.test.ts
      artifacts:
        - kind: test_function
          name: should forward signed-out state to the GitHub App setup step
    - path: src/popup/__tests__/App.component.test.ts
      artifacts:
        - kind: test_function
          name: signed-out popup forwards the current session state into onboarding
  scope:
    - path: src/popup/App.svelte
      reason: Pass the existing popup isUserAuthenticated state through the onboarding call site without changing App's public module contract.
    - path: src/popup/__tests__/__mocks__/OnboardingView.svelte
      reason: Expose the forwarded authentication prop in the existing App test fixture without contracting a test-only public surface.
  read:
    - src/popup/App.svelte
    - src/popup/__tests__/__mocks__/OnboardingView.svelte
    - src/lib/stores/premiumStore.ts
    - src/lib/utils/githubConnection.ts
    - manifests/gate-github-actions-on-live-connection.manifest.yaml
    - manifests/cache-recent-popup-github-verification.manifest.yaml
validate:
  - pnpm exec vitest run src/lib/components/__tests__/OnboardingSetup.component.test.ts src/popup/components/__tests__/OnboardingView.component.test.ts src/popup/__tests__/App.component.test.ts
  - pnpm lint
  - pnpm check
  - pnpm build
