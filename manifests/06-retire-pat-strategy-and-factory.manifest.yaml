outcome:
  status: completed
  summary: |
    The PAT authentication strategy, multi-strategy factory, orphaned PAT token
    service/interface, and their dedicated tests are deleted. The unified
    GitHub facade now accepts only GitHub App configuration, while the final
    settings-store PAT validation and save paths fail visibly with GitHub App
    connection guidance instead of constructing a token-backed service.

    GitHub App token acquisition remains coalesced across concurrent facades
    for one Bolt2GitHub identity. Strategy sharing is identity-scoped: an
    in-flight request retains its original account, a stale facade cannot use a
    newer account's credentials, and a signed-out facade cannot inherit a
    previously cached GitHub or Supabase token.
  rationale: |
    A single supported authentication mechanism does not need a strategy
    selector or PAT-format validation layer. Direct GitHub App ownership makes
    the supported contract explicit, but preserving the former factory's
    cross-facade cache boundary required identity-scoped sharing rather than a
    fresh strategy per facade or one globally mutable strategy.
  lessons:
    - lesson_type: identity-scoped-shared-auth-state
      summary: |
        Shared token acquisition must be keyed to the caller identity and old
        facades must retain an isolated strategy reference. A process-global
        mutable strategy can coalesce requests but will leak the newest
        account's credentials into older callers.
      tags: [auth, github-app, concurrency, security]
      paths:
        - src/services/UnifiedGitHubService.ts
        - src/services/__tests__/UnifiedGitHubService.auth-selection.test.ts
    - lesson_type: logout-invalidates-memory-caches
      summary: |
        Clearing browser storage is insufficient when a long-lived extension
        process can retain an authenticated strategy. A newly signed-out
        facade must clear the shared slot and receive a fresh unauthenticated
        strategy so cached credentials cannot survive logout.
      tags: [auth, cache, logout, mv3]
      paths:
        - src/services/UnifiedGitHubService.ts
    - lesson_type: retirement-requires-callable-surface-removal
      summary: |
        Retiring PAT support requires deleting its strategy, selector, token
        validators, fixtures, and compatibility methods, while making the last
        transitional settings boundary reject PAT state visibly until its
        stored fields are removed by the next child.
      tags: [auth, pat-retirement, cleanup]
      paths:
        - src/services/UnifiedGitHubService.ts
        - src/lib/stores/githubSettings.ts
  review_notes:
    - source: independent reviewer /root/child06_strategy_retirement_review
      severity: findings-fixed
      summary: |
        Review found that a fresh strategy per facade lost the factory's
        cross-facade request coalescing, and identified premature child-07 type
        and storage cleanup plus stale promotion metadata. Same-identity facade
        coverage was added, transitional fields were restored, and active
        metadata was reconciled.
    - source: independent reviewer /root/child06_strategy_retirement_review_round2
      severity: finding-fixed
      summary: |
        Review found that one mutable class-static strategy let an old account-A
        facade use account B and let a signed-out facade reuse the previous
        cached token. Both sequences were captured as failing regressions and
        fixed with identity-scoped strategy sharing and logout invalidation.
    - source: independent reviewer /root/child06_strategy_retirement_review_round3
      severity: ready
      summary: |
        Final read-only review reported no findings and verified same-account
        coalescing, in-flight A/B isolation, stale-facade rejection, signed-out
        cache rejection, PAT artifact removal, child-07 scope preservation,
        plan-lock integrity, and strict MAID coherence.
  validation:
    - command:
        - pnpm
        - vitest
        - run
        - src/services/__tests__/UnifiedGitHubService.auth-selection.test.ts
      status: failed-red-phase
      summary: Initial App-only construction and settings tests failed seven assertions because token-string construction and PAT validation/save behavior still existed.
    - command:
        - pnpm
        - vitest
        - run
        - src/services/__tests__/UnifiedGitHubService.auth-selection.test.ts
      status: failed-red-phase
      summary: The first review regression showed 100 concurrent same-account facades made 100 Edge Function token requests instead of one.
    - command:
        - pnpm
        - vitest
        - run
        - src/services/__tests__/UnifiedGitHubService.auth-selection.test.ts
      status: failed-red-phase
      summary: The second review regressions both failed because an old facade silently used the newer account and a signed-out facade reused the prior cached token.
    - command:
