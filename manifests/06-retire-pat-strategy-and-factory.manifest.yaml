schema: '2'
goal: |
  Delete the PAT authentication strategy and collapse UnifiedGitHubService to
  the GitHub App authentication contract after all runtime callers are migrated.
description: |
  Sixth implementation child of github-app-only-authentication.

  Once background, content, repository, issue, and feedback callers use the
  GitHub App configuration, the legacy strategy is removed rather than left as
  unreachable fallback code. AuthenticationStrategyFactory is also removed:
  with one supported strategy, a dual-strategy selector adds no value and can
  reintroduce fallback behavior. UnifiedGitHubService directly owns the GitHub
  App strategy lifecycle and no longer accepts a token string or PAT config.

  GitHub App request coalescing, identity isolation, token renewal, and visible
  errors remain unchanged. This child must evolve the existing request-stampede
  contract instead of silently invalidating it.

  TokenService and ITokenService are also deleted in this slice. Repository
  inspection shows they are PAT-format and PAT-permission validation code used
  only by their own unit test, with no production importer. Keeping them would
  preserve an orphaned PAT implementation after the advertised retirement.

  UnifiedGitHubService also loses its unused backward-compatibility methods for
  simple token validation, classic/fine-grained PAT detection, and destructive
  PAT permission probing. The settings store still contains the final live
  string-token constructor caller, so this child first makes that narrow
  validation/save boundary reject PAT state and use only GitHub App auth. Child
  07 still owns deleting the remaining token-shaped settings fields and legacy
  storage vocabulary. Retaining either runtime caller or service methods here
  would leave a callable PAT-era surface despite deleting the strategy.
temptations:
- risk: Do not leave PATAuthenticationStrategy or createPATStrategy as dead compatibility code.
  instead: Delete the files/symbols and use removed_artifacts plus TypeScript checks to prove no production reference remains.
- risk: Do not replace PAT fallback with a hidden unauthenticated placeholder strategy.
  instead: Fail visibly when GitHub App auth is unavailable and keep the live connection gate responsible for user guidance.
- risk: Do not weaken GitHub App single-flight or account-isolation behavior while simplifying construction.
  instead: Retain the request-policy tests and add GitHub App-only constructor/authentication assertions before removal.
- risk: Do not keep the unused classic/fine-grained TokenService as a supposedly generic helper.
  instead: Delete TokenService, ITokenService, and their isolated unit test after confirming no production import remains.
- risk: Do not make the remaining settings PAT branch call the GitHub App service as if that were a successful migration.
  instead: Reject legacy PAT settings with actionable GitHub App-required state and reserve structural field/storage deletion for child 07.
type: refactor
supersedes:
- prevent-github-token-request-stampede
