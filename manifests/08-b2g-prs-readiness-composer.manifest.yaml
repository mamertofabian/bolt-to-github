temptations:
  - risk: Do not let detector order or array insertion order decide the final
      state or top concern ordering.
    instead: Apply explicit severity, category, and evidence ranking rules in the
      composer and cover ties in fixture tests.
  - risk: Do not show safe-looking areas when the detector that would support the
      claim did not run.
    instead: Convert missing detector, GitHub, history, or large-file data into
      limitations and lower confidence.
  - risk: Do not expose internal score as the primary user-facing result.
    instead: Return the score for diagnostics but make state, confidence,
      headline, recommended action, and evidence the visible contract.
  - risk: Do not make Red export-blocking behavior part of this composer draft.
    instead: Compute state only; any blocking or warning behavior belongs to the
      later UI/settings integration.
outcome:
  status: completed
  completed_at: '2026-07-31T07:17:08Z'
  summary: |
    PRS now composes detector signals into deterministic Green, Yellow, or Red
    readiness states with explicit confidence, internal scoring, ordered top
    concerns, category summaries, safe-looking areas, and visible limitations.

    Safe-looking claims require complete supporting evidence. Missing
    detectors and partial GitHub, history, ZIP-scan, large-file, rate-limit, or
    detector data lower confidence or suppress reassurance rather than
    implying that an uninspected area is safe.
  rationale: |
    Keeping readiness composition separate from detection makes the scoring
    and evidence policy deterministic, independently testable, and reusable by
    later report and UI slices. Conservative partial-data gating prevents
    reassuring output from overstating what the available analysis established.
  lessons:
    - lesson_type: gate-reassurance-on-complete-evidence
      summary: |
        Detector availability alone is insufficient evidence for a safe-looking
        claim. The composer must also account for source-level partial-data
        notices, including detectors that ran but could not inspect all input.
      tags: [partial-data, safety, confidence]
      paths:
        - src/production-readiness/composer/readinessComposer.ts
        - src/production-readiness/composer/__tests__/readinessComposer.test.ts
    - lesson_type: make-all-tie-breakers-explicit
      summary: |
        Stable signal and evidence output requires explicit severity, category,
        typed value, redaction, and code-point tie-breakers rather than relying
        on input order or locale behavior.
      tags: [determinism, ordering, evidence]
      paths:
        - src/production-readiness/composer/readinessComposer.ts
  review_notes:
    - source: independent reviewer /root/slice08_implementation_reviewer
      severity: needs-changes
      summary: |
        Revision 3 exposed detector-confidence gaps, unsupported ZIP-only safe
        claims, incomplete evidence sorting, and concern-priority drift.
    - source: independent reviewer /root/slice08_revision4_reviewer
      severity: needs-changes
      summary: |
        Revision 4 fixed the initial findings but exposed safe-looking claims
        that ignored source-level partial-data notices.
    - source: independent reviewer /root/slice08_revision5_reviewer
      severity: ready
      summary: |
        Revision 5 had no findings. The reviewer confirmed source-aware
        reassurance suppression, deterministic ordering, detector-aware
        confidence and limitations, scope compliance, and privacy safety.
  validation:
