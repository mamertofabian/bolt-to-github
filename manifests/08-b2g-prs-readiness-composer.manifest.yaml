# manifest-kind: active-contract
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: |
  Combine PRS detector outputs into a deterministic readiness state,
  confidence label, top concerns, safe-looking areas, and visible limitations.
description: |
  Child draft for the b2g-production-readiness-snapshot parent epic, derived
  from docs/b2g_production_readiness_snapshot_reference.md sections 10, 11, 12,
  and 19.3 Child 8.

  Promoted implementation-sized child contract after the domain,
  comparison, sensitive-path, dependency, and env/secret slices. The MVP
  composer supports explicit partial detector availability so it can land
  before public-surface, test/CI, maintainability, history, and commit-marker
  enrichment.

  Rationale:
  - Keep composition separate from detectors so scoring, confidence, concern
    ordering, and safe-looking-area suppression can be tested without zip,
    GitHub, or UI dependencies.
  - Use deterministic point rules from the reference document as the initial
    policy: critical signals force Red, two high signals force Red, total score
    4-11 or one high signal yields Yellow, and low-scoring snapshots with no
    high or critical signal yield Green.
  - Safe-looking areas require supporting evidence. If the relevant detector,
    comparison data, or history data is unavailable, the composer must produce
    a limitation instead of implying that area is safe.
type: feature
files:
  create:
    - path: src/production-readiness/composer/readinessComposer.ts
      artifacts:
        - kind: function
          name: composeReadinessSnapshot
          args:
            - name: input
              type: ComposeReadinessSnapshotInput
          returns: ReadinessSnapshot
          description: |
            Builds the final ReadinessSnapshot from repository context,
            comparison metrics, detector signals, trend summaries, output refs,
            and partial-data notices. Computes state, confidence, internal
            score, headline, recommended action, ordered top concerns,
            safe-looking areas, categories, and limitations without mutating
            inputs.
        - kind: function
          name: scoreReadinessSignals
          args:
            - name: signals
              type: ReadinessSignal[]
          returns: ReadinessScoreSummary
          description: |
            Converts signal severities into deterministic point totals and
            severity counts using the parent reference scoring table.
        - kind: function
          name: selectTopConcerns
          args:
            - name: signals
              type: ReadinessSignal[]
            - name: options
              type: '{ limit?: number }'
          returns: string[]
          description: |
            Orders concerns by criticality, production-sensitive category,
            unusual-change context, env/config risk, deleted tests/config, and
            maintainability trends. Defaults to three to five user-facing
            concerns.
        - kind: function
          name: selectSafeLookingAreas
          args:
            - name: input
              type: ComposeReadinessSnapshotInput
          returns: string[]
          description: |
            Returns safe-looking areas only when the relevant detector data is
            available and contains affirmative absence evidence.
        - kind: type
          name: ReadinessDetectorId
          type: "'sensitive_paths' | 'dependencies' | 'env_secrets' | 'public_surface'
            | 'tests_ci' | 'maintainability' | 'history'"
          description: Explicit detector availability keys used to gate safe-looking
            claims and confidence.
        - kind: interface
          name: ComposeReadinessSnapshotInput
          description: Repository context, comparison metrics, detector availability
            and outputs, and partial-data notices required to compose a snapshot.
        - kind: attribute
          of: ComposeReadinessSnapshotInput
          name: generatedAt
          type: string
        - kind: attribute
          of: ComposeReadinessSnapshotInput
          name: repository
          type: RepositoryRef
        - kind: attribute
          of: ComposeReadinessSnapshotInput
          name: base
          type: GitRefSummary
        - kind: attribute
          of: ComposeReadinessSnapshotInput
          name: candidate
          type: CandidateExportSummary
        - kind: attribute
          of: ComposeReadinessSnapshotInput
          name: comparison
          type: ComparisonSummary
        - kind: attribute
          of: ComposeReadinessSnapshotInput
          name: githubComparisonAvailable
          type: boolean
        - kind: attribute
          of: ComposeReadinessSnapshotInput
          name: availableDetectors
          type: ReadinessDetectorId[]
        - kind: attribute
          of: ComposeReadinessSnapshotInput
          name: signals
          type: ReadinessSignal[]
        - kind: attribute
          of: ComposeReadinessSnapshotInput
          name: trends
          type: TrendSummary[] | undefined
        - kind: attribute
          of: ComposeReadinessSnapshotInput
          name: outputs
          type: Partial<SnapshotOutputRefs> | undefined
        - kind: attribute
          of: ComposeReadinessSnapshotInput
          name: unavailableData
          type: PartialDataNotice[] | undefined
        - kind: interface
          name: ReadinessScoreSummary
          description: Deterministic point total and severity counts used to derive
            readiness state.
        - kind: attribute
          of: ReadinessScoreSummary
          name: internalScore
          type: number
        - kind: attribute
          of: ReadinessScoreSummary
          name: highestSeverity
          type: SignalSeverity
        - kind: attribute
          of: ReadinessScoreSummary
          name: highSignalCount
          type: number
        - kind: attribute
          of: ReadinessScoreSummary
          name: criticalSignalCount
          type: number
    - path: src/production-readiness/composer/__tests__/readinessComposer.test.ts
      artifacts:
        - kind: test_function
          name: composeReadinessSnapshot returns Green for low-score fixture with
            complete data
          description: |
            Planned behavioral test proving low-scoring signals with no high or
            critical evidence produce Green and retain safe-looking areas.
        - kind: test_function
          name: composeReadinessSnapshot returns Yellow for medium score or one high
            signal
          description: |
            Planned behavioral test covering both Yellow paths from the
            reference scoring rules.
        - kind: test_function
          name: composeReadinessSnapshot returns Red when a critical signal is
            present
          description: |
            Planned behavioral test proving critical evidence, such as a .env
            file in the export, forces Red regardless of total score.
        - kind: test_function
          name: selectTopConcerns orders critical and sensitive evidence first
          description: |
            Planned behavioral test using mixed detector signals to verify the
            first concerns match severity and production-sensitive priorities.
        - kind: test_function
          name: selectSafeLookingAreas suppresses claims when supporting data is
            unavailable
          description: |
            Planned behavioral test proving missing GitHub, detector, or
            history data becomes a limitation instead of a safe-looking area.
  read:
    - docs/b2g_production_readiness_snapshot_reference.md
    - manifests/drafts/b2g-production-readiness-snapshot.manifest.yaml
    - manifests/01-b2g-prs-domain-models-fixtures.manifest.yaml
    - manifests/04-b2g-prs-diff-engine.manifest.yaml
    - manifests/05-b2g-prs-sensitive-path-classifier.manifest.yaml
    - manifests/06-b2g-prs-dependency-detector.manifest.yaml
    - manifests/07-b2g-prs-env-secret-detector.manifest.yaml
    - src/production-readiness/domain.ts
