schema: '2'
goal: |
  Remove PAT token parameters from GitHub issue management and feedback
  workflows while preserving visible, actionable connection failures.
description: |
  Fifth implementation child of github-app-only-authentication.

  Issue and feedback flows currently accept githubToken props or store
  parameters, carry token-shaped GitHub App sentinels, and choose an auth
  strategy internally. They must instead obtain the explicit GitHub App service
  through the shared live gate at each GitHub action boundary. Issue-store
  public methods accept repository identity and issue data only; authentication
  remains an infrastructure concern rather than a UI capability parameter.

  This child removes token plumbing only from issue and feedback surfaces. It
  does not delete the PAT strategy, constructor, or shared storage fields owned
  by children 06 and 07.
temptations:
  - risk: 'Do not keep unused githubToken parameters or github_app_token sentinels for compatibility.'
    instead: 'Change the public store/component contracts, update every caller, and let TypeScript expose missed token plumbing.'
  - risk: 'Do not make issue or feedback failures disappear when the account is disconnected.'
    instead: 'Preserve the shared sign-in or GitHub App connection message in visible store and form error states.'
  - risk: 'Do not bypass the live gate because an issue modal was opened from an already-rendered popup.'
    instead: 'Verify readiness at the public issue or feedback action boundary immediately before GitHub API work.'
  - risk: 'Do not require a token-shaped sentinel to decide whether issue UI can mount.'
    instead: 'Use live popup readiness plus repository identity as the capability boundary.'
type: refactor
