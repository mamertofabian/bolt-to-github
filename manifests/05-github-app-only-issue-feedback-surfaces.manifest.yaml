outcome:
  status: completed
  summary: |
    GitHub issue loading, creation, updates, and feedback submission now obtain
    an explicit GitHub App service through the shared live connection gate.
    Issue-store APIs and the IssueManager, QuickIssueForm, ProjectStatus,
    HomeTabContent, FeedbackModal, and popup App surfaces no longer accept,
    manufacture, or forward PAT/token-shaped capabilities.

    Disconnected actions preserve actionable Bolt2GitHub sign-in and GitHub App
    guidance. Failed create/update operations keep a complete issue-store state
    for active subscribers, and IssueManager closes its creation form so the
    store error is visible instead of being hidden behind the form.
  rationale: |
    Authentication is an infrastructure concern at the GitHub action boundary,
    not a token prop that UI components should carry. Using one live-gated App
    service eliminates the remaining issue/feedback auth-method branches while
    retaining visible recovery behavior when an account or installation is no
    longer connected.
  lessons:
    - lesson_type: token-free-ui-capability-boundary
      summary: |
        GitHub-backed UI surfaces should receive repository identity and action
        data only; the service boundary should verify the live GitHub App
        connection immediately before API work.
      tags: [auth, github-app, architecture]
      paths:
        - src/lib/stores/issuesStore.ts
        - src/lib/components/IssueManager.svelte
        - src/popup/components/FeedbackModal.svelte
    - lesson_type: complete-error-state-shape
      summary: |
        A failed action on a previously unseen repository must initialize every
        field read by derived stores. An error-only partial object can turn an
        actionable auth failure into a secondary subscriber exception.
      tags: [state, errors, reliability]
      paths:
        - src/lib/stores/issuesStore.ts
        - src/lib/stores/__tests__/issuesStore.test.ts
    - lesson_type: error-visibility-follows-render-priority
      summary: |
        Setting an error is insufficient when an earlier template branch keeps
        rendering an action form. Failure handling must transition the UI to a
        state where the actionable recovery message is actually visible.
      tags: [ux, errors, svelte]
      paths:
        - src/lib/components/IssueManager.svelte
        - src/lib/components/__tests__/IssueManager.component.test.ts
  review_notes:
    - source: independent reviewer /root/child05_issue_feedback_review
      severity: findings-fixed
      summary: |
        Review found two disconnected-create blockers: create/update catches
        could leave an error-only repository state that broke derived readers,
        and IssueManager kept the creation form open above the store error. Both
        findings were fixed with focused behavioral regressions.
    - source: independent reviewer /root/child05_issue_feedback_review final
      severity: ready
      summary: |
        Final read-only review confirmed complete store state on failed issue
        actions, visible GitHub App guidance after create rejection, no remaining
        production PAT/token forwarding in scope, and 107 focused tests green.
  validation:
