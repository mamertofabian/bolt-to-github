        - src/lib/stores/__tests__/issuesStore.test.ts
        - src/lib/components/__tests__/IssueManager.component.test.ts
      status: failed-red-phase
      summary: Reviewer-driven regressions failed on the partial disconnected repository state and the creation form hiding the actionable connection error.
    - command:
