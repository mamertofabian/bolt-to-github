temptations:
  - risk: Do not fabricate a history baseline when GitHub history or prior PRS
      snapshots are missing.
    instead: Return insufficient-history limitations and allow the composer to
      lower confidence.
  - risk: Do not use simple averages that are distorted by one large export.
    instead: Prefer median and percentile rank with fixture-backed strict
      thresholds.
  - risk: Do not require perfect B2G commit identification for MVP.
    instead: Prefer prior snapshots, then simple identifiable B2G commits, then
      recent commits with explicit source labels.
  - risk: Do not turn large-change metrics into user blame language.
    instead: Emit neutral deterministic evidence such as larger-than-usual,
      largest recent export, repeated churn, or accelerating dependency growth.
  - risk: Do not retain raw source, secret values, author email addresses, or
      unbounded commit data.
    instead: Persist and return bounded redaction-safe metrics, paths, commit
      SHAs, timestamps, and first-line subjects only.
outcome:
  status: completed
  completed_at: '2026-07-31T11:23:21Z'
  summary: |
    PRS now builds deterministic history baselines from prior local snapshots,
    identifiable Bolt-to-GitHub commits, or recent GitHub commits in that
    priority order. It uses median and percentile comparisons, reports repeated
    hotspots and sensitive churn, and emits dependency-growth evidence only
    when every compared count is authoritative.

    Missing or insufficient history remains an explicit limitation. Static
    fallback signals use caller-provided source-file and source-line counts,
    while GitHub and local persistence adapters retain only bounded,
    metadata-only summaries and expose partial or unavailable history.
  rationale: |
    Robust statistics and strict source priority keep one large export or a
    malformed lower-priority source from distorting the baseline. Injected I/O,
    bounded pagination and retention, duplicate rejection, and projected
    records keep collection testable and prevent raw source, secret values, or
    unbounded third-party data from entering stored history.
  lessons:
    - lesson_type: validate-only-the-selected-history-source
      summary: |
        Source priority must be lazy: a valid higher-priority baseline should
        not fail because unused lower-priority history is malformed. B2G
        candidates must likewise be filtered before regular commits are
        validated.
      tags: [history, source-priority, validation]
      paths:
        - src/production-readiness/history/historyBaselineEngine.ts
    - lesson_type: distinct-samples-before-baseline-sufficiency
      summary: |
        Duplicate snapshot IDs or commit SHAs cannot count as independent
        history. Reject or skip duplicate identities before applying the
        minimum-sample threshold.
      tags: [history, deduplication, determinism]
      paths:
        - src/production-readiness/history/historyBaselineEngine.ts
        - src/production-readiness/github/githubHistoryAdapter.ts
        - src/production-readiness/snapshots/priorSnapshotStore.ts
    - lesson_type: bound-and-project-history-at-io-boundaries
      summary: |
        History adapters should reject oversized collections before parsing and
        project accepted records into fresh metadata-only objects. Bound path,
        identifier, timestamp, subject, pagination, and retention dimensions at
        the boundary rather than relying on downstream consumers.
      tags: [privacy, storage, github, bounded-data]
      paths:
        - src/production-readiness/github/githubHistoryAdapter.ts
        - src/production-readiness/snapshots/priorSnapshotStore.ts
  review_notes:
    - source: independent reviewers revisions 5, 7, and 8
      severity: findings-fixed
      summary: |
        Read-only reviews identified fabricated dependency counts, incomplete
        GitHub pagination and partial-rate-limit behavior, invalid dotted-repo
        keys, misleading line-only evidence, unprojected persisted objects,
        eager lower-priority validation, repeated opaque 403 requests,
        duplicate identities, unbounded metadata, and post-parse retention
        bounds. Each valid finding received focused behavioral coverage and a
        locked plan revision before implementation.
    - source: independent reviewer /root/slice13_revision9_reviewer
      severity: ready
      summary: |
        The final review found no P0, P1, or P2 issues and confirmed revision-9
        lock integrity, declared scope and artifacts, lazy source priority,
        duplicate protection, bounded metadata and storage, partial-data
        handling, privacy projection, and all earlier review fixes.
