# draft-kind: child-planning-inventory
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: |
  Analyze prior PRS snapshots or recent GitHub commits to detect unusual change
  size, hotspots, dependency drift, and repeated sensitive-area churn without
  fabricating trends when history is unavailable.
description: |
  Child draft for the b2g-production-readiness-snapshot parent epic, derived
  from docs/b2g_production_readiness_snapshot_reference.md sections 8.1, 8.8,
  9, 11, 12, 17, 18, and 19.3 Child 10.

  The domain and comparison contracts now exist. This slice owns a pure robust
  baseline engine plus injected, read-only GitHub history and local snapshot
  storage ports. History source priority is prior snapshots, identifiable B2G
  commits, then recent GitHub commits. Fewer than five usable samples produces
  explicit limitations and only documented static fallback signals, never an
  unusual-history claim.

  GitHub responses and persisted snapshot summaries contain metadata only. Raw
  source, file contents, secret values, author email addresses, and commit-body
  marker parsing are outside this slice. Rich commit-marker parsing remains
  owned by slice 14.
type: feature
