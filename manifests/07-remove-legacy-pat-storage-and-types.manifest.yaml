outcome:
  status: completed
  summary: |
    Steady-state settings, storage, background recovery, popup state, helper,
    authentication type, and usage contracts are now GitHub App-only. Legacy
    PAT credentials and authentication selectors remain readable only inside
    the dedicated one-way migration module, while historical PAT analytics are
    tolerated and normalized to none rather than GitHub App.
  rationale: |
    Removing the dual-auth model from shared state eliminates confusing and
    unsafe fallback paths after runtime PAT support was retired. Repository
    owner and project mappings remain preserved, GitHub App installation data
    stays authoritative, migration-required state remains explicit, and stale
    usernames cannot overwrite repository settings without an installation.
  lessons:
    - lesson_type: auth-state-authority
      summary: |
        Treat installation metadata as the authority for GitHub App identity;
        username or avatar fragments without an installation are stale cache,
        not permission to rewrite repository ownership.
      tags:
        - auth
        - github-app
        - storage
      paths:
        - src/lib/stores/githubSettings.ts
        - src/lib/stores/__tests__/githubSettings.test.ts
    - lesson_type: legacy-data-boundary
      summary: |
        Historical credential vocabulary should be isolated at the migration
        and analytics parsing boundaries. Steady-state types and fixtures must
        reject retired fields so they cannot quietly return through casts.
      tags:
        - migration
        - types
        - analytics
      paths:
        - src/lib/services/githubAuthMigration.ts
        - src/services/types/authentication.ts
        - src/background/UsageTracker.ts
    - lesson_type: auth-recovery-contract
      summary: |
        Superseding a storage-recovery contract requires direct coverage of
        every authoritative wake-up key and an inverse test for each retired
        signal, not only broad debounce coverage.
      tags:
        - mv3
        - auth
        - storage
      paths:
        - src/background/BackgroundService.ts
        - src/background/__tests__/BackgroundService.storage-recovery.test.ts
  review_notes:
