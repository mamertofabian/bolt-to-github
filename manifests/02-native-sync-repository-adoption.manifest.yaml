      status: passed
      summary: 29 new behavioral tests passed (7 ranking + 8 domain sub-state + 5 store + 9 coordinator) covering exclusion/owner/pre-handoff filtering, none/single/multiple states, selection/completion transitions with lock-after-complete, staged persist-before-mapping ordering, only-current-project mapping, provenance preservation, journey mutual exclusion, live-access gating, idempotency, and partial-state repair.
