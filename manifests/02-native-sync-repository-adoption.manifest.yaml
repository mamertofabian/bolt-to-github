        - src/lib/native-sync/__tests__/nativeSyncAdoption.test.ts
        - src/lib/native-sync/__tests__/nativeSyncHandoffAdoptionState.test.ts
        - src/lib/services/__tests__/NativeSyncHandoffStoreAdoption.test.ts
