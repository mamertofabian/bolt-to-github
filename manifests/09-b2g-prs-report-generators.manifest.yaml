temptations:
  - risk: Do not render raw before or after evidence values into Markdown.
    instead: Sanitize the snapshot at the report boundary and assert known fixture
      secrets are absent from every output string.
  - risk: Do not make the ADC Fix report generator open tabs, call APIs, or upload
      content.
    instead: Return Markdown only; UI actions for copying, downloading, or
      navigating belong to later integration code.
  - risk: Do not use coercive or audit-like claims in receipt or handoff text.
    instead: 'Use the reference language: static snapshot, production-sensitive areas,
      suggested review, and explicit limitations.'
  - risk: Do not hide limitations from short receipts.
    instead: Include limitations in every generated report, even when the snapshot
      state is Green.
outcome:
  status: completed
  completed_at: '2026-07-31T07:38:55Z'
  summary: |
    PRS now generates deterministic Markdown receipts and optional ADC Fix
    handoff reports from a ReadinessSnapshot. Golden fixtures cover Green and
    Yellow receipts plus a Red handoff, while every report retains visible
    static-analysis and partial-data limitations.

    The report boundary deep-redacts string evidence values without mutating
    its input. Optional path privacy removes evidence paths even when repeated
    in labels or historical text, and Markdown escaping handles adversarial
    filenames without corrupting report structure.
  rationale: |
    Keeping rendering pure and side-effect free makes the output suitable for
    explicit copy or download actions in later UI slices without uploading
    source, ZIPs, or report content. Golden Markdown provides a stable product
    contract while boundary redaction and conservative language preserve
    privacy and avoid coercive audit claims.
  lessons:
    - lesson_type: redact-paths-across-rendered-context
      summary: |
        A path-privacy option must remove structured path fields and the same
        path when detectors repeat it in evidence labels, trend text, or other
        rendered context.
      tags: [privacy, redaction, reports]
      paths:
        - src/production-readiness/reports/reportGenerators.ts
        - src/production-readiness/reports/__tests__/reportGenerators.test.ts
    - lesson_type: render-arbitrary-paths-with-commonmark-rules
      summary: |
        Inline-code fences must be longer than any content backtick run and
        padded when content starts or ends with a backtick so valid filenames
        cannot break the surrounding Markdown structure.
      tags: [markdown, determinism, escaping]
      paths:
        - src/production-readiness/reports/reportGenerators.ts
        - src/production-readiness/reports/__tests__/reportGenerators.test.ts
    - lesson_type: keep-handoff-generation-side-effect-free
      summary: |
        The ADC Fix crossover returns Markdown only. Copying, downloading,
        external navigation, and deliberate sharing remain responsibilities of
        later user-initiated integration code.
      tags: [privacy, adc-fix, architecture]
      paths:
        - src/production-readiness/reports/reportGenerators.ts
  review_notes:
    - source: independent reviewer /root/slice09_implementation_reviewer
      severity: needs-changes
      summary: |
        Revision 4 exposed path leakage through evidence and trend labels plus
        malformed CommonMark spans for filenames ending in backticks.
    - source: independent reviewer /root/slice09_revision5_reviewer
      severity: ready
      summary: |
        Revision 5 had no blocking or should-fix findings. The reviewer
        confirmed complete path redaction, valid adversarial code spans,
        non-mutating secret redaction, deterministic output, optional language,
        and the absence of network, browser, or upload side effects.
