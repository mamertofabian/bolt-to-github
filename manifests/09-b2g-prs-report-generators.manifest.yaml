# draft-kind: child-planning-inventory
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: |
  Generate deterministic Markdown export receipts and ADC Fix handoff reports
  from a ReadinessSnapshot without exposing secret-looking values.
description: |
  Child draft for the b2g-production-readiness-snapshot parent epic, derived
  from docs/b2g_production_readiness_snapshot_reference.md sections 14, 15, 18,
  and 19.3 Child 12.

  Promoted after the ReadinessSnapshot domain, redaction helpers, env/secret
  detector, and readiness composer established their concrete contracts.
  Golden Markdown fixtures are created in this slice and pin exact renderer
  output, limitation visibility, and redaction behavior.

  Rationale:
  - Keep report rendering in a pure output layer so receipt and handoff content
    can be golden-tested without browser, clipboard, GitHub, or ADC Fix network
    dependencies.
  - Receipts are concise export artifacts suitable for copying or optionally
    adding to commit bodies later.
  - ADC Fix handoff reports are explicit, user-initiated documents. B2G must
    never auto-upload source code, zips, secrets, or report content to ADC Fix.
type: feature
files:
  create:
    - path: src/production-readiness/reports/reportGenerators.ts
      artifacts:
        - kind: function
          name: generateExportReceiptMarkdown
          args:
            - name: snapshot
              type: ReadinessSnapshot
          returns: string
          description: |
            Renders a concise Bolt Export Receipt Markdown document containing
            readiness state, generated time, repository context, comparison
            metrics, top concerns, safe-looking areas, and limitations.
        - kind: function
          name: generateAdcFixHandoffMarkdown
          args:
            - name: snapshot
              type: ReadinessSnapshot
            - name: options
              type: AdcFixHandoffOptions
          returns: string
          description: |
            Renders a structured ADC Fix Handoff Report Markdown document with
            repository context, readiness summary, changed areas, historical
            context, suggested review areas, and limitations. Output must use
            helpful non-coercive language and must not imply ADC Fix is
            required to continue.
        - kind: function
          name: sanitizeMarkdownEvidence
          args:
            - name: snapshot
              type: ReadinessSnapshot
          returns: ReadinessSnapshot
          description: |
            Returns a rendered-output-safe snapshot copy where secret-looking
            evidence values remain redacted before Markdown generation.
        - kind: interface
          name: AdcFixHandoffOptions
          description: Optional handoff sections and privacy controls.
        - kind: attribute
          of: AdcFixHandoffOptions
          name: includeCompareUrl
          type: boolean | undefined
        - kind: attribute
          of: AdcFixHandoffOptions
          name: includeHistory
          type: boolean | undefined
        - kind: attribute
          of: AdcFixHandoffOptions
          name: includeAdcFixLink
          type: boolean | undefined
        - kind: attribute
          of: AdcFixHandoffOptions
          name: redactPathNames
          type: boolean | undefined
    - path: src/production-readiness/reports/__tests__/reportGenerators.test.ts
      artifacts:
        - kind: test_function
          name: generateExportReceiptMarkdown matches the Yellow golden receipt
          description: |
            Planned behavioral test comparing a composed fixture snapshot to
            test/golden/prs/auth-env-change.receipt.md.
        - kind: test_function
          name: generateAdcFixHandoffMarkdown matches the Red golden handoff
          description: |
            Planned behavioral test comparing a composed fixture snapshot to
            test/golden/prs/secret-file.handoff.md.
        - kind: test_function
          name: reports include limitations for partial snapshots
          description: |
            Planned behavioral test proving low-confidence and partial-data
            limitations render in both receipt and handoff output.
        - kind: test_function
          name: reports never expose secret-looking values
          description: |
            Planned behavioral test using env and secret fixtures to assert raw
            secret strings are absent from every generated Markdown report.
        - kind: test_function
          name: handoff language is helpful and non coercive
          description: |
            Planned behavioral test asserting forbidden phrases such as ADC Fix
            is required or your app is broken do not appear.
    - path: test/golden/prs/ui-only.receipt.md
      artifacts:
        - kind: namespace
          name: UiOnlyReceiptGoldenMarkdown
          description: Planned golden receipt for a Green UI-only export.
    - path: test/golden/prs/auth-env-change.receipt.md
      artifacts:
        - kind: namespace
          name: AuthEnvChangeReceiptGoldenMarkdown
          description: Planned golden receipt for a Yellow auth plus env export.
    - path: test/golden/prs/secret-file.handoff.md
      artifacts:
        - kind: namespace
          name: SecretFileHandoffGoldenMarkdown
          description: Planned golden handoff report proving redaction in a Red
            export.
  read:
    - docs/b2g_production_readiness_snapshot_reference.md
    - manifests/drafts/b2g-production-readiness-snapshot.manifest.yaml
    - manifests/01-b2g-prs-domain-models-fixtures.manifest.yaml
    - manifests/07-b2g-prs-env-secret-detector.manifest.yaml
    - manifests/08-b2g-prs-readiness-composer.manifest.yaml
    - src/production-readiness/domain.ts
    - src/production-readiness/redaction.ts
    - src/production-readiness/test-fixtures/prsFixtures.ts
validate:
  - pnpm exec vitest run
    src/production-readiness/reports/__tests__/reportGenerators.test.ts
  - ./scripts/maid validate manifests/09-b2g-prs-report-generators.manifest.yaml
    --mode behavioral
  - pnpm lint
  - pnpm check
