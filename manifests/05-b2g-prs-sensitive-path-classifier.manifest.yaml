outcome:
  status: completed
  summary: |
    PRS can now classify normalized diff entries across all eight path-based
    readiness categories using centralized, deterministic glob and regex rules.
    Each result preserves file status, exact matched path, current and previous
    rename paths, severity, matched rule, and redaction-neutral file evidence.
    Sensitive paths renamed to neutral locations remain visible, while
    lockfiles, framework config, environment examples, and workflow metadata
    that reach the diff remain classifiable.
  rationale: |
    Keeping path policy as ordered data makes the classifier testable and
    extensible without scattering detector conditionals. Selecting the highest
    severity match per path/category prevents broad rules from downgrading more
    specific evidence, and a lexicographic rule-ID tie-break makes the result
    independent of caller or catalog ordering. Content analysis, readiness
    scoring, UI, and report concerns remain isolated to later children.
  lessons:
    - lesson_type: rename-evidence-continuity
      summary: |
        Classifying only a renamed file's destination can erase evidence when a
        sensitive auth, data, or deployment path moves to a neutral name. Both
        current and previous paths must be evaluated while evidence identifies
        the exact side that matched.
      tags:
        - rename
        - evidence
        - correctness
      paths:
        - src/production-readiness/detectors/sensitivePathClassifier.ts
        - src/production-readiness/__tests__/sensitive-path-classifier.test.ts
    - lesson_type: severity-before-catalog-order
      summary: |
        First-match de-duplication silently turns rule array order into policy.
        Overlapping routes/api and login/admin patterns must select the highest
        severity, with a stable rule-ID tie-break for equally severe matches.
      tags:
        - severity
        - deterministic
        - rules
      paths:
        - src/production-readiness/detectors/sensitivePathClassifier.ts
        - src/production-readiness/rules/path-rules.ts
    - lesson_type: metadata-stays-classifiable
      summary: |
        Source-analysis eligibility and path sensitivity are separate concerns.
        Lockfiles, workflow files, environment examples, and relevant config
        can provide useful file-level evidence without requiring content scans.
      tags:
        - metadata
        - ignore-rules
        - privacy
      paths:
        - src/production-readiness/rules/path-rules.ts
        - src/production-readiness/rules/ignore-rules.ts
    - lesson_type: detector-boundary
      summary: |
        The path classifier should expose neutral category evidence only. Env
        and secret scanning, dependency analysis, public-surface semantics,
        state composition, UI, and report generation remain separate slices.
      tags:
        - architecture
        - scope
        - detector
      paths:
        - src/production-readiness/detectors/sensitivePathClassifier.ts
        - manifests/05-b2g-prs-sensitive-path-classifier.manifest.yaml
  review_notes:
