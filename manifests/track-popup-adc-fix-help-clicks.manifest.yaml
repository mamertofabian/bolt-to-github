    HELP_LINK default plus the Help tab service link carry UTM attribution
    (utm_source=extension, utm_medium=popup, campaigns expert_help and
    help_tab). Explicit HELP_LINK overrides still open verbatim and all
    pre-existing SocialLinks behaviors are unchanged.
  rationale: |
    The popup already promoted ADC Fix prominently but clicks were untracked
    and visits landed as direct/none on the ADC Fix GA property. Instrumenting
    the existing surface instead of adding a duplicate link keeps the popup
    uncluttered while making the extension-to-service funnel measurable end to
    end (extension event + UTM source attribution).
