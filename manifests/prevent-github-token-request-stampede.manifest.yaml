schema: '2'
goal: 'Prevent concurrent GitHub App token checks from stampeding get-github-token'
type: fix
created: '2026-07-12T04:30:00Z'
description: |
  Production deployment 21 recorded at least 99 authenticated GET requests to
  get-github-token for one user within roughly 600ms. Every request returned
  NO_GITHUB_APP, and Supabase booted many Edge Runtime isolates before retiring
  them normally. The response did not create a sequential retry loop; callers
  entered the function concurrently.

  Collapse concurrent GitHub App token acquisition into one shared in-flight
  operation at GitHubAppService, the lowest boundary used by direct token
  retrieval, validation, and strategy refresh paths. Choose GitHub App
  authentication only from durable GitHub App configuration, never from the
  mere presence of a Supabase session token. Apply that policy to storage
  auto-detection. Explicit AuthenticationConfig selections remain
  authoritative, so an App-only caller can never fall back to PAT. A stored
  github_app method is accepted only with a finite positive installation ID.

  This hotfix intentionally does not add persistent negative caching for 404.
  Negative caching needs a complete invalidation contract across OAuth,
  reconnect, account switching, and MV3 restart; single-flight behavior and
  correct method selection remove the observed stampede without risking stale
  "not connected" state after a successful connection.

  Coalescing is scoped to the current Supabase bearer identity. Switching
  accounts starts a separate flight and invalidates strategy token caches;
  completion of an older account's request must never overwrite the newer
  account's cached GitHub token.
temptations:
  - risk: 'Do not treat any Supabase access token as proof that GitHub App authentication is configured.'
    instead: 'Resolve GitHub authentication from the stored method plus a finite positive githubAppInstallationId, preserving explicit PAT selection.'
  - risk: 'Do not debounce callers after they have already started independent network requests.'
    instead: 'Share one in-flight promise so concurrent callers observe the same success or failure and the coordinator resets only after settlement.'
  - risk: 'Do not permanently cache NO_GITHUB_APP as a shortcut for this release.'
    instead: 'Leave 404 uncached until OAuth, reconnect, logout, account-switch, and service-worker invalidation behavior has its own contract.'
  - risk: 'Do not fix only the ProjectsList caller; other concurrent consumers must receive the same protection.'
    instead: 'Coalesce at GitHubAppService.getAccessToken, the shared Edge Function acquisition boundary used by strategy token, validation, and refresh paths.'
  - risk: 'Do not share an in-flight GitHub token request across Supabase account identities.'
    instead: 'Key/reset the service flight by bearer identity and invalidate strategy caches on identity change so older completions cannot overwrite newer state.'
files:
  create:
    - path: src/services/githubAppRequestPolicy.ts
      artifacts:
        - kind: function
          name: resolveStoredGitHubAuthenticationMethod
          args:
            - name: storedAuthenticationMethod
              type: unknown
            - name: githubAppInstallationId
              type: unknown
          returns: "'pat' | 'github_app'"
          description: |
            Returns github_app only when storage explicitly selects it and the
            installation ID is a finite positive safe integer; otherwise PAT.
        - kind: class
          name: SingleFlight
          description: Shares one in-flight asynchronous operation among concurrent callers and resets after settlement.
        - kind: method
          name: run
          of: SingleFlight
          args:
            - name: operation
              type: '() => Promise<T>'
          returns: 'Promise<T>'
          description: Returns the current in-flight operation or starts exactly one new operation.
    - path: src/services/__tests__/githubAppRequestPolicy.test.ts
      artifacts:
        - kind: test_function
          name: selects GitHub App only for explicit stable installation configuration
        - kind: test_function
          name: preserves explicit PAT selection even when an installation ID exists
        - kind: test_function
          name: rejects missing or invalid GitHub App configuration
        - kind: test_function
          name: shares one operation across one hundred concurrent callers
        - kind: test_function
          name: resets after a shared rejection so a later request can retry
    - path: src/services/__tests__/GitHubAppAuthenticationStrategy.stampede.test.ts
      artifacts:
        - kind: test_function
          name: invalidates a cached GitHub token when the Supabase identity changes
        - kind: test_function
          name: prevents an older in-flight identity from overwriting the newer token cache
    - path: src/services/__tests__/GitHubAppService.stampede.test.ts
      artifacts:
        - kind: test_function
          name: turns one hundred direct service token requests into one Edge Function request
        - kind: test_function
          name: coalesces token retrieval shared by direct and validation callers
        - kind: test_function
          name: keeps in-flight token requests isolated across Supabase identity changes
    - path: src/services/__tests__/UnifiedGitHubService.auth-selection.test.ts
      artifacts:
        - kind: test_function
          name: keeps PAT selected when a Supabase session exists without a GitHub App installation
        - kind: test_function
          name: keeps explicit PAT selected when a GitHub App installation also exists
        - kind: test_function
          name: selects GitHub App only when method and installation configuration agree
        - kind: test_function
          name: explicit GitHub App configuration never falls back to PAT
  read:
    - src/services/GitHubAppAuthenticationStrategy.ts
    - src/services/GitHubAppService.ts
    - src/services/UnifiedGitHubService.ts
    - src/services/types/authentication.ts
    - src/services/__tests__/GitHubAppAuthenticationStrategy.test.ts
    - src/services/__tests__/UnifiedGitHubService.comprehensive.test.ts
    - src/services/__tests__/test-fixtures/unified/mocks/MockChromeStorage.ts
    - src/content/services/githubAppIdentity.ts
validate:
  - pnpm exec vitest run src/services/__tests__/githubAppRequestPolicy.test.ts src/services/__tests__/GitHubAppAuthenticationStrategy.stampede.test.ts src/services/__tests__/GitHubAppService.stampede.test.ts src/services/__tests__/UnifiedGitHubService.auth-selection.test.ts src/services/__tests__/GitHubAppAuthenticationStrategy.test.ts src/services/__tests__/GitHubAppService.critical-business-logic.test.ts src/services/__tests__/UnifiedGitHubService.comprehensive.test.ts
  - pnpm lint
  - pnpm check
