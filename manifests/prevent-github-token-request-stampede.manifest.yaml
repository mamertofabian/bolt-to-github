  notes: |
    Red phase confirmed on 2026-07-12. Current GitHubAppAuthenticationStrategy
    issued 100 upstream requests for 100 concurrent callers and 20 requests for
    20 concurrent callers. The request-policy spec also failed because the
    planned public policy module does not yet exist. Adversarial MAID plan
    review approved the implementation-sized scope, exact public artifacts,
    failure recovery coverage, real service-boundary stampede test, and public
    authentication-selection behavior. Revision 2 is pending approval after
    the first implementation review found explicit-config and direct-service
    acquisition paths outside revision 1 coverage. Revision-2 red phase is
    confirmed: 100 direct service callers produced 100 Edge Function requests,
    mixed direct/validation callers produced 21, and explicit GitHub App
    initialization without an installation ID still selected github_app.
    Revision 3 aligns the shared successful-GitHub-App test fixture with the
    durable configuration contract by including a stable installation ID and
    locks the comprehensive compatibility suite that exposed the stale fixture.
    Revision 4 scopes coalescing and cache writes to the Supabase bearer
    identity after independent review identified a cross-account token-sharing
    risk in the cached strategy singleton.
    The GitHub App-only retirement plan later evolved explicit configuration:
    an explicit github_app request is authoritative even before storage carries
    an installation ID, while storage auto-detection still requires durable
    installation state.
outcome:
  status: completed
  summary: |
    GitHub App token acquisition now collapses concurrent callers at the
    GitHubAppService Edge Function boundary. One hundred concurrent direct
    callers produce one get-github-token request, and validation callers share
    that same flight. Authentication selection no longer treats a Supabase
    session as GitHub App configuration. Storage auto-detection requires the
    stored github_app method plus a finite positive safe-integer installation
    ID. Explicit GitHub App and explicit PAT configurations each remain
    authoritative.

    Coalescing and token caching are scoped to the Supabase bearer identity.
    Account changes start a separate service flight, invalidate the strategy
    cache, and use an auth-generation guard so an older account's completion or
    failure cannot overwrite the newer account's cached GitHub token.
  rationale: |
    Production deployment 21 showed at least 99 requests for one user starting
    within roughly 600ms. This was concurrent fan-out rather than a sequential
    404 retry loop. Moving single-flight protection to GitHubAppService covers
    direct retrieval, validation, and refresh consumers without persistent 404
    caching. Durable installation configuration prevents authenticated users
    without a GitHub App record from entering the token endpoint, while
    identity-scoped flights avoid cross-account token disclosure.
  lessons:
    - lesson_type: shared-acquisition-boundary
      summary: |
        Request coalescing belongs at the lowest shared network-acquisition
        boundary. Strategy-only protection can leave direct validation and
        refresh paths able to stampede the same Edge Function.
      tags:
        - concurrency
        - edge-functions
        - github-app
      paths:
        - src/services/GitHubAppService.ts
        - src/services/githubAppRequestPolicy.ts
    - lesson_type: identity-scoped-single-flight
      summary: |
        Authentication single-flight and token caches must be scoped to bearer
        identity. Account changes must start a new flight, invalidate cached
        tokens, and prevent older completions from overwriting newer state.
      tags:
        - auth
        - privacy
        - concurrency
      paths:
        - src/services/GitHubAppAuthenticationStrategy.ts
        - src/services/GitHubAppService.ts
    - lesson_type: durable-auth-selection
      summary: |
        A Supabase session proves application authentication, not GitHub App
        installation. GitHub App strategy selection requires an explicit method
        plus a stable server-provided installation identity.
      tags:
        - auth
        - storage
        - github-app
      paths:
        - src/services/UnifiedGitHubService.ts
