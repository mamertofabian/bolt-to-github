          type: number
        - kind: attribute
          name: renamedFiles
          of: ComparisonSummary
          type: number | undefined
        - kind: attribute
          name: addedLines
          of: ComparisonSummary
          type: number | undefined
        - kind: attribute
          name: deletedLines
          of: ComparisonSummary
          type: number | undefined
        - kind: attribute
          name: binaryFilesChanged
          of: ComparisonSummary
          type: number
        - kind: attribute
          name: sensitiveFilesChanged
          of: ComparisonSummary
          type: number
        - kind: attribute
