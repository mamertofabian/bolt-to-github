    - path: src/production-readiness/redaction.ts
      artifacts:
        - kind: function
          name: redactSensitiveValue
          args:
            - name: value
              type: string
          returns: string
          description: Irreversibly replaces a value already classified as sensitive with the canonical redaction marker.
        - kind: function
          name: redactEvidenceRef
          args:
            - name: evidence
              type: EvidenceRef
          returns: EvidenceRef
          description: Redacts defined before and after values, sets the redacted flag, and preserves evidence kind, label, and path context.
    - path: src/production-readiness/test-fixtures/prsFixtures.ts
      artifacts:
