    - path: src/production-readiness/redaction.ts
      artifacts:
        - kind: function
          name: redactSensitiveValue
          args:
            - name: value
              type: string
          returns: string
          description: Planned helper that masks secret-looking values while
            preserving useful evidence context.
        - kind: function
          name: redactEvidenceRef
          args:
            - name: evidence
              type: EvidenceRef
          returns: EvidenceRef
          description: Planned helper that redacts before and after evidence
            values without dropping path or label context.
    - path: src/production-readiness/test-fixtures/prsFixtures.ts
      artifacts:
        - kind: function
          name: loadPrsFixture
          args:
            - name: name
              type: string
          returns: PrsFixture
          description: Planned deterministic fixture loader for PRS unit tests.
        - kind: type
          name: PrsFixture
          type: '{ name: string; files: FixtureFile[]; goldenSnapshot?: ReadinessSnapshot
            }'
          description: Planned fixture shape shared by PRS child tests.
    - path: src/production-readiness/__tests__/domain-models-fixtures.test.ts
      artifacts:
        - kind: test_function
          name: domain objects satisfy the expected snapshot schema
          description: Required planned behavioral test before promotion.
        - kind: test_function
          name: golden snapshot fixture loading is deterministic
          description: Required planned behavioral test before promotion.
        - kind: test_function
          name: redaction helpers hide secret values while preserving evidence
            names and paths
          description: Required planned behavioral test before promotion.
