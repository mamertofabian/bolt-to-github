# manifest-kind: active-contract
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: |
  Add the Production Readiness Snapshot domain model foundation, fixture
  structure, golden output harness, and shared redaction helpers needed by
  later PRS child manifests.
description: |
  Promoted child contract for the b2g-production-readiness-snapshot parent
  epic. Its behavioral tests and deterministic golden fixture establish the
  shared foundation for later PRS child manifests.

  This slice establishes the stable TypeScript vocabulary for PRS without
  implementing zip parsing, GitHub adapters, diffing, detectors, UI, reports, or
  history analysis. The intent is to give later children shared domain types
  and deterministic fixture utilities so downstream contracts do not each invent
  their own snapshot shape.
temptations:
  - risk: 'Do not let downstream detector drafts define their own incompatible snapshot,
      signal, or evidence shapes.'
    instead: 'Centralize PRS domain contracts in the domain foundation and have later
      drafts import those types.'
  - risk: 'Do not store or assert raw secret-looking fixture values in golden snapshots.'
    instead: 'Run fixture outputs through the shared redaction helper and assert redacted
      markers plus evidence labels.'
  - risk: 'Do not make the fixture loader depend on wall-clock time, random IDs, network
      calls, or extension runtime globals.'
    instead: 'Use deterministic fixture files and injected timestamps or static golden
      data.'
type: feature
files:
  create:
    - path: src/production-readiness/domain.ts
      artifacts:
        - kind: type
          name: ReadinessState
          type: "'green' | 'yellow' | 'red'"
          description: Planned user-facing PRS state union.
        - kind: type
          name: SignalSeverity
          type: "'info' | 'low' | 'medium' | 'high' | 'critical'"
          description: Planned deterministic signal severity union.
        - kind: type
          name: SnapshotConfidence
          type: "'low' | 'medium' | 'high'"
          description: Planned confidence union for complete and partial data
            states.
        - kind: type
          name: ReadinessCategory
          type: "'identity_access' | 'data_persistence' | 'secrets_config' | 'deployment_ops'
            | 'external_integrations' | 'public_surface' | 'testing_recovery' | 'maintainability'
            | 'change_history'"
          description: Planned category union from the PRS reference document.
        - kind: interface
          name: RepositoryRef
          description: Planned repository owner/name identity for snapshot
            context.
        - kind: attribute
          name: owner
          of: RepositoryRef
          type: string
        - kind: attribute
          name: name
          of: RepositoryRef
          type: string
        - kind: interface
          name: GitRefSummary
