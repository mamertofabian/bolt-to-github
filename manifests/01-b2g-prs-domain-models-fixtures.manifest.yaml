schema: '2'
goal: |
  Add the Production Readiness Snapshot domain model foundation, fixture
  structure, golden output harness, and shared redaction helpers needed by
  later PRS child manifests.
description: |
  First implementation child for the b2g-production-readiness-snapshot parent
  epic. Behavioral tests and static golden fixture data define the contract
  before the domain and redaction implementation is added.

  This slice establishes the stable TypeScript vocabulary for PRS without
  implementing zip parsing, GitHub adapters, diffing, detectors, UI, reports, or
  history analysis. The intent is to give later children shared domain types
  and deterministic fixture utilities so downstream contracts do not each invent
  their own snapshot shape.
temptations:
  - risk: Do not let downstream detector drafts define their own incompatible snapshot, signal, or evidence shapes.
    instead: Centralize PRS domain contracts in the domain foundation and have later drafts import those types.
  - risk: Do not store or assert raw secret-looking fixture values in golden snapshots.
    instead: Run fixture outputs through the shared redaction helper and assert redacted markers plus evidence labels.
  - risk: Do not make the fixture loader depend on wall-clock time, random IDs, network calls, or extension runtime globals.
    instead: Use deterministic fixture files and injected timestamps or static golden data.
type: feature
