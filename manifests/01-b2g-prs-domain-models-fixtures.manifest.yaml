          of: FixtureFile
          type: boolean | undefined
        - kind: function
          name: loadPrsFixture
          args:
            - name: name
              type: string
          returns: PrsFixture
          description: Returns a defensive clone of static fixture data and throws for an unknown fixture name without using time, randomness, I/O, or extension globals.
