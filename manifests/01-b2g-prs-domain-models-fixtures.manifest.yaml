        - kind: attribute
          name: id
          of: TrendSummary
          type: string
        - kind: attribute
          name: label
          of: TrendSummary
          type: string
        - kind: attribute
          name: evidence
          of: TrendSummary
          type: EvidenceRef[]
        - kind: interface
