metadata:
  tags: [auth, github-app, pat-retirement, repositories, projects]
  priority: high
  status: completed
  promotion_ready: true
  parent_epic: github-app-only-authentication
  depends_on: [03-github-app-only-runtime-enforcement]
  evolves_active_contracts: [repair-e2e-error-flow-fast-gate]
  notes: Issue-token parameters that still pass through ProjectStatus are removed by child 05; no placeholder compatibility value is introduced here.
outcome:
  status: completed
  summary: |
    Repository browsing, repository settings, project status API work, commit
    history, branch selection, and project metadata migration now verify the
    shared live Bolt2GitHub and GitHub App connection before constructing an
    explicit GitHub App service. Token props and PAT construction branches were
    removed from these repository-facing boundaries and every affected caller.

    Disconnected repository work now shows actionable GitHub App guidance,
    retries live verification after the user connects, prevents overlapping
    readiness checks, and avoids hidden settings requests. Commit history also
    performs one live check per initial open and preserves the connection
    message when verification fails. Existing issue credential selection stays
    unchanged for child 05, and project repository/branch mappings survive the
    authentication migration.
  rationale: |
    Moving all supporting repository surfaces through one live-gated service
    factory removes duplicated auth-method branching without allowing cached
    installation state or a stored PAT to authorize work. Recovery and
    visibility behavior must be part of that contract: a connection gate that
    races, retries invisibly, or opens errors from hidden components would keep
    the dual-auth experience confusing even after PAT fallback was removed.
  lessons:
    - lesson_type: shared-live-gated-service-factory
      summary: |
        Repository surfaces should obtain the GitHub service through one helper
        that verifies the live account and installation state first; direct
        constructors make fallback and readiness behavior drift between UI
        entry points.
      tags: [auth, github-app, consistency]
      paths:
        - src/lib/utils/connectedGitHubAppService.ts
        - src/lib/utils/__tests__/connectedGitHubAppService.test.ts
    - lesson_type: visible-recoverable-auth-failure
      summary: |
        A disconnected state needs both actionable copy and a retry path.
        Single-flight initialization and a disabled refresh control prevent an
        older readiness result from overwriting a newer user-driven retry.
      tags: [auth, concurrency, recovery, ux]
      paths:
        - src/lib/components/ProjectsList.svelte
        - src/lib/components/__tests__/ProjectsList.component.test.ts
        - src/lib/components/CommitsModal.svelte
        - src/lib/components/__tests__/CommitsModal.component.test.ts
    - lesson_type: visibility-gated-auth-work
      summary: |
        Components that remain mounted while hidden must not verify auth, call
        GitHub, or surface an error overlay until the user opens them.
      tags: [auth, lifecycle, ux]
      paths:
        - src/lib/components/RepoSettings.svelte
        - src/lib/components/__tests__/RepoSettings.component.test.ts
    - lesson_type: ordered-public-contract-retirement
      summary: |
        Removing repository token props must not widen or replace the separate
        issue-token compatibility behavior assigned to the next child. Preserve
        that boundary explicitly until its own tests and callers are migrated.
      tags: [auth, contracts, incremental-migration]
      paths:
        - src/lib/components/ProjectStatus.svelte
        - src/lib/components/__tests__/ProjectStatus.component.test.ts
  review_notes:
    - source: independent reviewer /root/child04_repository_review
      severity: findings-fixed
      summary: |
        Review found four concrete issues: repository refresh could not recover
        after a failed readiness promise and could race an in-flight check;
        hidden RepoSettings performed live work and could show an unexpected
        overlay; ProjectStatus widened the existing issue placeholder behavior;
        and CommitsModal retried a rejected gate immediately while replacing
        its actionable message. All findings were fixed with focused behavioral
        coverage.
    - source: independent reviewer /root/child04_repository_review final
      severity: ready
      summary: |
        Final read-only review found no remaining issues and confirmed the live
        gate, removed repository token props, preserved child-05 issue boundary,
        race-free retry behavior, hidden-component gating, actionable errors,
        mapping preservation, and MAID scope fidelity.
  validation:
    - command:
        - pnpm
        - exec
        - vitest
        - run
        - src/lib/utils/__tests__/connectedGitHubAppService.test.ts
        - src/lib/components/__tests__/CommitsModal.component.test.ts
        - src/lib/components/__tests__/RepoSettings.component.test.ts
        - src/lib/components/__tests__/ProjectsList.component.test.ts
        - src/lib/components/__tests__/ProjectStatus.component.test.ts
        - src/lib/services/__tests__/ProjectSettingsMigrationService.test.ts
        - src/popup/components/__tests__/BranchSelectionModal.component.test.ts
        - src/popup/components/__tests__/TabsView.component.test.ts
      status: failed-red-phase
      summary: The initial focused contract failed 9 of 167 tests because the shared helper did not exist and repository surfaces still accepted tokens, selected PAT, forwarded credentials, or used token-era guidance.
    - command:
        - ./scripts/maid
        - test
        - --manifest
        - manifests/04-github-app-only-repository-surfaces.manifest.yaml
      status: passed
      summary: All five declared commands passed, including 8 focused files with 174 tests, behavioral validation, lint, type checking, and a production build.
    - command:
        - ./scripts/maid
        - validate
        - manifests/04-github-app-only-repository-surfaces.manifest.yaml
        - --mode
        - implementation
      status: passed
      summary: Every declared production and behavioral artifact passed implementation validation.
