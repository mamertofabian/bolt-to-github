# draft-kind: child-planning-inventory
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: |
  Detect route, API, admin, upload, billing, webhook, login, signup, and
  dashboard surface changes using deterministic path and lightweight content
  heuristics for the Production Readiness Snapshot module.
description: |
  Child draft for the b2g-production-readiness-snapshot parent epic, derived
  from docs/b2g_production_readiness_snapshot_reference.md sections 8.6, 11,
  12, 13, 18, and 19.3 Child 8.

  The upstream PRS domain, diff, path-classification, and normalized text-file
  contracts now exist. This slice adds only the deterministic detector and its
  data-driven route rules; wiring detector output into the composer remains a
  later orchestration concern.

  Rationale:
  - Normalize route evidence to route paths where framework conventions allow
    it, so users see public surface changes rather than raw filenames only.
  - Keep framework-specific route rules data-driven enough to add future
    frameworks without rewriting the detector.
  - Use content heuristics only as supporting evidence; path and diff evidence
    remain the primary deterministic inputs.
type: feature
files:
  create:
    - path: src/production-readiness/detectors/publicSurfaceDetector.ts
      artifacts:
        - kind: function
          name: detectPublicSurfaceSignals
          args:
            - name: input
              type: PublicSurfaceDetectorInput
          returns: PublicSurfaceDetectionResult
          description: |
            Detects added or changed route/API surface, admin/upload/billing/
            webhook/auth/dashboard route names, public assets, CORS config, and
            request/response middleware hints from candidate/base diffs.
        - kind: interface
          name: PublicSurfaceDetectorInput
          description: Candidate/base path and text context needed for public
            surface route and API detection.
        - kind: attribute
          of: PublicSurfaceDetectorInput
          name: changedFiles
          type: FileDiffEntry[]
        - kind: attribute
          of: PublicSurfaceDetectorInput
          name: candidateFiles
          type: PrsTextFile[]
        - kind: interface
          name: PublicSurfaceDetectionResult
          description: Public-surface detector signals and normalized route
            evidence.
        - kind: attribute
          of: PublicSurfaceDetectionResult
          name: signals
          type: ReadinessSignal[]
        - kind: attribute
          of: PublicSurfaceDetectionResult
          name: routes
          type: PublicRouteEvidence[]
    - path: src/production-readiness/rules/public-surface-rules.ts
      artifacts:
        - kind: function
          name: normalizePublicRoutePath
          args:
            - name: filePath
              type: string
          returns: string | null
          description: Normalizes supported Next.js app/pages route files and API
            route files into user-facing route paths.
        - kind: function
          name: classifyPublicSurfaceHints
          args:
            - name: filePath
              type: string
            - name: content
              type: string | undefined
          returns: PublicSurfaceHint[]
          description: |
            Applies deterministic path and lightweight content rules for API,
            privileged, upload, integration, public-asset, CORS, middleware,
            and route-declaration hints.
        - kind: type
          name: PublicSurfaceHint
          type: "'api' | 'admin' | 'upload' | 'billing' | 'webhook' | 'auth' | 'login'
            | 'signup' | 'dashboard' | 'settings' | 'callback' | 'form' | 'cors' |
            'middleware' | 'public_asset'"
          description: Public-surface hint classes used by route detector evidence
            and signal composition.
        - kind: interface
          name: PublicRouteEvidence
          description: Normalized route evidence for route, API, and public-surface
            changes.
        - kind: attribute
          of: PublicRouteEvidence
          name: routePath
          type: string
        - kind: attribute
          of: PublicRouteEvidence
          name: sourcePath
          type: string
        - kind: attribute
          of: PublicRouteEvidence
          name: hints
          type: PublicSurfaceHint[]
        - kind: attribute
          of: PublicRouteEvidence
          name: status
          type: "'added' | 'changed' | 'deleted' | 'renamed'"
    - path: src/production-readiness/detectors/__tests__/publicSurfaceDetector.test.ts
      artifacts:
        - kind: test_function
          name: normalizes next app and pages routes to public paths
          description: Planned fixture test for app/page, app/route, src/app, pages,
            and src/pages route conventions.
        - kind: test_function
          name: detects newly added api routes
          description: Planned fixture test for API route files and functions paths
            with route evidence.
        - kind: test_function
          name: emits surface hints for admin upload webhook billing auth and
            dashboard paths
          description: Planned fixture test for high-review public surface naming
            patterns.
        - kind: test_function
          name: detects route declarations public assets cors and middleware hints
          description: |
            Planned fixture test for lightweight Vite/React route declarations,
            public assets, CORS configuration, request/response middleware, and
            upload form content without claiming runtime reachability.
  read:
    - manifests/drafts/b2g-production-readiness-snapshot.manifest.yaml
    - manifests/01-b2g-prs-domain-models-fixtures.manifest.yaml
    - manifests/04-b2g-prs-diff-engine.manifest.yaml
    - manifests/05-b2g-prs-sensitive-path-classifier.manifest.yaml
    - manifests/07-b2g-prs-env-secret-detector.manifest.yaml
    - docs/b2g_production_readiness_snapshot_reference.md
    - src/production-readiness/domain.ts
    - src/production-readiness/detectors/sensitivePathClassifier.ts
    - src/production-readiness/detectors/envSecretDetector.ts
    - src/production-readiness/diff/diffEngine.ts
    - src/production-readiness/test-fixtures/prsFixtures.ts
validate:
  - pnpm exec vitest run
    src/production-readiness/detectors/__tests__/publicSurfaceDetector.test.ts
  - ./scripts/maid validate
    manifests/11-b2g-prs-public-surface-detector.manifest.yaml --mode behavioral
  - pnpm lint
  - pnpm check
