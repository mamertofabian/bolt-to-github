temptations:
  - risk: Do not present route heuristics as proof that a route is reachable in
      production.
    instead: Report deterministic public-surface evidence from paths and
      lightweight content hints only.
  - risk: Do not collapse API, admin, upload, webhook, billing, auth, and
      dashboard changes into one generic route message.
    instead: Preserve hint classes in evidence so the composer can prioritize
      review-worthy surfaces.
  - risk: Do not parse full application routing semantics in the MVP.
    instead: Start with documented framework path conventions and targeted content
      hints that are fixture-backed.
  - risk: Do not treat special Next.js pages such as _app, _document, and _error
      as user-facing routes.
    instead: Exclude framework special files during route normalization.
  - risk: Do not include request bodies, response bodies, or matched source
      snippets in detector evidence.
    instead: Return normalized route names, hint classes, and source paths only.
outcome:
  status: completed
  completed_at: '2026-07-31T09:33:23Z'
  summary: |
    PRS now detects deterministic public-surface changes across supported
    Next.js App and Pages Router conventions, root and server API paths, and
    common function layouts. It returns normalized route evidence plus distinct
    API, admin, upload, billing, webhook, auth, login, signup, dashboard,
    settings, callback, form, CORS, middleware, and public-asset hints.

    Lightweight React Router declarations are detected only with explicit JSX
    or credible router context. Evidence contains normalized routes, hint
    classes, statuses, and source paths without source snippets or request and
    response content.
  rationale: |
    Data-driven path rules provide useful static evidence without parsing full
    framework routing semantics or claiming runtime reachability. Separating
    normalization from signal composition keeps the detector deterministic and
    lets later orchestration integrate its output with the readiness composer.
  lessons:
    - lesson_type: route-conventions-need-exact-file-boundaries
      summary: |
        Next.js page and route-handler conventions need separate extension and
        basename rules; permissive suffix matching creates high-severity false
        positives for files such as homepage.tsx and route.tsx.
      tags: [routes, nextjs, false-positives]
      paths:
        - src/production-readiness/rules/public-surface-rules.ts
        - src/production-readiness/detectors/__tests__/publicSurfaceDetector.test.ts
    - lesson_type: gate-object-routes-on-router-context
      summary: |
        A generic object path property is not route evidence. Object-form route
        extraction requires credible router context, while explicit JSX Route
        declarations can remain filename-independent.
      tags: [react-router, heuristics, precision]
      paths:
        - src/production-readiness/detectors/publicSurfaceDetector.ts
        - src/production-readiness/detectors/__tests__/publicSurfaceDetector.test.ts
    - lesson_type: reclassify-normalized-content-routes
      summary: |
        Routes extracted from source content must be classified again by their
        normalized route names so admin, login, billing, and other high-value
        hints are not lost behind one generic route signal.
      tags: [routes, signals, evidence]
      paths:
        - src/production-readiness/detectors/publicSurfaceDetector.ts
    - lesson_type: exclude-non-runtime-sources-at-every-detector-layer
      summary: |
        Test, spec, and declaration files must be excluded from normalization,
        hint classification, and content extraction; excluding them at only one
        layer still permits misleading runtime/API signals.
      tags: [tests, declarations, false-positives]
      paths:
        - src/production-readiness/rules/public-surface-rules.ts
        - src/production-readiness/detectors/publicSurfaceDetector.ts
  review_notes:
    - source: independent reviewer /root/slice11_implementation_reviewer
      severity: needs-changes
      summary: |
        Revision 2 missed nested server/API and function conventions and allowed
        App Router filenames that merely ended in page or route.
    - source: independent reviewer /root/slice11_revision3_reviewer
      severity: needs-changes
      summary: |
        Revision 3 fixed the first findings but over-broadened server API
        fallback, accepted JSX route handlers, and missed App.tsx declarations.
    - source: independent reviewer /root/slice11_revision4_reviewer
      severity: needs-changes
      summary: |
        Revision 4 fixed those boundaries but treated arbitrary path properties
        as routes, lost hints from declared route names, and allowed test or
        declaration files to produce runtime signals.
    - source: independent reviewer /root/slice11_revision5_reviewer
      severity: ready
      summary: |
        Revision 5 had no blocking findings. The reviewer confirmed all prior
        issues were fixed, the plan lock was intact, evidence remained private
        and deterministic, and the remaining heuristic risk matched the
        manifest's no-full-routing-parser boundary.
  validation:
    - command:
        - pnpm
        - exec
        - vitest
        - run
        - src/production-readiness/detectors/__tests__/publicSurfaceDetector.test.ts
      status: passed
      summary: Four route normalization, API, hint, privacy, and heuristic behaviors passed.
    - command:
        - ./scripts/maid
        - test
        - --manifest
        - manifests/11-b2g-prs-public-surface-detector.manifest.yaml
      status: passed
      summary: All four manifest-declared commands passed.
