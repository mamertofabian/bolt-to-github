schema: '2'
goal: |
  Detect new and removed environment variable references, public variable
  introductions, .env.example coverage gaps, committed environment files, and
  possible secret-looking values while redacting every sensitive value at the
  detector boundary.
description: |
  Seventh implementation child for the b2g-production-readiness-snapshot parent
  epic, derived from reference sections 7.3, 8.4, 8.5, 11, 12, 13, 17, 18,
  19.3, and 23.

  Candidate source excerpts are bounded upstream and scanned without retaining
  or returning raw matches. Base source availability is explicit so zip-only or
  partial GitHub comparison produces a typed limitation rather than treating an
  unknown base as empty and reporting every candidate variable as new.

  Environment example availability is also explicit. Known-present examples
  are parsed for variable names only, known-absent examples can produce missing
  or removed coverage signals, and unavailable examples cannot create false
  coverage claims. Candidate-only facts such as committed .env files and
  possible secret-looking values remain detectable when base data is missing.

  Secret heuristics return only fixed pattern classes and redacted evidence.
  They never expose matched source text, never claim a vulnerability, and keep
  all signal, evidence, variable, pattern, path, and limitation ordering
  deterministic without mutating inputs.
type: feature
files:
  create:
    - path: src/production-readiness/detectors/envSecretDetector.ts
      artifacts:
        - kind: interface
          name: PrsTextFile
          description: Bounded normalized text excerpt eligible for deterministic env and secret scanning.
        - kind: attribute
          name: path
          of: PrsTextFile
          type: string
        - kind: attribute
          name: content
          of: PrsTextFile
          type: string
        - kind: type
          name: TextFileSnapshot
          type: "{ status: 'available'; files: readonly PrsTextFile[] } | { status: 'unavailable'; limitation: PartialDataNotice }"
          description: Explicit available or unavailable base source excerpts.
        - kind: type
          name: EnvExampleSnapshot
          type: "{ status: 'present'; path: string; content: string } | { status: 'absent'; path: string } | { status: 'unavailable'; path: string; limitation: PartialDataNotice }"
          description: Explicit present, known-absent, or unavailable environment example state.
        - kind: interface
          name: EnvSecretDetectorInput
          description: Candidate/base bounded text and environment example states used by the pure detector.
        - kind: attribute
          of: EnvSecretDetectorInput
          name: candidateFiles
          type: readonly PrsTextFile[]
        - kind: attribute
          of: EnvSecretDetectorInput
          name: baseFiles
          type: TextFileSnapshot
        - kind: attribute
          of: EnvSecretDetectorInput
          name: candidateEnvExample
          type: EnvExampleSnapshot
        - kind: attribute
          of: EnvSecretDetectorInput
          name: baseEnvExample
          type: EnvExampleSnapshot
        - kind: interface
          name: EnvSecretDetectionResult
          description: Sanitized deterministic detector output for the readiness composer and report generators.
        - kind: attribute
          of: EnvSecretDetectionResult
          name: signals
          type: ReadinessSignal[]
        - kind: attribute
          of: EnvSecretDetectionResult
          name: detectedVariables
          type: string[]
        - kind: attribute
          of: EnvSecretDetectionResult
          name: redactionApplied
          type: boolean
        - kind: attribute
          of: EnvSecretDetectionResult
          name: limitations
          type: PartialDataNotice[]
        - kind: function
          name: detectEnvAndSecretSignals
          args:
            - name: input
              type: EnvSecretDetectorInput
          returns: EnvSecretDetectionResult
          description: Compares env references, checks example coverage and committed env paths, and emits only sanitized secret-pattern evidence.
    - path: src/production-readiness/rules/env-patterns.ts
      artifacts:
        - kind: interface
          name: EnvReference
          description: Unique detected environment variable name and public-exposure convention without any value.
        - kind: attribute
          of: EnvReference
          name: name
          type: string
        - kind: attribute
          of: EnvReference
          name: public
          type: boolean
        - kind: function
          name: extractEnvReferences
          args:
            - name: sourceText
              type: string
          returns: EnvReference[]
          description: Detects supported process, import-meta, Deno, Bun, VITE, NEXT_PUBLIC, and PUBLIC reference syntaxes in deterministic name order.
        - kind: function
          name: extractEnvExampleVariables
          args:
            - name: sourceText
              type: string
          returns: string[]
          description: Parses unique assignment names from environment example text without retaining values.
    - path: src/production-readiness/rules/secret-patterns.ts
      artifacts:
        - kind: type
          name: SecretPatternClass
          type: "'credential_assignment' | 'provider_key_prefix' | 'private_key_block' | 'high_entropy_literal'"
        - kind: interface
          name: SecretPatternMatch
          description: Fixed redacted secret-pattern class safe for structured and rendered PRS outputs.
        - kind: attribute
          of: SecretPatternMatch
          name: pattern
          type: SecretPatternClass
        - kind: attribute
          of: SecretPatternMatch
          name: redacted
          type: 'true'
        - kind: function
          name: detectSecretLikePatterns
          args:
            - name: sourceText
              type: string
          returns: SecretPatternMatch[]
          description: Applies conservative fixed heuristics and returns unique ordered pattern classes without raw matches.
    - path: src/production-readiness/test-fixtures/prs/env-secrets.ts
      artifacts:
        - kind: interface
          name: EnvSecretDetectorFixture
          description: Fresh deterministic detector input for one env or secret scenario.
        - kind: attribute
          of: EnvSecretDetectorFixture
          name: input
          type: EnvSecretDetectorInput
        - kind: function
          name: createEnvSecretDetectorFixture
          args:
            - name: name
              type: string
          returns: EnvSecretDetectorFixture
          description: Returns syntax, coverage, committed-env, secret-pattern, or unavailable-base fixtures and rejects unknown names.
    - path: src/production-readiness/detectors/__tests__/envSecretDetector.test.ts
      artifacts:
        - kind: test_function
          name: detects env references across supported syntaxes
          description: process.env dot/bracket, import.meta.env, Deno.env.get, Bun.env, and public VITE/NEXT_PUBLIC/PUBLIC conventions produce unique sorted names without values.
        - kind: test_function
          name: reports new env vars and stale env example coverage
          description: Candidate/base comparison reports new, removed, public, missing-example, removed-example, and unavailable-base behavior without false change claims.
        - kind: test_function
          name: reports committed env files without displaying their values
          description: Nested .env, .env.local, and production/development variants are critical while example/sample/template files remain non-secret metadata.
        - kind: test_function
          name: redacts secret looking values from all detector output
          description: Credential assignments, provider prefixes, PEM blocks, and high-entropy literals yield cautious fixed labels; raw values, accessor-backed content, control text, and placeholders never enter serialized output.
  read:
    - docs/b2g_production_readiness_snapshot_reference.md
