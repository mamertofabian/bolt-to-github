      severity: changes-requested
      summary: |
        Initial review found repeated or throwing accessor leakage, false public
        references, incomplete credential formats, and unsafe env-template path
        classification. Focused red-to-green regressions established single-read
        snapshots, exact public contexts, broader fixed classes, and safe template
        exclusions.
    - source: independent reviewer subagent child07_final_review
      severity: changes-requested
      summary: |
        Performance and partial-data review found quadratic credential matching,
        TypeScript declaration false positives, false removals after candidate
        read failures, lost committed-env paths, and comment/string env matches.
        Bounded scanning, typed runtime distinctions, retained safe paths, and
        lexical filtering resolved those issues.
    - source: independent reviewer subagent child07_final_review
      severity: changes-requested
      summary: |
        Adversarial Svelte review exercised HTML comments, contractions, plain
        text, script bodies, text and attribute expressions, quoted interpolation,
        comparison operators, compact TypeScript, and tag-like formatting. A
