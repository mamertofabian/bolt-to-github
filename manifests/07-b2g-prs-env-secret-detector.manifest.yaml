# manifest-kind: active-contract
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: |
  Detect new environment variable references, .env.example coverage, committed
  .env files, and secret-looking values for the Production Readiness Snapshot
  module while redacting all secret values from outputs.
description: |
  Promoted child contract for the b2g-production-readiness-snapshot parent epic, derived
  from docs/b2g_production_readiness_snapshot_reference.md sections 8.4, 8.5,
  11, 12, 13, 17, 18, and 19.3 Child 7.

  The implementation uses explicit candidate/base availability,
  fixture-backed behavioral coverage, and detector-boundary redaction.

  Rationale:
  - Env detection should compare candidate references with base references so
    newly introduced variables are visible.
  - Secret heuristics must be conservative and must phrase findings as possible
    secret-looking values unless a secret file itself is present.
  - Redaction is part of the detector contract because every downstream output
    depends on sanitized evidence.
type: feature
files:
  create:
    - path: src/production-readiness/detectors/envSecretDetector.ts
      artifacts:
        - kind: function
          name: detectEnvAndSecretSignals
          args:
            - name: input
              type: EnvSecretDetectorInput
          returns: EnvSecretDetectionResult
          description: |
            Scans candidate/base source text and file inventory for env var
            references, .env.example coverage, committed .env files, and
            secret-looking values, returning only redacted evidence.
        - kind: interface
          name: PrsTextFile
          description: A normalized path and decoded source text supplied to
            deterministic PRS text detectors.
        - kind: attribute
          of: PrsTextFile
          name: path
          type: string
        - kind: attribute
          of: PrsTextFile
          name: content
          type: string
        - kind: interface
          name: EnvSecretDetectorInput
          description: Candidate/base file inventories and text excerpts needed to
            detect environment and secret configuration signals.
        - kind: attribute
          of: EnvSecretDetectorInput
          name: candidateFiles
          type: PrsTextFile[]
        - kind: attribute
          of: EnvSecretDetectorInput
          name: baseFiles
          type: PrsTextFile[]
        - kind: attribute
          of: EnvSecretDetectorInput
          name: baseFilesAvailable
          type: boolean
        - kind: attribute
          of: EnvSecretDetectorInput
          name: candidateEnvExample
          type: string | null
        - kind: attribute
          of: EnvSecretDetectorInput
          name: baseEnvExample
          type: string | null
        - kind: interface
          name: EnvSecretDetectionResult
          description: Sanitized env/secret detector output used by the readiness
            composer and downstream report generators.
        - kind: attribute
          of: EnvSecretDetectionResult
          name: signals
          type: ReadinessSignal[]
        - kind: attribute
          of: EnvSecretDetectionResult
          name: detectedVariables
          type: string[]
        - kind: attribute
          of: EnvSecretDetectionResult
          name: redactionApplied
          type: boolean
    - path: src/production-readiness/rules/env-patterns.ts
      artifacts:
        - kind: function
          name: extractEnvReferences
          args:
            - name: sourceText
              type: string
          returns: EnvReference[]
          description: Detects process.env, import.meta.env, Deno.env.get, Bun.env,
            VITE_*, NEXT_PUBLIC_*, and PUBLIC_* references.
        - kind: interface
          name: EnvReference
          description: Detected environment variable reference without any secret
            value.
        - kind: attribute
          of: EnvReference
          name: name
          type: string
        - kind: attribute
          of: EnvReference
          name: public
          type: boolean
    - path: src/production-readiness/rules/secret-patterns.ts
      artifacts:
        - kind: function
          name: detectSecretLikePatterns
          args:
            - name: sourceText
              type: string
          returns: SecretPatternMatch[]
          description: Detects conservative secret-looking patterns and returns only
            redacted labels, paths, and pattern classes.
        - kind: interface
          name: SecretPatternMatch
          description: Redacted secret-like pattern match suitable for structured
            and rendered PRS outputs.
        - kind: attribute
          of: SecretPatternMatch
          name: pattern
          type: string
        - kind: attribute
          of: SecretPatternMatch
          name: redacted
          type: 'true'
    - path: src/production-readiness/detectors/__tests__/envSecretDetector.test.ts
      artifacts:
        - kind: test_function
          name: detects env references across supported syntaxes
          description: Planned fixture test for process.env, import.meta.env,
            Deno.env.get, Bun.env, VITE_*, NEXT_PUBLIC_*, and PUBLIC_*.
        - kind: test_function
          name: reports new env vars and stale env example coverage
          description: Planned fixture test comparing candidate/base references and
            .env.example contents while treating an unavailable base as a limitation
            instead of invented additions.
        - kind: test_function
          name: reports committed env files without displaying their values
          description: Planned fixture test for .env, .env.local, and
            .env.production paths with redacted evidence.
        - kind: test_function
          name: redacts secret looking values from all detector output
          description: Planned fixture test proving secret-looking literals do not
            appear in signals or evidence; downstream report redaction is covered by
            the report generator and E2E fixture drafts.
  read:
    - manifests/drafts/b2g-production-readiness-snapshot.manifest.yaml
    - manifests/01-b2g-prs-domain-models-fixtures.manifest.yaml
    - manifests/02-b2g-prs-zip-inventory-normalization.manifest.yaml
    - manifests/04-b2g-prs-diff-engine.manifest.yaml
    - manifests/05-b2g-prs-sensitive-path-classifier.manifest.yaml
    - docs/b2g_production_readiness_snapshot_reference.md
    - src/production-readiness/domain.ts
    - src/production-readiness/redaction.ts
    - src/production-readiness/test-fixtures/prsFixtures.ts
validate:
