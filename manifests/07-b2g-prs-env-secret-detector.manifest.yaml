temptations:
  - risk: Do not print, snapshot, log, persist, or return secret-looking source values for easier debugging.
    instead: Return only variable names, normalized paths, fixed pattern classes, and redacted evidence flags; assert serialized detector output excludes every fixture secret.
  - risk: Do not claim a vulnerability, confirmed credential, or safe public value from a regex match or naming convention.
    instead: Use possible-secret and review-before-client-exposure wording with concrete sanitized evidence.
  - risk: Do not treat an unavailable base source or environment example as an empty one.
    instead: Preserve typed limitations, suppress unsupported new/removed or coverage comparisons, and retain independent candidate-only facts.
  - risk: Do not limit env scanning to process.env or return duplicate references based on file/input order.
    instead: Cover all documented runtime and public conventions and apply total ordering without mutating input files.
  - risk: Do not let downstream reports perform first-time redaction.
    instead: Redact at the detector boundary so every later composer, snapshot, receipt, handoff, and UI consumer receives sanitized evidence only.
outcome:
  status: completed
  summary: |
    PRS can now detect deterministic environment-variable references across
    process.env, import.meta.env, Deno, Bun, and exact SvelteKit public-env
    imports. JavaScript strings and comments, HTML comments, markup text, and
    type-only declarations remain non-executable, while script blocks, template
    interpolations, and quoted or unquoted Svelte expressions retain real env
    accesses. Candidate/base comparison reports supported additions, removals,
    public exposure, and environment-example gaps without treating unavailable
    or partially read sources as empty.

    Committed environment files and conservative secret-pattern classes produce
    critical review signals with fixed redacted evidence only. Known paths
    survive content-read failures, all accessors are snapshotted once, thrown
    values and control text cannot enter output, and credential scanning remains
    bounded on hostile input. Placeholder values and TypeScript type shapes are
    excluded without hiding typed runtime assignments.
  rationale: |
    Env and secret evidence crosses every later report and UI boundary, so the
    detector is the correct lowest layer for fixed-label redaction and partial
    data semantics. A lexical scanner is required because path-agnostic exported
    source can mix TypeScript, Svelte markup, scripts, comments, and expressions;
    confirmed markup masking prevents documentation text from becoming signals
    without making ordinary compact comparisons formatting-dependent. Explicit
    snapshot completeness keeps comparison claims conservative while retaining
    independent candidate-only facts such as committed env paths.
  lessons:
    - lesson_type: lexical-context-before-patterns
      summary: |
        Env-shaped text is meaningful only in executable context. Hybrid Svelte
        source requires comments, markup text, raw script bodies, attribute
        expressions, and ordinary TypeScript comparisons to be separated before
        applying runtime-reference patterns; masking unconfirmed tag candidates
        makes correct detection depend on harmless whitespace.
      tags:
        - env-vars
        - svelte
        - parsing
        - correctness
      paths:
        - src/production-readiness/rules/env-patterns.ts
        - src/production-readiness/detectors/__tests__/envSecretDetector.test.ts
    - lesson_type: bounded-secret-heuristics
      summary: |
        Unanchored credential-assignment regexes can become quadratic on an
        unterminated literal. Line-anchored bounded matching plus linear
        type-only context tracking preserves useful fixed classes while avoiding
        runtime denial of service and TypeScript declaration false positives.
      tags:
        - secrets
        - performance
        - typescript
      paths:
        - src/production-readiness/rules/secret-patterns.ts
        - src/production-readiness/detectors/__tests__/envSecretDetector.test.ts
    - lesson_type: partial-candidate-is-not-removal
      summary: |
        A failed candidate content read cannot prove that a base env reference
        was removed. Snapshot completeness must suppress removal claims while
        separately retaining a safely read path so committed .env files remain
        visible without exposing their values.
      tags:
        - partial-data
        - limitations
        - env-vars
      paths:
        - src/production-readiness/detectors/envSecretDetector.ts
        - src/production-readiness/detectors/__tests__/envSecretDetector.test.ts
    - lesson_type: snapshot-before-redaction
      summary: |
        Accessor-backed inputs and limitation objects must be read once into
        validated snapshots before any comparison, sorting, or serialization.
        Fixed limitations and fixed secret labels prevent thrown messages,
        second-read values, control text, and raw credentials from escaping the
        detector boundary.
      tags:
        - privacy
        - redaction
        - accessors
      paths:
        - src/production-readiness/detectors/envSecretDetector.ts
        - src/production-readiness/rules/secret-patterns.ts
  review_notes:
