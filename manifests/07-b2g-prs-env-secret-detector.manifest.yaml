temptations:
  - risk: Do not print, snapshot, log, or preserve secret-looking values for
      easier debugging.
    instead: Store only variable names, file paths, pattern labels, and redacted
      evidence flags in detector output and tests.
  - risk: Do not claim a vulnerability from a regex match.
    instead: Phrase matches as possible secret-looking values unless the candidate
      file is itself a .env-style secret file.
  - risk: Do not limit env scanning to process.env.
    instead: Cover browser and runtime conventions from the reference doc,
      including import.meta.env, Deno.env.get, Bun.env, VITE_*, NEXT_PUBLIC_*, and
      PUBLIC_*.
  - risk: Do not let downstream reports perform first-time redaction.
    instead: Return sanitized evidence from the detector so snapshot, receipt, and
      handoff rendering can only consume redacted values.
outcome:
  status: completed
  completed_at: '2026-07-31T06:51:27Z'
  summary: |
    PRS now detects environment references across Node, Vite, Deno, Bun, and
    public-variable conventions; compares candidate and base references;
    reports missing `.env.example` coverage; and identifies committed
    environment files.

    Conservative secret heuristics recognize provider prefixes, PEM blocks,
    high-entropy config values, and credential assignments across quoted,
    unquoted, template-literal, object-property, and typed TypeScript forms.
    Detector output contains only variable names, paths, pattern classes, and
    redaction flags—never matched values.
  rationale: |
    Environment and credential changes are production-sensitive but regex
    evidence is not proof of a vulnerability. Separating reference extraction,
    secret-pattern policy, and signal composition keeps the analysis
    deterministic and auditable while allowing cautious wording, explicit
    incomplete-base behavior, and redaction at the earliest output boundary.
  lessons:
    - lesson_type: redact-at-detector-boundary
      summary: |
        Raw values may be inspected transiently, but structured detector output
        must retain only safe names, paths, pattern classes, and redaction
        markers so downstream reports cannot accidentally expose a match.
      tags: [secrets, privacy, redaction]
      paths:
        - src/production-readiness/detectors/envSecretDetector.ts
        - src/production-readiness/rules/secret-patterns.ts
    - lesson_type: constrain-secret-heuristics-with-context
      summary: |
        High-entropy text is useful evidence only with conservative value
        thresholds and config-like path context. Credential assignments also
        need identifier tokenization and syntax-specific boundaries to avoid
        pairing one property or parameter with a sibling value.
      tags: [secrets, false-positives, parsing]
      paths:
        - src/production-readiness/rules/secret-patterns.ts
        - src/production-readiness/detectors/envSecretDetector.ts
        - src/production-readiness/detectors/__tests__/envSecretDetector.test.ts
    - lesson_type: separate-source-references-from-documentation
      summary: |
        Public-prefix tokens in README files and `.env.example` are
        documentation, not runtime references. Reference discovery must filter
        those inputs while the detector evaluates example coverage separately.
      tags: [env-vars, source-filtering, false-positives]
      paths:
        - src/production-readiness/detectors/envSecretDetector.ts
        - src/production-readiness/detectors/__tests__/envSecretDetector.test.ts
    - lesson_type: use-code-point-ordering
      summary: |
        Deterministic browser-extension output cannot depend on the active
        locale. Signal and evidence ordering use explicit code-point comparison,
        including for non-ASCII paths.
      tags: [determinism, ordering, browser]
      paths:
        - src/production-readiness/detectors/envSecretDetector.ts
  review_notes:
    - source: independent reviewers /root/slice07_implementation_reviewer through
        /root/slice07_revision7_reviewer
      severity: needs-changes
      summary: |
        Successive reviews identified and drove locked regressions for
        over-broad entropy matching, missing compound/config/template/quoted
        and typed syntax, locale-sensitive ordering, documentation false
        positives, and a typed-regex sibling-boundary bug.
    - source: independent reviewer /root/slice07_revision8_reviewer
      severity: ready
      summary: |
        Revision 8 had no P0/P1 findings. Independent probes confirmed
        comma-bounded adjacency behavior plus union, qualified generic, and
        multiline typed assignments without sibling false positives.
  validation:
