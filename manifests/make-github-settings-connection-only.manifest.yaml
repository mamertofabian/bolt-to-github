    - path: src/test/auth/githubAppOnlySourceGuard.test.ts
      reason: Replace the retired duplicate-editor test path in the explicit legacy-language test allowlist.
  delete:
    - path: src/lib/components/__tests__/GitHubSettings.component.test.ts
      reason: Retire the superseded duplicate-editor behavioral contract as a whole because MAID removed_artifacts cannot represent test_function artifacts.
  create:
