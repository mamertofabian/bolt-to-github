          name: settings contain no PAT selector token field or token validation action
          description: Carries forward the GitHub App-only primary setup guard.
        - kind: test_function
          name: connected settings show GitHub App identity without project repository controls
          description: Planned failing behavioral test required before promotion.
        - kind: test_function
          name: disconnected settings offer an explicit GitHub App connection without project repository controls
          description: Planned failing behavioral test required before promotion.
        - kind: test_function
          name: migration guidance directs repository changes to project surfaces without restoring the duplicate editor
          description: Planned failing behavioral test required before promotion.
        - kind: test_function
          name: rendering connection settings performs no repository discovery request
          description: Planned failing behavioral test required before promotion.
  edit:
    - path: src/lib/components/GitHubSettings.svelte
      artifacts:
        - kind: function
          name: GitHubSettings
          args:
            - name: props
              type: '{ repoOwner: string; githubAppInstallationId?: number | null; githubAppUsername?: string | null; githubAppAvatarUrl?: string | null; migrationRequired?: boolean }'
