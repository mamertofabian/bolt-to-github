outcome:
  status: completed
  completed_at: '2026-07-13T23:50:57Z'
  summary: |
    GitHub Settings is now an account-level, GitHub App connection-only surface.
    It no longer renders, validates, discovers, or saves repository owner, name,
    or branch values. ProjectStatus and ProjectsList continue to open RepoSettings
    as the authoritative project-scoped repository editor, while onboarding keeps
    its separate first-run repository setup flow.
  rationale: |
    The repository form in GitHub Settings predated the project-scoped RepoSettings
    modal and survived as a duplicate after that modal was introduced. GitHub App
    migration needs connection identity and preserved project mappings, not a
    second editor for project data. Removing the duplicate avoids stale or
    conflicting settings while retaining every reachable project editing path.
  lessons:
    - lesson_type: ui-ownership
      summary: |
        Account connection state and project repository configuration should have
        separate owners. Migration guidance can preserve and point to project
        mappings without keeping a duplicate repository form in global settings.
      tags: [github-app, settings, repository, ux]
      paths:
        - src/lib/components/GitHubSettings.svelte
        - src/lib/components/RepoSettings.svelte
        - src/lib/components/ProjectStatus.svelte
    - lesson_type: regression-contract
      summary: |
        Protect both sides of a duplicate-surface removal: assert that the global
        surface cannot edit or discover repositories and characterize the retained
        project-scoped editor with its current repository and branch values.
      tags: [testing, characterization, regression]
      paths:
        - src/lib/components/__tests__/GitHubSettings.connection.component.test.ts
        - src/lib/components/__tests__/ProjectStatus.component.test.ts
        - src/lib/components/__tests__/RepoSettings.component.test.ts
  review_notes:
