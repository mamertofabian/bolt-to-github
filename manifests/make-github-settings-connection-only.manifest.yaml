schema: '2'
goal: Make the Settings tab GitHub App connection-only and keep repository configuration project-scoped
description: |
  Remove the duplicate repository owner, repository name, branch, repository
  discovery, validation, and Save Settings controls from the popup Settings tab.
  Keep GitHubSettings responsible for visible GitHub App connection state,
  migration guidance, and the explicit user-initiated connection action.

  GitHubSettings predates RepoSettings and was the original repository editor.
  RepoSettings was added later so Home and Projects could edit each project's
  mapping in context, but the original editor was never retired. During the
  GitHub App-only migration, repository discovery was restored to GitHubSettings
  as a regression safeguard after review found that the migration had removed
  adjacent behavior. That preservation decision did not establish a product
  requirement for two editors. The current duplicate surfaces can disagree
  because GitHubSettings maintains local drafts while RepoSettings and the
  project store hold the authoritative mapping.

  Repository owner remains required application state and remains available to
  GitHub operations, but it is derived from the connected App identity and does
  not need a read-only form control. Repository name and branch remain required
  per-project data. RepoSettings, reached from Home project details and project
  entries, remains their authoritative editor. Connected projects also receive
  a default mapping from the Bolt project ID, so removing the Settings-tab form
  does not remove the initial configuration or recovery path.

  This intentionally alters behavior preserved by the completed primary setup
  and E2E error-flow contracts. Promotion must supersede those contracts while
  carrying forward every unaffected GitHub App setup, migration, repository
  validation, push-error, and fast-gate artifact and validation command.
temptations:
  - risk: Do not fix the screenshot mismatch by synchronizing the duplicate GitHubSettings repository drafts.
    instead: Remove the duplicate project editor and keep RepoSettings as the only repository-name and branch editing surface.
  - risk: Do not remove repoOwner, repoName, branch, or projectSettings from stores, storage, or GitHub runtime operations.
    instead: Remove only the redundant Settings-tab controls and event wiring; preserve the existing per-project data contract and automatic default mapping.
  - risk: Do not add another Settings-tab button that launches a second copy or orchestration path for RepoSettings.
    instead: Use concise copy directing users to the existing Home or Projects repository settings entry points.
  - risk: Do not leave repository discovery calls, draft state, save callbacks, or save/error forwarding behind after their controls are removed.
    instead: Delete the unreachable component logic and remove the corresponding SettingsTabContent, TabsView, and App event plumbing in the same change.
  - risk: Do not weaken repository validation because GitHubSettings no longer uses it.
    instead: Keep validateRepositoryName and all RepoSettings validation behavior covered by the existing project-scoped tests and superseding contract.
type: fix
supersedes:
  - 02-github-app-only-primary-setup
  - repair-e2e-error-flow-fast-gate
