    - path: src/popup/components/__tests__/SettingsTabContent.component.test.ts
      artifacts:
        - kind: test_function
          name: settings tab forwards GitHub App state without PAT bindings
          description: Carries forward the GitHub App-only settings boundary guard.
        - kind: test_function
          name: settings tab keeps account and global preferences without project repository controls
          description: Planned failing behavioral test required before promotion.
    - path: src/popup/components/__tests__/TabsView.component.test.ts
      artifacts:
