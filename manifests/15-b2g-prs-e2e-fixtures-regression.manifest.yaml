temptations:
  - risk: Do not make fixture tests depend on live GitHub API calls, current time,
      or real user exports.
    instead: Use synthetic project fixtures, fixed timestamps, mocked base trees,
      and golden output files.
  - risk: Do not only test each detector in isolation and assume the pipeline
      works.
    instead: Run representative fixtures through inventory, diff, detectors,
      composer, and reports together.
  - risk: Do not update golden files casually to make a regression pass.
    instead: Treat golden diffs as behavioral changes that require reviewing the
      parent reference and child manifests.
  - risk: Do not let secret fixture values appear in snapshot JSON, Markdown,
      logs, or assertion failure messages.
    instead: Use known sentinel secrets and assert their absence from all
      serialized pipeline outputs.
outcome:
  status: completed
  completed_at: '2026-08-01T05:03:34Z'
  summary: |
    Added four deterministic Vitest integration fixtures that exercise the PRS
    ZIP inventory, synthetic GitHub base, diff, detectors, history, composer,
    receipt, handoff, and commit-marker layers together. Readable golden
    summaries and full-output SHA-256 digests now lock Green, Yellow, secret
    Red, and history-baseline Red behavior without live network or browser I/O.
  rationale: |
    A pure integration harness gives the final PRS slice broad composition
    confidence while keeping fixtures deterministic and privacy-safe. Exact
    replacement-aware line deltas preserve diff and history semantics; digesting
    complete outputs catches renderer and evidence regressions without placing
    fixture secrets or verbose reports in assertion diagnostics.
  lessons:
    - lesson_type: normalize-cross-realm-zip-bytes
      summary: |
        Wrap TextEncoder output in a native Uint8Array before passing it to
        fflate in jsdom tests, and model Bolt exports with the literal project
        wrapper consumed by ZIP inventory normalization.
      tags: [fixtures, zip, vitest]
      paths:
        - src/lib/prs/__tests__/prsPipeline.fixtures.test.ts
    - lesson_type: pin-complete-outputs-with-readable-digests
      summary: |
        Keep readable snapshot fields in golden JSON while hashing complete
        snapshots and rendered outputs so regression coverage stays exhaustive
        without emitting potentially sensitive content in assertion diffs.
      tags: [golden-tests, privacy, regression]
      paths:
        - src/lib/prs/__tests__/prsPipeline.fixtures.test.ts
        - test/golden/prs/secret-file.snapshot.json
    - lesson_type: preserve-replacement-line-semantics
      summary: |
        Synthetic diff fixtures must count replaced lines as additions and
        deletions rather than only comparing total line counts, or downstream
        history and readiness metrics become misleading.
      tags: [diff, history, fixtures]
      paths:
        - src/lib/prs/__tests__/prsPipeline.fixtures.test.ts
