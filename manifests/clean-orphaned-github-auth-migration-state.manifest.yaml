outcome:
  status: completed
  summary: |
    The GitHub App migration classifier now treats an independently persisted
    PAT preference as migration-required even when no credential was saved,
    and it cleans every obsolete local authentication key from prompt-only
    states without showing false migration guidance.
  rationale: |
    Older settings UI persisted preferredAuthMethod separately, so checking
    only authenticationMethod and githubToken left a reachable legacy state
    behind. Reusing the complete legacy-state predicate for cleanup and adding
    preferredAuthMethod to PAT selection closes that gap while preserving the
    existing marker-first credential deletion order and repository settings.
  lessons:
    - lesson_type: legacy-data-classification
      summary: |
        Independently persisted preference keys are behavioral evidence, not
        harmless metadata. Migration classifiers must distinguish selection
        evidence from prompt bookkeeping while cleaning both forms of stale
        state.
      tags:
        - auth
